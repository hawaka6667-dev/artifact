<!doctype html>

  <title>Artifact</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { max-width: 48rem; margin: 0 auto; padding: 3rem 1.5rem; line-height: 1.6; }
    h1 { margin-bottom: .25rem; }
    .intro, footer { opacity: .75; }
    ul { list-style: none; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 20rem), 1fr)); gap: 1rem; }
    li { border: 1px solid; border-radius: .75rem; overflow: hidden; }
    li a { display: block; text-decoration: none; }
    li a:focus-visible { outline: 3px solid currentColor; outline-offset: -3px; }
    li img { display: block; width: 100%; height: auto; aspect-ratio: 4 / 3; object-fit: cover; }
    .card-text { padding: 1rem 1.25rem; }
    li p { margin: .25rem 0 0; }
    a { color: inherit; }
    footer { margin-top: 3rem; font-size: .875rem; }
  </style>
</head>

  <header>

  <main>
