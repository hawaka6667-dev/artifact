<title>微生物建模栈</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: floating top bar (tabs + language switch) over three pages: models (scale stack + 3D stage), feedback, monitor. Palette from H&E staining: hematoxylin indigo + eosin pink. */
:root {
  --bg: #fbf3f6; --panel: #ffffff; --fg: #2a2236; --muted: #6c6180; --line: #ead9e1;
  --h: #4a3f9e; --e: #d8456b; --sel: #f1e8fa; --on-h: #ffffff;
  --good: #1f8f5a; --warn: #b7791f; --bad: #c0392b;
  --stage-a: #f9e6ee; --stage-b: #e9e1f5;
  --k-virus: #6f5de0; --k-bac: #1f8f80; --k-animal: #d8456b; --k-plant: #4a9a35; --k-fungi: #b8860b; --k-arthro: #8a6244;
  --display: 'Space Grotesk', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --body: 'Inter', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #130f1f; --panel: #1b1529; --fg: #efe6f3; --muted: #a99bbd; --line: #33284a;
    --h: #a79bff; --e: #ff7a9c; --sel: #2a2045; --on-h: #130f1f;
    --good: #5fd39a; --warn: #e8b84a; --bad: #ff7a7a;
    --stage-a: #2e1c40; --stage-b: #120d22;
    --k-virus: #a99dff; --k-bac: #5fd3c3; --k-animal: #ff7a9c; --k-plant: #93d67c; --k-fungi: #e8b84a; --k-arthro: #d0a27a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #130f1f; --panel: #1b1529; --fg: #efe6f3; --muted: #a99bbd; --line: #33284a;
  --h: #a79bff; --e: #ff7a9c; --sel: #2a2045; --on-h: #130f1f;
  --good: #5fd39a; --warn: #e8b84a; --bad: #ff7a7a;
  --stage-a: #2e1c40; --stage-b: #120d22;
  --k-virus: #a99dff; --k-bac: #5fd3c3; --k-animal: #ff7a9c; --k-plant: #93d67c; --k-fungi: #e8b84a; --k-arthro: #d0a27a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.6 var(--body); padding-block: 0 32px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 30; }
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* floating bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); }
.bar-in { max-width: 1200px; margin: 0 auto; padding-block: 10px; display: flex; align-items: center; gap: 12px 20px; flex-wrap: wrap; }
.brand { display: flex; flex-direction: column; min-width: 0; margin-right: auto; }
.brand b { font: 700 18px/1.2 var(--display); letter-spacing: -0.01em; }
.brand span { font-size: 11px; color: var(--muted); }
.tabs { display: flex; gap: 4px; }
.tabs a { color: var(--muted); text-decoration: none; font: 500 13px/1 var(--body); padding: 8px 12px; border-radius: 8px; border: 1px solid transparent; }
.tabs a:hover { color: var(--fg); background: var(--sel); }
.tabs a[aria-current="page"] { color: var(--fg); border-color: var(--line); background: var(--panel); box-shadow: inset 0 -2px 0 var(--e); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--panel); }
.seg button { font: 500 12px/1 var(--body); color: var(--fg); background: transparent; border: 0; padding: 8px 12px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--h); color: var(--on-h); }
.btn { font: 500 12px/1 var(--body); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; background: var(--panel); padding: 8px 12px; cursor: pointer; }
.btn:hover { background: var(--sel); }
.btn[aria-pressed="true"] { background: var(--h); color: var(--on-h); border-color: var(--h); }
.btn:disabled { opacity: .55; cursor: default; }
.btn.primary { background: var(--h); color: var(--on-h); border-color: var(--h); }
a:focus-visible, button:focus-visible, select:focus-visible, textarea:focus-visible, input:focus-visible { outline: 2px solid var(--e); outline-offset: 2px; }

.wrap { max-width: 1200px; margin: 16px auto 0; display: flex; flex-direction: column; gap: 16px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
.grid { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 16px; align-items: start; }
.right { display: flex; flex-direction: column; gap: 16px; min-width: 0; }

/* scale stack */
.stack { padding: 12px 0 6px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 64px); max-height: calc(100vh - 90px); overflow-y: auto; }
.stack h2 { font: 500 11px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 12px 10px; }
.ruler { position: relative; height: 16px; margin: 0 12px 4px; font: 400 10px/1 var(--mono); color: var(--muted); }
.ruler span { position: absolute; top: 0; transform: translateX(-50%); white-space: nowrap; }
.ruler span:first-child { transform: none; }
.ruler span:last-child { transform: translateX(-100%); }
#list { list-style: none; margin: 0; padding: 0; }
.item { width: 100%; text-align: left; border: 0; background: transparent; color: var(--fg); cursor: pointer; padding: 9px 12px 10px; display: grid; gap: 6px; font-family: var(--body); }
.item:hover { background: var(--sel); }
.item[aria-current="true"] { background: var(--sel); box-shadow: inset 0 0 0 1.5px var(--h); }
.item .row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.item .nm { font-weight: 600; font-size: 14px; }
.item .sz { font: 500 11px/1 var(--mono); color: var(--muted); white-space: nowrap; }
.track { position: relative; height: 4px; border-radius: 2px; background: var(--line); }
.pip { position: absolute; top: 50%; width: 10px; height: 10px; border-radius: 50%; transform: translate(-50%, -50%); background: var(--kc); box-shadow: 0 0 0 2px var(--panel); }

/* stage */
.stage { position: relative; height: clamp(340px, 62vh, 560px); overflow: hidden; background: radial-gradient(ellipse at 50% 42%, var(--stage-a), var(--stage-b) 75%); }
#gl { position: absolute; inset: 0; cursor: grab; }
#gl:active { cursor: grabbing; }
#gl canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.badge { position: absolute; left: 12px; top: 12px; display: flex; flex-direction: column; gap: 2px; pointer-events: none; max-width: 60%; }
.badge b { font: 700 18px/1.2 var(--display); }
.badge i { font: 400 12px/1.2 var(--mono); color: var(--muted); font-style: italic; }
.ctl { position: absolute; right: 12px; bottom: 12px; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.hint { position: absolute; left: 12px; bottom: 12px; font: 400 11px/1.3 var(--mono); color: var(--muted); max-width: 40%; pointer-events: none; }
.scale { position: absolute; left: 50%; bottom: 52px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 3px; pointer-events: none; font: 500 11px/1 var(--mono); color: var(--fg); }
.scale i { display: block; height: 7px; border: 1.5px solid var(--fg); border-top: 0; min-width: 4px; }
.nogl { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); padding: 24px; text-align: center; }

/* info */
.info { padding: 16px; display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 20px; }
.info h3 { font: 700 20px/1.2 var(--display); margin: 0 0 2px; }
.info .en2 { color: var(--muted); font-size: 13px; margin: 0 0 10px; font-style: italic; }
.info p { margin: 0 0 10px; max-width: 65ch; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 4px; }
.stat { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
.stat small { display: block; font: 400 10px/1.2 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.stat strong { font: 500 14px/1.4 var(--mono); font-variant-numeric: tabular-nums; }
.parts h4, .sec-h { font: 500 11px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
.parts ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.parts li { display: grid; grid-template-columns: 14px minmax(0, 1fr); gap: 8px; align-items: baseline; }
.parts .sw { display: block; width: 12px; height: 12px; border-radius: 3px; background: var(--c); transform: translateY(2px); border: 1px solid rgba(0,0,0,.18); }
.foot { color: var(--muted); font-size: 12px; margin: 0; max-width: 80ch; }

/* shared page furniture */
.page { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.page h1 { font: 700 26px/1.2 var(--display); margin: 0; text-wrap: balance; }
.lead { color: var(--muted); margin: 4px 0 0; max-width: 65ch; }
.card { padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.cols { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label, .field .lbl { font: 500 12px/1.2 var(--body); color: var(--muted); }
select, textarea { font: 400 14px/1.5 var(--body); color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; }
textarea { min-height: 120px; resize: vertical; }
.row2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.stars { display: inline-flex; gap: 2px; }
.stars button { font-size: 22px; line-height: 1; background: transparent; border: 0; padding: 2px 3px; cursor: pointer; color: var(--line); }
.stars button[aria-pressed="true"], .stars button.on { color: var(--e); }
.msg { min-height: 20px; font-size: 13px; color: var(--muted); }
.msg.ok { color: var(--good); } .msg.err { color: var(--bad); }
.note { border: 1px dashed var(--line); border-radius: 8px; padding: 12px; color: var(--muted); font-size: 13px; }
.entry { border-top: 1px solid var(--line); padding-top: 10px; display: flex; flex-direction: column; gap: 4px; }
.entry:first-child { border-top: 0; padding-top: 0; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font: 400 11px/1.3 var(--mono); color: var(--muted); }
.chip { font: 500 11px/1 var(--mono); border: 1px solid var(--line); border-radius: 99px; padding: 3px 8px; color: var(--fg); }
.chip.new { border-color: var(--e); color: var(--e); } .chip.done { border-color: var(--good); color: var(--good); }
.txt { white-space: pre-wrap; overflow-wrap: anywhere; }


/* self-assessment */
.dims { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
.dim { padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.dim .top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.dim h3 { font: 600 14px/1.3 var(--body); margin: 0; }
.dim .score { font: 700 24px/1 var(--display); font-variant-numeric: tabular-nums; }
.meter { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: 4px; background: var(--mc); }
.dim p { margin: 0; font-size: 13px; color: var(--muted); }
.dim.all { border-color: var(--h); }
ul.plain { margin: 0; padding-left: 18px; display: grid; gap: 8px; }
.next-item { display: flex; flex-direction: column; gap: 4px; border-top: 1px solid var(--line); padding-top: 10px; }
.next-item:first-child { border-top: 0; padding-top: 0; }
.next-item b { font-weight: 600; }
.next-item span.d { color: var(--muted); font-size: 13px; }
.pri-high { border-color: var(--e); color: var(--e); } .pri-mid { border-color: var(--warn); color: var(--warn); } .pri-low { color: var(--muted); }
.dots { letter-spacing: 2px; color: var(--e); white-space: nowrap; }
.log-item { display: grid; grid-template-columns: 90px minmax(0, 1fr); gap: 10px; border-top: 1px solid var(--line); padding-top: 10px; }
.log-item:first-child { border-top: 0; padding-top: 0; }
.log-item .v { font: 500 12px/1.6 var(--mono); color: var(--muted); }
.head-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.head-row .sec-h { margin: 0; }

/* monitor */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.tile { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: var(--panel); }
.tile small { display: block; font: 400 10px/1.2 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.tile strong { font: 500 22px/1.4 var(--mono); font-variant-numeric: tabular-nums; }
.bars { display: grid; gap: 6px; }
.bar-row { display: grid; grid-template-columns: minmax(90px, 160px) minmax(0, 1fr) 36px; gap: 8px; align-items: center; font-size: 13px; }
.bar-row .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-row .b { height: 10px; border-radius: 3px; background: var(--line); position: relative; }
.bar-row .b i { position: absolute; inset: 0 auto 0 0; border-radius: 3px; background: var(--kc); }
.bar-row .n { font: 500 12px/1 var(--mono); text-align: right; font-variant-numeric: tabular-nums; }
.tbl { overflow-x: auto; }
.tbl table { border-collapse: collapse; width: 100%; font-size: 13px; min-width: 520px; }
.tbl th { font: 500 11px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); }
.tbl td { padding: 8px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.health { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.h-item { display: flex; flex-direction: column; gap: 2px; }
.h-item small { font: 400 10px/1.2 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.h-item b { font: 500 14px/1.3 var(--mono); }
.h-item b.ok { color: var(--good); } .h-item b.no { color: var(--bad); }

@media (max-width: 860px) {
  .grid, .cols { grid-template-columns: minmax(0, 1fr); }
  .stack { position: static; max-height: none; overflow: visible; }
  #list { display: flex; overflow-x: auto; }
  .item { min-width: 168px; flex: 0 0 auto; }
  .ruler { display: none; }
  .info { grid-template-columns: minmax(0, 1fr); }
  .hint { display: none; }
  .tabs { order: 3; width: 100%; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

<header class="bar">
  <div class="bar-in gut">
    <div class="brand"><b data-i18n="ui.app.title"></b><span data-i18n="ui.app.sub"></span></div>
    <nav class="tabs" data-i18n-aria="ui.nav.label">
      <a href="#stack" data-route="stack" data-i18n="ui.nav.stack"></a>
      <a href="#review" data-route="review" data-i18n="ui.nav.review"></a>
      <a href="#monitor" data-route="monitor" data-i18n="ui.nav.monitor"></a>
    </nav>
    <div class="seg" role="group" data-i18n-aria="ui.lang.label">
      <button type="button" data-lang="zh" aria-pressed="false">中文</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
  </div>
</header>

<div class="wrap gut">
  <main class="page" id="page-stack" data-page="stack">
    <div class="grid">
      <aside class="stack panel" data-i18n-aria="ui.stack.heading">
        <h2 data-i18n="ui.stack.heading"></h2>
        <div class="ruler" aria-hidden="true">
          <span style="left:0">10 nm</span><span style="left:16.67%">0.1 µm</span><span style="left:33.33%">1 µm</span><span style="left:50%">10 µm</span><span style="left:66.67%">100 µm</span><span style="left:83.33%">1 mm</span><span style="left:100%">10 mm</span>
        </div>
        <ul id="list"></ul>
      </aside>
      <section class="right">
        <div class="stage panel" id="stage">
          <div id="gl"></div>
          <div class="badge"><b id="b-name"></b><i id="b-sci"></i></div>
          <div class="scale" id="scale" hidden><i id="scale-bar"></i><span id="scale-txt"></span></div>
          <div class="hint" data-i18n="ui.stage.hint"></div>
          <div class="ctl">
            <button class="btn" id="b-spin" type="button" data-i18n="ui.stage.rotate"></button>
            <button class="btn" id="b-cut" type="button" aria-pressed="false" data-i18n="ui.stage.cut"></button>
            <button class="btn" id="b-reset" type="button" data-i18n="ui.stage.reset"></button>
          </div>
        </div>
        <article class="info panel" id="info"></article>
      </section>
    </div>
    <p class="foot" data-i18n="ui.foot"></p>
  </main>

  <main class="page" id="page-review" data-page="review" hidden>
    <div><h1 data-i18n="ui.rv.title"></h1><p class="lead" data-i18n="ui.rv.intro"></p><p class="meta" id="rv-meta"></p></div>
    <div class="dims" id="rv-dims"></div>
    <div class="cols">
      <section class="card panel"><h2 class="sec-h" data-i18n="ui.rv.limits_title"></h2><ul class="plain" id="rv-limits"></ul></section>
      <section class="card panel"><h2 class="sec-h" data-i18n="ui.rv.next_title"></h2><div id="rv-next"></div></section>
    </div>
    <section class="card panel"><h2 class="sec-h" data-i18n="ui.rv.spec_title"></h2><div class="tbl" id="rv-spec"></div></section>
    <section class="card panel"><h2 class="sec-h" data-i18n="ui.rv.log_title"></h2><div id="rv-log"></div></section>
  </main>

  <main class="page" id="page-monitor" data-page="monitor" hidden>
    <div><h1 data-i18n="ui.mon.title"></h1><p class="lead" data-i18n="ui.mon.intro"></p></div>
    <section class="card panel"><h2 class="sec-h" data-i18n="ui.mon.runtime"></h2><div class="health" id="mon-health"></div></section>
    <section class="card panel">
      <div class="head-row"><h2 class="sec-h" data-i18n="ui.mon.models"></h2><button class="btn" id="mon-run" type="button"></button></div>
      <p class="msg" id="mon-sum" role="status"></p>
      <div class="tbl" id="mon-table"></div>
    </section>
    <section class="card panel"><h2 class="sec-h" data-i18n="ui.mon.cover"></h2><div class="bars" id="mon-cover"></div></section>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
/* ---------- helpers ---------- */
const T = window.THREE;
const V3 = (x, y, z) => new T.Vector3(x, y, z);
const MODELS = {};
const clipPlane = new T.Plane(new T.Vector3(0, 0, -1), 1e6); // constant 1e6 = cutaway off
function mat(color, o) {
  return new T.MeshStandardMaterial(Object.assign({ color, roughness: 0.5, metalness: 0.02, side: T.DoubleSide, clippingPlanes: [clipPlane] }, o));
}
function glass(color, op, o) {
  return mat(color, Object.assign({ transparent: true, opacity: op === undefined ? 0.3 : op, depthWrite: false, roughness: 0.3 }, o));
}
function rng(seed) {
  let a = seed >>> 0;
  return () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
function sphere(r, m, x, y, z, sx, sy, sz) {
  const s = new T.Mesh(new T.SphereGeometry(r, 28, 20), m);
  s.position.set(x || 0, y || 0, z || 0);
  s.scale.set(sx || 1, sy || 1, sz || 1);
  return s;
}
function fib(n) {
  const a = [], ga = Math.PI * (3 - Math.sqrt(5));
  for (let i = 0; i < n; i++) { const y = 1 - (i + 0.5) * 2 / n, r = Math.sqrt(1 - y * y), th = i * ga; a.push(V3(Math.cos(th) * r, y, Math.sin(th) * r)); }
  return a;
}
function ball(n, rad, R, sx, sy, sz) {
  const a = [];
  while (a.length < n) {
    const p = V3(R() * 2 - 1, R() * 2 - 1, R() * 2 - 1);
    if (p.length() <= 1) a.push(p.multiplyScalar(rad).multiply(V3(sx || 1, sy || 1, sz || 1)));
  }
  return a;
}
function dots(pts, r, m, R) {
  const im = new T.InstancedMesh(new T.SphereGeometry(r, 10, 8), m, pts.length), M = new T.Matrix4();
  pts.forEach((p, i) => { const s = R ? 0.7 + R() * 0.6 : 1; M.makeScale(s, s, s); M.setPosition(p); im.setMatrixAt(i, M); });
  return im;
}
function tube(pts, r, m, seg, rad, closed) {
  return new T.Mesh(new T.TubeGeometry(new T.CatmullRomCurve3(pts, !!closed), seg || 64, r, rad || 6, !!closed), m);
}
function bump(geo, amp, f) {
  const p = geo.attributes.position, v = new T.Vector3();
  for (let i = 0; i < p.count; i++) {
    v.fromBufferAttribute(p, i);

/* ---------- bacteria: one parametric builder ---------- */
function capsuleGeo(L, W, seg) {
  const r = W / 2, Lc = Math.max(0, L - W), pts = [], n = 12;
  for (let i = 0; i <= n; i++) { const a = -Math.PI / 2 + i / n * Math.PI / 2; pts.push(new T.Vector2(r * Math.cos(a), -Lc / 2 + r * Math.sin(a))); }
  for (let i = 0; i <= n; i++) { const a = i / n * Math.PI / 2; pts.push(new T.Vector2(r * Math.cos(a), Lc / 2 + r * Math.sin(a))); }
  const geo = new T.LatheGeometry(pts, seg || 32); geo.rotateZ(Math.PI / 2); return geo;
}
function makeBact(o) {
  const g = new T.Group(), body = new T.Group(), R = rng(o.seed || 1); g.add(body);
  const col = o.gram === 'pos' ? 0x7a5cc7 : o.gram === 'af' ? 0xc0392b : 0xe8849f;   // Gram / acid-fast stain colour
  const env = glass(col, o.gram === 'neg' || !o.gram ? 0.45 : 0.62, { roughness: 0.35 });
  const cyto = glass(0xfff3cf, 0.35), nuc = mat(0x4a3f9e, { roughness: 0.6 }), ribo = mat(0xe0a24a);
  const L = o.L || 3.2, W = o.W || 1, attach = [];
  let tipA = V3(L / 2, 0, 0), tipDir = V3(1, 0, 0);
  if (o.shape === 'spiral') {
    const pts = [], amp = 0.5, turns = 1.7;
    for (let i = 0; i <= 90; i++) { const s = i / 90, a = s * turns * Math.PI * 2; pts.push(V3((s - 0.5) * L, Math.cos(a) * amp, Math.sin(a) * amp)); }
    body.add(tube(pts, W / 2, env, 120, 10));
    body.add(tube(pts, W / 2 - 0.07, cyto, 120, 8));
    body.add(sphere(W / 2, env, pts[0].x, pts[0].y, pts[0].z), sphere(W / 2, env, pts[90].x, pts[90].y, pts[90].z));
    tipA = pts[90].clone(); tipDir = pts[90].clone().sub(pts[88]).normalize();
  } else if (o.shape === 'coccus') {
    const r = W / 2, cs = [];
    if (o.arr === 'diplo') cs.push(V3(-W * 0.45, 0, 0), V3(W * 0.45, 0, 0));
    else if (o.arr === 'chain') for (let i = 0; i < 4; i++) cs.push(V3((i - 1.5) * W * 0.9, 0, 0));
    else if (o.arr === 'cluster') { cs.push(V3(0, 0, 0)); fib(12).forEach(v => cs.push(v.multiplyScalar(r * 1.75))); }
    else cs.push(V3(0, 0, 0));
    cs.forEach(c => {
      body.add(sphere(r, env, c.x, c.y, c.z));
      body.add(sphere(r * 0.88, cyto, c.x, c.y, c.z));
      body.add(sphere(r * 0.42, nuc, c.x + (R() - 0.5) * r * 0.3, c.y + (R() - 0.5) * r * 0.3, c.z));
      fib(30).forEach(v => attach.push({ n: v, p: v.clone().multiplyScalar(r).add(c) }));
    });
  } else {
    body.add(new T.Mesh(capsuleGeo(L, W), env));
    if (o.capsule) body.add(new T.Mesh(capsuleGeo(L + o.capsule * 2, W + o.capsule * 2), glass(o.capsCol || 0xcfe8e0, 0.2)));
    body.add(new T.Mesh(capsuleGeo(L - 0.14, W - 0.14), cyto));
    const pts = []; for (let i = 0; i < 9; i++) pts.push(V3((R() - 0.5) * (L - W) * 0.9, (R() - 0.5) * W * 0.5, (R() - 0.5) * W * 0.5));
    body.add(tube(pts, 0.045, nuc, 80, 6, true));
    body.add(dots(ball(46, 1, R, (L - 0.3) / 2, W * 0.4, W * 0.4), 0.035, ribo, R));
    for (let i = 0; i < 160; i++) { const x = (R() - 0.5) * (L - W), a = R() * Math.PI * 2, n = V3(0, Math.cos(a), Math.sin(a)); attach.push({ n, p: V3(x, 0, 0).add(n.clone().multiplyScalar(W / 2)) }); }
  }
  const pick = (n) => attach.slice(0, n);
  if (o.fim) g.add(spikesAt(new T.CylinderGeometry(0.012, 0.012, 0.36, 4), mat(0xb8a9cc), pick(o.fim).map(a => ({ n: a.n, p: a.p.clone().add(a.n.clone().multiplyScalar(0.18)) }))));
  if (o.needles) {
    const nl = pick(o.needles).map(a => ({ n: a.n, p: a.p.clone().add(a.n.clone().multiplyScalar(0.15)) }));
    g.add(spikesAt(new T.CylinderGeometry(0.02, 0.02, 0.3, 5), mat(0x2d2470), nl));
    g.add(dots(nl.map(s => s.p.clone().add(s.n.clone().multiplyScalar(0.17))), 0.045, mat(0xe0a24a)));
  }
  const flags = [];
  if (o.fl) {
    const f = o.fl;
    for (let i = 0; i < f.n; i++) {
      let s, d;

    sp: {
      polio: { name: 'Poliovirus', desc: 'A non-enveloped icosahedral virus carrying about 7.5 kb of single-stranded RNA. It spreads by the fecal–oral route, and vaccines have pushed it back to a handful of countries.' },
      flu: { name: 'Influenza A virus', desc: 'An enveloped, roughly spherical virus. Its surface proteins hemagglutinin (HA) and neuraminidase (NA) define the subtype, such as H1N1 or H3N2. The genome comes in 8 RNA segments, so strains can swap segments by reassortment.' },
      rabies: { name: 'Rabies virus', desc: 'A bullet-shaped enveloped virus in the rhabdovirus family. The surface glycoprotein G binds host cells, and the virus travels up peripheral nerves to the central nervous system. Once symptoms appear it is almost always fatal, but prompt vaccination after exposure prevents disease.' },
      cmv: { name: 'Cytomegalovirus (HCMV)', desc: 'Human cytomegalovirus (human herpesvirus 5) is an enveloped virus about 150–200 nm across. Inside an icosahedral capsid sits roughly 235 kb of double-stranded DNA, the largest genome of any human herpesvirus. A layer of tegument proteins lies between the capsid and a glycoprotein-studded envelope. It stays latent for life and usually causes no symptoms in healthy people, but it can pass to a fetus during pregnancy and is a major risk after organ transplants and in immunodeficiency.' },
      phage: { name: 'Bacteriophage T4', desc: 'A virus that infects Escherichia coli. The icosahedral head holds about 169 kb of double-stranded DNA, the contractile tail sheath works like a syringe to inject it, and six long tail fibers recognize and grip the host.' },
      saureus: { name: 'Staphylococcus aureus', desc: 'A Gram-positive coccus that divides in several planes, so cells pile up in grape-like clusters. It lives on skin and in the nose, and can cause skin infections and enterotoxin food poisoning. Methicillin-resistant MRSA is a long-standing hospital problem.' },
      faecalis: { name: 'Enterococcus faecalis', desc: 'A Gram-positive coccus found in pairs or short chains. It is a normal gut resident, but in hospitals it can cause urinary tract infections and endocarditis, and vancomycin-resistant strains (VRE) are hard to treat.' },
      hirae: { name: 'Enterococcus hirae', desc: 'Another enterococcus, arranged in short chains. It is common in the gut of poultry and other animals, and causes human infection less often than E. faecalis.' },
      listeria: { name: 'Listeria monocytogenes', desc: 'A short Gram-positive rod that can still grow slowly at refrigerator temperature (about 4 °C). Pregnant people, newborns and immunocompromised people face the highest risk.' },
      pseudomonas: { name: 'Pseudomonas aeruginosa', desc: 'A Gram-negative rod that swims with a single polar flagellum and makes the blue-green pigment pyocyanin. It forms biofilms and is naturally resistant to many antibiotics, a regular in hospital infections and cystic fibrosis lungs.' },
      burkholderia: { name: 'Burkholderia gladioli', desc: 'A Gram-negative rod with a tuft of flagella at one end. It was named for rotting gladiolus corms, can infect the lungs of people with cystic fibrosis, and one pathovar makes bongkrekic acid, linked to fermented-rice-flour poisoning.' },
      klebsiella: { name: 'Klebsiella pneumoniae', desc: 'A Gram-negative rod wrapped in a thick polysaccharide capsule that makes colonies look slimy. It has no flagella. It causes pneumonia and urinary tract infections, and carbapenem-resistant strains are a major clinical headache.' },
      ecoli: { name: 'Escherichia coli', desc: 'The most common Gram-negative rod in the gut. Most strains are harmless, but a few (such as O157:H7) make Shiga toxin and cause disease. Flagella all over the cell drive swimming, and type 1 fimbriae help it stick.' },
      shig_dys: { name: 'Shigella dysenteriae', desc: 'A Gram-negative rod with no flagella. It uses a type III secretion “needle” to inject effector proteins into colon cells and cause bacillary dysentery. Serotype 1 strains make Shiga toxin.' },
      shig_son: { name: 'Shigella sonnei', desc: 'A Shigella species and the most common one in wealthier countries. Illness is usually milder than with S. dysenteriae, often watery diarrhea. It has no flagella and invades with a secretion needle.' },
      platelet: { name: 'Platelet', desc: 'An anucleate fragment shed by bone-marrow megakaryocytes, living about 8–10 days. When bleeding starts, platelets stick, clump and release their granules to help form a clot.' },
      cronobacter: { name: 'Cronobacter sakazakii', desc: 'A Gram-negative rod with flagella all over. It is linked to contaminated powdered infant formula and can cause newborn meningitis and necrotizing enterocolitis, which is why formula preparation temperature matters.' },
      mabs: { name: 'Mycobacterium abscessus subsp. massiliense', desc: 'A fast-growing nontuberculous mycobacterium. Its waxy mycolic-acid wall stains red in acid-fast staining and makes it naturally resistant to many antibiotics. It can infect the lungs, skin and soft tissue.' },
      hpylori: { name: 'Helicobacter pylori', desc: 'A Gram-negative spiral bacterium with 4–6 flagella at one end that corkscrews into the stomach mucus. Its urease turns urea into ammonia to neutralize nearby acid. It is linked to gastritis, ulcers and stomach cancer.' },
      salmonella: { name: 'Salmonella', desc: 'A Gram-negative rod with flagella all over, able to grow with or without oxygen. It spreads through contaminated food and water and is a leading cause of foodborne diarrhea. The next two entries are common serovars.' },
      s_ent: { name: 'Salmonella Enteritidis', desc: 'A serovar of Salmonella enterica often tied to eggs and poultry. It causes fever, cramps and diarrhea. It carries flagella and fimbriae.' },
      s_typh: { name: 'Salmonella Typhimurium', desc: 'A Salmonella serovar with a very wide host range that causes gastroenteritis. It injects effector proteins into gut lining cells through a type III secretion needle, which tricks the cell into engulfing it.' },
      candida: { name: 'Candida albicans', desc: 'An oval yeast that reproduces by budding and can also grow a hypha (germ tube) to invade tissue, a switch called dimorphism. It lives quietly in the mouth and gut, and causes candidiasis when immunity drops.' },
      rbc: { name: 'Red blood cell', desc: 'A biconcave disc with no nucleus once mature, living about 120 days. Each cell holds roughly 270 million hemoglobin molecules. The outline uses the Evans–Fung biconcave curve.' },
      wbc: { name: 'White blood cell (neutrophil)', desc: 'The most abundant white blood cell, about 50–70% of them. The nucleus has 3–5 lobes, and its granules carry bacteria-killing enzymes. It rushes to infection sites and engulfs bacteria.' },
      sperm: { name: 'Sperm cell', desc: 'The head is about 5 µm and holds the condensed nucleus, with the acrosome at the front carrying digestive enzymes. A helix of mitochondria in the midpiece powers the flagellum. The tail is shortened in this schematic model.' },
      egg: { name: 'Egg cell (oocyte)', desc: 'The largest human cell, about 0.1 mm across and barely visible to the naked eye. It is wrapped in the zona pellucida and corona radiata cells, and its cortical granules release at fertilization to block extra sperm.' },
      onion: { name: 'Onion epidermal cell', desc: 'A brick-shaped plant cell, stacked in a staggered pattern. It has a cellulose wall and one large central vacuole that pushes the nucleus against the wall. Bulb-scale epidermis sees little light, so it has no chloroplasts.' },
      mite: { name: 'House dust mite', desc: 'House dust mites are eight-legged arachnids that eat shed skin flakes and are nearly invisible to the eye. Their droppings and body fragments hold strong allergens that can trigger rhinitis and asthma.' },
      mosquito: { name: 'Asian tiger mosquito (female)', desc: 'About 4–6 mm long. A white stripe runs down the dark thorax, the abdomen has white bands, and the hind legs are banded black and white. The wings rest folded over the abdomen. Only females bite, mostly in the daytime, and the species can carry dengue, chikungunya and Zika. Modeled from a China CDC reference photograph.' },
      culex: { name: 'Northern house mosquito (female)', desc: 'About 4–6 mm long. A plain brown mosquito with a pale-banded abdomen and unbanded dark legs, biting mostly at dusk and at night and breeding in standing water around houses. Culex mosquitoes are known vectors of West Nile virus and Japanese encephalitis, though which species spreads which disease depends on the region. Modeled from the same China CDC reference photograph.' },
      fly: { name: 'Housefly', desc: 'About 6–7 mm long, with large compound eyes, four dark stripes on the thorax and bristles over its body. Its sponging mouthparts (the labellum) dab saliva onto food and soak it back up. Bristles and sticky pads on the feet let it carry pathogens mechanically between feces and food, including Salmonella and Shigella.' }
    }
  },

      hirae: { name: '海氏肠球菌', desc: '肠球菌的一种，排成短链。常见于家禽和其他动物的肠道，对人的感染比粪肠球菌少见。' },

      controls.enableDamping = true; controls.dampingFactor = 0.08;
      controls.enablePan = true; controls.screenSpacePanning = true;
      controls.minDistance = 1.5; controls.maxDistance = 16; controls.autoRotateSpeed = 1.6;
      controls.addEventListener('start', () => { interacting = true; });
      controls.addEventListener('end', () => { interacting = false; });
    } else {                                   /* fallback: plain pointer drag + wheel */
      let down = null;
      const el = renderer.domElement;
      el.addEventListener('pointerdown', e => { down = [e.clientX, e.clientY]; interacting = true; el.setPointerCapture(e.pointerId); });
      el.addEventListener('pointermove', e => { if (!down || !norm) return; norm.rotation.y += (e.clientX - down[0]) * 0.01; norm.rotation.x += (e.clientY - down[1]) * 0.01; down = [e.clientX, e.clientY]; });
      el.addEventListener('pointerup', () => { down = null; interacting = false; });
      el.addEventListener('wheel', e => { e.preventDefault(); camera.position.z = Math.max(2, Math.min(16, camera.position.z * (1 + Math.sign(e.deltaY) * 0.08))); }, { passive: false });
    }
  }
  function drawNoGl() { if (!renderer) gl.innerHTML = '<div class="nogl">' + esc(L('ui.stage.nogl')) + '</div>'; }
  function resetView() {
    if (!renderer) return;
    const aspect = gl.clientWidth / Math.max(1, gl.clientHeight);
    camera.position.set(0, 0.6, aspect < 1.1 ? 9.4 : 7.4);
    if (norm) { norm.rotation.set(0, 0, 0); }
    if (controls) { controls.target.set(0, 0, 0); controls.update(); } else camera.lookAt(0, 0, 0);
  }
  function resize() {
    if (!renderer) return;
    const w = gl.clientWidth, h = gl.clientHeight;
    if (!w || !h) return;
    renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
  }
  function build(id) {
    if (norm) {
      scene.remove(norm);
      norm.traverse(o => { if (o.geometry) o.geometry.dispose(); if (o.material) [].concat(o.material).forEach(m => m.dispose()); });
    }
    model = MODELS[id]();
    norm = new T.Group(); norm.add(model.obj);
    model.obj.updateMatrixWorld(true);
    const box = new T.Box3().setFromObject(model.fit || model.obj), size = box.getSize(new T.Vector3()), c = box.getCenter(new T.Vector3());
    norm.scale.setScalar((model.target || 3.4) / Math.max(size.x, size.y, size.z));
    model.obj.position.sub(c);
    scene.add(norm);
    resetView();
  }

  /* ---- scale bar: world units per µm from the normalised model, pixels per world unit from the camera ---- */
  const NICE = []; for (let e = -3; e <= 4; e++) [1, 2, 5].forEach(m => NICE.push(+(m * Math.pow(10, e)).toPrecision(3)));
  const fmtLen = um => (um < 1 ? Math.round(um * 1000) + ' nm' : um >= 1000 ? (um / 1000) + ' mm' : um + ' µm');
  let lastScale = '';
  function updateScale() {
    const el = $('scale');
    if (!renderer || !cur || !norm || !gl.clientHeight) { el.hidden = true; return; }
    const tgt = controls ? controls.target : V3(0, 0, 0);
    const dist = Math.max(0.01, camera.position.distanceTo(tgt));
    const pxPerWorld = gl.clientHeight / (2 * Math.tan(camera.fov * Math.PI / 360) * dist);
    const pxPerUm = pxPerWorld * ((model.target || 3.4) / cur.um);
    let v = NICE.find(n => n * pxPerUm >= 70);
    if (v === undefined) v = NICE[NICE.length - 1];
    const px = Math.round(v * pxPerUm);
    if (px > gl.clientWidth * 0.7 || px < 8) { el.hidden = true; lastScale = ''; return; }
    const k = v + '|' + px;
    if (k !== lastScale) { lastScale = k; $('scale-bar').style.width = px + 'px'; $('scale-txt').textContent = fmtLen(v); }
    el.hidden = false;
  }

  function select(id) {
    cur = byId[id];
    list.querySelectorAll('.item').forEach(b => b.setAttribute('aria-current', String(b.dataset.id === id)));
    if (renderer) build(id);
    drawInfo();
    if (window.matchMedia('(max-width: 860px)').matches) {
      const el = list.querySelector('[data-id="' + id + '"]');
      if (el && el.scrollIntoView) el.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' });
    }
  }

  const clock = new T.Clock();
  let fpsFrames = 0, fpsT0 = 0, fpsDone = false;
  function frame(now) {
    requestAnimationFrame(frame);
    if (!renderer || routeNow !== 'stack') return;
    const t = clock.getElapsedTime();
    if (model && model.tick) model.tick(t);
    if (controls) { controls.autoRotate = spin && !interacting; controls.update(); } else if (norm && spin && !interacting) norm.rotation.y += 0.01;
    if (cut) { clipPlane.normal.copy(camera.position).negate().normalize(); clipPlane.constant = 0; } else clipPlane.constant = 1e6;
    renderer.render(scene, camera);
    updateScale();
    if (!fpsDone) {
      if (!fpsT0) fpsT0 = now;
      fpsFrames++;
      if (now - fpsT0 >= 4000) { fpsDone = true; fpsVal = Math.round(fpsFrames * 1000 / (now - fpsT0)); renderHealth(); }
    }
  }

  /* ---- self-review page ---- */
  const dimScore = d => (d.v == null ? Math.round(DATA.reduce((a, x) => a + ASSESS.spec[x.id][0], 0) / DATA.length / 5 * 100) : d.v);
  const meterColor = v => (v >= 75 ? 'var(--good)' : v >= 50 ? 'var(--warn)' : 'var(--bad)');
  function renderReview() {
    const dims = ASSESS.dims.map(d => ({ k: d.k, v: dimScore(d) }));
    const overall = Math.round(dims.reduce((a, d) => a + d.v, 0) / dims.length);
    const card = (name, v, note, cls) => '<article class="dim panel ' + (cls || '') + '"><div class="top"><h3>' + esc(name) + '</h3><span class="score">' + v + '%</span></div>' +
      '<div class="meter" role="img" aria-label="' + v + '%"><i style="width:' + v + '%;--mc:' + meterColor(v) + '"></i></div>' + (note ? '<p>' + esc(note) + '</p>' : '') + '</article>';
    $('rv-dims').innerHTML = card(L('ui.rv.overall'), overall, '', 'all') + dims.map(d => card(L('ui.rv.dims.' + d.k + '.name'), d.v, L('ui.rv.dims.' + d.k + '.note'))).join('');
    $('rv-meta').textContent = L('ui.rv.version') + ' ' + ASSESS.version + ' · ' + L('ui.rv.updated') + ' ' + fmtDate(Date.parse(ASSESS.updated + 'T12:00:00Z'));
    $('rv-limits').innerHTML = ASSESS.limits.map(k => '<li>' + esc(L('ui.rv.limits.' + k)) + '</li>').join('');
    $('rv-next').innerHTML = ASSESS.next.map(n => '<div class="next-item"><div class="meta"><span class="chip pri-' + n.p + '">' + esc(L('ui.rv.pri.' + n.p)) + '</span><span>' + esc(L('ui.rv.effort')) + ' ' + n.e + '</span></div>' +
      '<b>' + esc(L('ui.rv.next.' + n.id + '.t')) + '</b><span class="d">' + esc(L('ui.rv.next.' + n.id + '.d')) + '</span></div>').join('');
    $('rv-spec').innerHTML = '<table><thead><tr><th>' + esc(L('ui.rv.col_name')) + '</th><th>' + esc(L('ui.rv.col_fid')) + '</th><th>' + esc(L('ui.rv.col_issue')) + '</th><th>' + esc(L('ui.rv.col_size')) + '</th></tr></thead><tbody>' +
      byUm.map(d => { const a = ASSESS.spec[d.id]; return '<tr><td>' + esc(spName(d.id)) + '</td><td><span class="dots" role="img" aria-label="' + a[0] + '/5">' + '●'.repeat(a[0]) + '○'.repeat(5 - a[0]) + '</span></td><td>' +
        esc(a[1] ? L('ui.rv.issue.' + a[1]) : L('ui.rv.no_issue')) + '</td><td>' + esc(d.sz) + ' · ' + esc(L('ui.rv.size_src')) + '</td></tr>'; }).join('') + '</tbody></table>';
    $('rv-log').innerHTML = ASSESS.log.map(v => '<div class="log-item"><span class="v">v' + v + '</span><span>' + esc(L('ui.rv.log.' + v)) + '</span></div>').join('');
  }

  /* ---- monitor page ---- */
  function renderHealth() {
    const item = (label, v, cls) => '<div class="h-item"><small>' + esc(label) + '</small><b class="' + (cls || '') + '">' + esc(v) + '</b></div>';
    const t = k => L('ui.mon.' + k);
    $('mon-health').innerHTML = item(t('h_gl'), renderer ? t('ok') : t('no'), renderer ? 'ok' : 'no') +
      item(t('h_ctl'), controls ? t('ok') : t('no'), controls ? 'ok' : 'no') +
      item(t('h_fps'), fpsVal ? fpsVal + ' fps' : (renderer ? t('measuring') : t('no')), fpsVal ? (fpsVal >= 30 ? 'ok' : 'no') : '') +
      item(t('h_err'), String(localErr), localErr ? 'no' : 'ok') +
      item(t('h_view'), window.innerWidth + '×' + window.innerHeight + ' @' + (window.devicePixelRatio || 1)) +
      item(t('h_lang'), lang === 'zh' ? '中文' : 'English');
  }
  function countTris(obj) {
    let n = 0;
    obj.traverse(o => { if (o.isMesh && o.geometry) { const g = o.geometry; n += (g.index ? g.index.count : g.attributes.position.count) / 3 * (o.isInstancedMesh ? o.count : 1); } });
    return Math.round(n);
  }
  async function runCheck() {
    if (chkRunning) return;
    chkRunning = true; chk = {}; renderChecks();
    for (const d of DATA) {
      await new Promise(r => setTimeout(r, 0));
      const t0 = performance.now();
      try {
        const m = MODELS[d.id]();
        if (m.tick) m.tick(0.5);
        const sz = new T.Box3().setFromObject(m.fit || m.obj).getSize(new T.Vector3());
        if (!isFinite(sz.x + sz.y + sz.z) || Math.max(sz.x, sz.y, sz.z) <= 0) throw new Error('empty bounds');
        chk[d.id] = { ok: true, ms: performance.now() - t0, tris: countTris(m.obj) };
        m.obj.traverse(o => { if (o.geometry) o.geometry.dispose(); if (o.material) [].concat(o.material).forEach(x => x.dispose()); });
      } catch (e) { chk[d.id] = { ok: false, ms: performance.now() - t0, tris: 0 }; }
      renderChecks();
    }
    chkRunning = false; renderChecks();
  }
  function renderChecks() {
    const t = k => L('ui.mon.' + k), nf = new Intl.NumberFormat(BCP[lang]);
    $('mon-run').textContent = chkRunning ? t('running') : t('run'); $('mon-run').disabled = chkRunning;
    const done = chk ? DATA.filter(d => chk[d.id]) : [], ok = done.filter(d => chk[d.id].ok);
    $('mon-sum').textContent = !chk ? t('never') : L('ui.mon.summary', { ok: ok.length, n: DATA.length, tris: nf.format(ok.reduce((a, d) => a + chk[d.id].tris, 0)), ms: Math.round(Math.max(0, ...done.map(d => chk[d.id].ms))) });
    $('mon-table').innerHTML = chk ? '<table><thead><tr><th>' + esc(t('col_name')) + '</th><th>' + esc(t('col_status')) + '</th><th>' + esc(t('col_ms')) + '</th><th>' + esc(t('col_tris')) + '</th></tr></thead><tbody>' +
      byUm.map(d => { const c = chk[d.id]; return '<tr><td>' + esc(spName(d.id)) + '</td><td>' + (c ? '<span class="chip ' + (c.ok ? 'done' : 'new') + '">' + esc(t(c.ok ? 'st_ok' : 'st_fail')) + '</span>' : '…') + '</td><td>' + (c ? Math.round(c.ms) : '') + '</td><td>' + (c ? nf.format(c.tris) : '') + '</td></tr>'; }).join('') + '</tbody></table>' : '';
    const counts = {}; DATA.forEach(d => { counts[d.k] = (counts[d.k] || 0) + 1; });
    const max = Math.max.apply(null, Object.keys(counts).map(k => counts[k]));
    $('mon-cover').innerHTML = Object.keys(counts).sort((a, b) => counts[b] - counts[a]).map(k => '<div class="bar-row" style="--kc:var(' + KIND_COLOR[k] + ')"><span class="nm">' + esc(L('kind.' + k)) + '</span><span class="b"><i style="width:' + counts[k] / max * 100 + '%"></i></span><span class="n">' + counts[k] + '</span></div>').join('');
  }
  const onError = () => { localErr++; renderHealth(); };
  window.addEventListener('error', onError);
  window.addEventListener('unhandledrejection', onError);

  /* ---- language + routing ---- */
  function applyLang() {
    document.documentElement.lang = BCP[lang];
    document.title = L('ui.app.title');
    document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = L(el.dataset.i18n); });
    document.querySelectorAll('[data-i18n-aria]').forEach(el => { el.setAttribute('aria-label', L(el.dataset.i18nAria)); });
    document.querySelectorAll('[data-lang]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
    $('b-spin').setAttribute('aria-pressed', String(spin)); $('b-cut').setAttribute('aria-pressed', String(cut));
    drawNoGl(); drawList(); drawInfo(); renderReview(); renderHealth(); renderChecks();
  }
  function setLang(l) {
    if (l === lang || LANGS.indexOf(l) < 0) return;
    lang = l;
    try { localStorage.setItem('mstack.lang', l); } catch (e) {}
    applyLang();
  }
  function route() {
    let r = (location.hash || '').slice(1);
    if (r === 'feedback') r = 'review';
    if (ROUTES.indexOf(r) < 0) r = 'stack';
    routeNow = r;
    document.querySelectorAll('[data-page]').forEach(p => { p.hidden = p.dataset.page !== r; });
    document.querySelectorAll('[data-route]').forEach(a => { if (a.dataset.route === r) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
    if (r === 'stack') resize();
    if (r === 'monitor') { renderHealth(); if (!chk && !chkRunning) runCheck(); }
  }

  /* ---- events ---- */
  document.querySelectorAll('[data-lang]').forEach(b => b.addEventListener('click', () => setLang(b.dataset.lang)));
  window.addEventListener('hashchange', route);
  list.addEventListener('click', e => { const b = e.target.closest('.item'); if (b) select(b.dataset.id); });
  $('b-spin').addEventListener('click', () => { spin = !spin; $('b-spin').setAttribute('aria-pressed', String(spin)); });
  $('b-cut').addEventListener('click', () => { cut = !cut; $('b-cut').setAttribute('aria-pressed', String(cut)); });
  $('b-reset').addEventListener('click', resetView);
  $('mon-run').addEventListener('click', runCheck);
  if (renderer && window.ResizeObserver) new ResizeObserver(resize).observe(gl);

  applyLang();
  route();
  resize();
  select('mosquito');
  requestAnimationFrame(frame);
})();
</script>
