const SRC=[

['NC1=NC=NC2=C1N=CN2C3OC(COP(=O)(O)OP(=O)(O)OP(=O)(O)O)C(O)C3O','ATP（三磷酸腺苷）','ATP (adenosine triphosphate)','细胞的“能量货币”，人体每天周转的 ATP 总量大约相当于自身体重。','The cell’s energy currency; the body recycles roughly its own weight in ATP every day.'],

function parse(s){const A=[],B=[],st=[],ring={};let prev=-1,ord=1;
 for(const ch of s.match(/Cl|[A-Z]|[=#()]|\d/g)){
  if(EL[ch]){A.push(ch);const k=A.length-1;if(prev>=0)B.push([prev,k,ord]);prev=k;ord=1}
  else if(ch=='=')ord=2;else if(ch=='#')ord=3;
  else if(ch=='(')st.push(prev);else if(ch==')')prev=st.pop();
  else if(/\d/.test(ch)){if(ring[ch]!=null){B.push([ring[ch],prev,ord]);delete ring[ch];ord=1}else ring[ch]=prev}}
 const n=A.length;
 for(let k=0;k<n;k++){const u=B.filter(b=>b[0]==k||b[1]==k).reduce((s,b)=>s+b[2],0);for(let h=EL[A[k]].v-u;h>0;h--){A.push('H');B.push([k,A.length-1,1])}}
 return{A,B}}
function formula(E){const c={};E.forEach(e=>c[e]=(c[e]||0)+1);const ks=Object.keys(c).sort();
 const o=c.C?['C',...(c.H?['H']:[]),...ks.filter(k=>k!='C'&&k!='H')]:ks;
 return o.map(k=>k+(c[k]>1?'<sub>'+c[k]+'</sub>':'')).join('')}
function lay3({A,B}){
 const n=A.length,VE={H:1,C:4,N:5,O:6,P:5,S:6,K:1,Cl:7},bs=A.map(()=>0),own=[];
 B.forEach(([a,b,o])=>{bs[a]+=o;bs[b]+=o});
 A.forEach((e,i)=>{if(e=='C'||e=='H'||e=='K')return;const l=Math.round((VE[e]-bs[i])/2);for(let k=0;k<Math.min(l,3);k++)own.push(i)});
 const P=Array.from({length:n+own.length},()=>({x:Math.random()-.5,y:Math.random()-.5,z:Math.random()-.5})),adj=new Set(B.flatMap(([a,b])=>[a+','+b,b+','+a])),flat=new Set();
 own.forEach((o,k)=>{adj.add(o+','+(n+k));adj.add((n+k)+','+o)});
 B.forEach(([a,b,o])=>{if(o>1)B.forEach(([c,d])=>{if([a,b].includes(c)||[a,b].includes(d)){flat.add(c);flat.add(d)}})});
 own.forEach((o,k)=>{if(flat.has(o))flat.add(n+k)});
 const sp=[...B.map(([a,b])=>[a,b,1]),...own.map((o,k)=>[o,n+k,.6])];
 for(let t=0;t<500;t++){const F=P.map(()=>({x:0,y:0,z:0}));
  for(let i=0;i<P.length;i++)for(let j=i+1;j<P.length;j++){if(adj.has(i+','+j))continue;const dx=P[j].x-P[i].x,dy=P[j].y-P[i].y,dz=P[j].z-P[i].z,d=Math.hypot(dx,dy,dz)||.1,f=(i>=n||j>=n?.26:.2)/(d*d*d);F[i].x-=dx*f;F[i].y-=dy*f;F[i].z-=dz*f;F[j].x+=dx*f;F[j].y+=dy*f;F[j].z+=dz*f}
  for(const [a,b,L] of sp){const dx=P[b].x-P[a].x,dy=P[b].y-P[a].y,dz=P[b].z-P[a].z,d=Math.hypot(dx,dy,dz)||.1,f=(d-L)*.5/d;F[a].x+=dx*f;F[a].y+=dy*f;F[a].z+=dz*f;F[b].x-=dx*f;F[b].y-=dy*f;F[b].z-=dz*f}
  P.forEach((p,i)=>{if(flat.has(i))F[i].z-=p.z*1.2;p.x+=F[i].x*.4;p.y+=F[i].y*.4;p.z+=F[i].z*.4})}
 const Q=P.slice(0,n),cx=Q.reduce((s,p)=>s+p.x,0)/n,cy=Q.reduce((s,p)=>s+p.y,0)/n,cz=Q.reduce((s,p)=>s+p.z,0)/n;
 Q.forEach(p=>{p.x-=cx;p.y-=cy;p.z-=cz});
 return{P:Q,ext:Math.max(...Q.map((p,i)=>Math.hypot(p.x,p.y,p.z)+EL[A[i]].r))}}
const ringOf=E=>{const s=new Set(E);return s.has('N')?'g':[...s].every(e=>e=='O'||e=='H')?'p':'y'};
const FM={'N':'NH<sub>3</sub>','NN':'N<sub>2</sub>H<sub>4</sub>','C#N':'HCN','OS(=O)(=O)O':'H<sub>2</sub>SO<sub>4</sub>','ON(=O)=O':'HNO<sub>3</sub>','Cl':'HCl','KC#N':'KCN'};

const LIB=SRC.map(([s,z,e,zf,ef])=>{const g=parse(s);return{z,e,zf,ef,g,f:FM[s]||formula(g.A),hid:HID.has(s),...lay3(g)}});
const VIS=LIB.map((m,i)=>i).filter(i=>!LIB[i].hid);
const PAL={light:{bg:'#ece9de',bond:'#5f5b50',edge:'rgba(70,60,35,.5)',hi:'rgba(255,255,255,.2)',ring:{y:'#efe2b5',g:'#cde4d2',p:'#eccbc6'}},dark:{bg:'#222220',bond:'#b9b5a8',edge:'rgba(0,0,0,.45)',hi:'rgba(255,255,255,.14)',ring:{y:'#4a4326',g:'#2f4a3b',p:'#4f3433'}}};
const dk=()=>{const t=document.documentElement.dataset.theme;return t?t=='dark':matchMedia('(prefers-color-scheme: dark)').matches};
const VIEWS=['viewer','library','builder'];
let lang='zh',cur=6,flt='all',q='',ry=.6,rx=.35,drag=null,view='viewer';
try{lang=localStorage.getItem('mol-lang')||(/^zh/i.test(navigator.language)?'zh':'en');const th=localStorage.getItem('mol-theme');if(th)document.documentElement.dataset.theme=th}catch(e){}
const $=s=>document.querySelector(s),cv=$('#cv'),reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const nm=m=>lang=='zh'?m.z:m.e,ft=m=>lang=='zh'?m.zf:m.ef,plain=h=>h.replace(/<\/?sub>/g,'');

function size(c){const d=devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;if(c.width!=Math.round(w*d)||c.height!=Math.round(h*d)){c.width=Math.round(w*d);c.height=Math.round(h*d)}const x=c.getContext('2d');x.setTransform(d,0,0,d,0,0);return[x,w,h]}
function draw(c,m,ry,rx,cyf,zm=1){
 const[x,W,H]=size(c);if(!W)return;const P=PAL[dk()?'dark':'light'];
 x.clearRect(0,0,W,H);x.fillStyle=P.bg;x.fillRect(0,0,W,H);
 const bw=Math.max(1.6,W/320),ew=Math.max(1,W/520);
 
 const U=.85*Math.min(W/2,H*Math.min(cyf,1-cyf))/m.ext/1.3*zm,cy=H*cyf,D=Math.max(6,m.ext*3.2),sy=Math.sin(ry),cyw=Math.cos(ry),sx=Math.sin(rx),cx=Math.cos(rx);
 const Q=m.P.map((p,i)=>{const x1=p.x*cyw+p.z*sy,z1=-p.x*sy+p.z*cyw,y2=p.y*cx-z1*sx,z2=p.y*sx+z1*cx,s=D/(D-z2);return{x:W/2+x1*s*U,y:cy+y2*s*U,z:z2,r:EL[m.g.A[i]].r*s*U,e:m.g.A[i]}});
 const items=[...Q.map(a=>({z:a.z,a})),...m.g.B.map(b=>({z:(Q[b[0]].z+Q[b[1]].z)/2,b}))].sort((u,v)=>u.z-v.z);
 x.lineCap='round';
 for(const it of items){
  if(it.b){const[a,b,o]=it.b,p=Q[a],r=Q[b],dx=r.x-p.x,dy=r.y-p.y,l=Math.hypot(dx,dy)||1,ux=dx/l,uy=dy/l,off=o==1?[0]:o==2?[-.11,.11]:[-.19,0,.19];
   x.strokeStyle=P.bond;x.lineWidth=bw;
   for(const f of off){const ox=-uy*f*U,oy=ux*f*U;x.beginPath();x.moveTo(p.x+ux*p.r*.75+ox,p.y+uy*p.r*.75+oy);x.lineTo(r.x-ux*r.r*.75+ox,r.y-uy*r.r*.75+oy);x.stroke()}}
  else{const a=it.a;x.beginPath();x.arc(a.x,a.y,a.r,0,7);x.fillStyle=EL[a.e].c;x.fill();x.lineWidth=ew;x.strokeStyle=P.edge;x.stroke();
   x.beginPath();x.arc(a.x-a.r*.3,a.y-a.r*.32,a.r*.42,0,7);x.fillStyle=P.hi;x.fill();
   x.fillStyle='#3a372d';x.font=`600 ${a.r*.9}px system-ui,sans-serif`;x.textAlign='center';x.textBaseline='middle';x.fillText(a.e,a.x,a.y+a.r*.05)}}}
function caption(){const m=LIB[cur];$('#cap').innerHTML=`<div class="t">${nm(m)}: ${m.f}</div><div class="f">${ft(m)}</div>`;const r=VIS.indexOf(cur);$('#pos').textContent=r<0?T[lang].h:(r+1)+' / '+VIS.length}
function thumbs(){document.querySelectorAll('#grid canvas').forEach(c=>draw(c,LIB[+c.dataset.k],.55,.3,.5))}
function grid(){const s=q.trim().toLowerCase();
 const L=LIB.map((m,i)=>[m,i]).filter(([m])=>(flt=='h'?m.hid:!m.hid&&(flt=='all'||(flt=='c')==m.g.A.includes('C')))&&(!s||(m.z+m.e+m.zf+m.ef+plain(m.f)).toLowerCase().includes(s)));
 $('#grid').innerHTML=L.map(([m,i])=>`<article class="card${i==cur?' on':''}" data-k="${i}" tabindex="0"><canvas data-k="${i}"></canvas><div class="t">${nm(m)}: ${m.f}</div><div class="f">${ft(m)}</div></article>`).join('')||`<p class="sub">${T[lang].none}</p>`;
 $('#cnt').textContent=L.length+' / '+(flt=='h'?L.length:VIS.length);thumbs()}
function applyLang(){const t=T[lang];document.documentElement.lang=lang;document.title=t.title;
 document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t[e.dataset.i]);$('#q').placeholder=t.q;
 $('#prev').setAttribute('aria-label',t.prev);$('#zi').setAttribute('aria-label',t.zin);$('#zo').setAttribute('aria-label',t.zout);$('#zr').setAttribute('aria-label',t.zrs);$('#next').setAttribute('aria-label',t.next);$('#th').setAttribute('aria-label',t.th);
 document.querySelectorAll('[data-f]').forEach(b=>{b.textContent=t[b.dataset.f];b.setAttribute('aria-pressed',b.dataset.f==flt)});
 document.querySelectorAll('[data-l]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l==lang));
 $('#lg').innerHTML=Object.entries(EL).map(([e,o])=>`<span><i style="background:${o.c}">${e}</i>${lang=='zh'?o.z:o.e}</span>`).join('');
 caption();grid()}
function route(){let v=location.hash.slice(1);if(!VIEWS.includes(v))v='viewer';view=v;
 VIEWS.forEach(n=>$('#v-'+n).classList.toggle('on',n==v));
 document.querySelectorAll('[data-v]').forEach(a=>a.dataset.v==v?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current'));
 if(v=='library')thumbs();scrollTo(0,0)}
function step(d){do{cur=(cur+d+LIB.length)%LIB.length}while(LIB[cur].hid);ry=.6;rx=.35;caption();document.querySelectorAll('.card').forEach(c=>c.classList.toggle('on',+c.dataset.k==cur))}
function pick(k){cur=k;ry=.6;rx=.35;caption();document.querySelectorAll('.card').forEach(c=>c.classList.toggle('on',+c.dataset.k==k));location.hash='viewer';route()}

const ptrs=new Map();let zm=1,pinch=null;const zc=v=>Math.max(.4,Math.min(4,v));
cv.addEventListener('pointerdown',e=>{ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});cv.setPointerCapture(e.pointerId);cv.style.cursor='grabbing';if(ptrs.size==2){const[a,b]=[...ptrs.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y)||1,z:zm};drag=null}else drag={x:e.clientX,y:e.clientY}});
$('.stage').addEventListener('wheel',e=>{e.preventDefault();const d=e.deltaY*(e.deltaMode==1?16:e.deltaMode==2?400:1)*(e.ctrlKey?3:1);zm=zc(zm*Math.exp(-d*.002))},{passive:false});
cv.addEventListener('dblclick',()=>{zm=1});
cv.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});if(ptrs.size==2&&pinch){const[a,b]=[...ptrs.values()];zm=zc(pinch.z*Math.hypot(a.x-b.x,a.y-b.y)/pinch.d);return}if(!drag)return;ry+=(e.clientX-drag.x)*.01;rx=Math.max(-1.5,Math.min(1.5,rx+(e.clientY-drag.y)*.01));drag={x:e.clientX,y:e.clientY}});
const pup=e=>{ptrs.delete(e.pointerId);pinch=null;drag=null;cv.style.cursor='grab'};cv.addEventListener('pointerup',pup);cv.addEventListener('pointercancel',pup);
$('#zi').onclick=()=>{zm=zc(zm*1.25)};$('#zo').onclick=()=>{zm=zc(zm/1.25)};$('#zr').onclick=()=>{zm=1;rx=.35};
$('#prev').onclick=()=>step(-1);$('#next').onclick=()=>step(1);
addEventListener('keydown',e=>{if(view=='viewer'&&!/INPUT/.test(document.activeElement.tagName)){if(e.key=='ArrowLeft')step(-1);if(e.key=='ArrowRight')step(1)}});
document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{lang=b.dataset.l;try{localStorage.setItem('mol-lang',lang)}catch(e){}applyLang()});
document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{flt=b.dataset.f;document.querySelectorAll('[data-f]').forEach(x=>x.setAttribute('aria-pressed',x==b));grid()});
$('#th').onclick=()=>{const t=dk()?'light':'dark';document.documentElement.dataset.theme=t;try{localStorage.setItem('mol-theme',t)}catch(e){}thumbs()};
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',thumbs);
$('#q').oninput=e=>{q=e.target.value;grid()};
$('#grid').onclick=e=>{const c=e.target.closest('[data-k]');if(c)pick(+c.dataset.k)};
$('#grid').onkeydown=e=>{if(e.key=='Enter'){const c=e.target.closest('[data-k]');if(c)pick(+c.dataset.k)}};
addEventListener('hashchange',route);
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(thumbs,150)});
(function loop(){if(view=='viewer'){if(!ptrs.size&&!reduce)ry+=.006;draw(cv,LIB[cur],ry,rx,.44,zm)}requestAnimationFrame(loop)})();
applyLang();route();
</script>
</body>
</html>
