<html lang="zh">
<head>

<title>分子知识库</title>
<style>
:root{box-sizing:border-box;padding-bottom:env(safe-area-inset-bottom,0px);--bg:#e7e4d9;--nav:#dedbd0;--card:#eeebe1;--cv:#ece9de;--tx:#34322b;--mu:#77746a;--ln:#d3cfc2;--ac:#4a473e;--acx:#eeebe1;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1c1a;--nav:#242422;--card:#272725;--cv:#222220;--tx:#e2e0d8;--mu:#9a978c;--ln:#3a3a36;--ac:#d8d5ca;--acx:#1c1c1a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c1c1a;--nav:#242422;--card:#272725;--cv:#222220;--tx:#e2e0d8;--mu:#9a978c;--ln:#3a3a36;--ac:#d8d5ca;--acx:#1c1c1a;color-scheme:dark}
html{scroll-padding-top:60px}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.6 system-ui,"PingFang SC","Microsoft YaHei",sans-serif}
.nav{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;padding:calc(10px + env(safe-area-inset-top,0px)) 18px 10px;background:var(--nav);border-bottom:1px solid var(--ln)}
.brand{font-size:16px;letter-spacing:.02em}
.nav nav{display:flex;gap:4px;flex:1 1 auto}
.nav a{color:var(--mu);text-decoration:none;padding:4px 12px;border-radius:999px;font-size:14px;white-space:nowrap}
.nav a:hover{color:var(--tx)}.nav a[aria-current]{background:var(--ac);color:var(--acx)}
.right{display:flex;gap:8px;align-items:center;margin-left:auto}
.lang{display:flex;background:var(--card);border:1px solid var(--ln);border-radius:999px;padding:2px}
button{font:inherit;color:inherit}
.lang button,.ic{border:0;background:none;cursor:pointer;border-radius:999px;font-size:13px;padding:3px 12px;color:var(--mu)}
.lang button[aria-pressed="true"]{background:var(--ac);color:var(--acx)}
.ic{border:1px solid var(--ln);background:var(--card);width:30px;height:30px;padding:0;font-size:15px}
.tag{font-size:11px;border:1px dashed currentColor;border-radius:999px;padding:0 7px;margin-left:6px;opacity:.8}
.view{display:none;max-width:860px;margin:0 auto;padding:22px 18px 56px}.view.on{display:block}
.sub{margin:0 0 14px;color:var(--mu);font-size:14px}
.stage{position:relative;border-radius:14px;overflow:hidden;background:var(--cv);border:1px solid var(--ln)}
canvas{display:block;width:100%;aspect-ratio:4/3;touch-action:none;cursor:grab}
#cap{position:absolute;left:8%;right:8%;bottom:6%;background:rgba(90,86,70,.16);backdrop-filter:blur(6px);border-radius:6px;padding:9px 14px;text-align:center;pointer-events:none}
.t{font-size:15.5px}.f{font-size:12.5px;color:var(--mu);margin-top:3px}
.arr{position:absolute;top:44%;width:36px;height:36px;border-radius:50%;border:1px solid var(--ln);background:var(--card);color:var(--tx);font-size:20px;line-height:1;cursor:pointer;opacity:.85}
.arr.l{left:10px}.arr.r{right:10px}
.zm{position:absolute;top:10px;right:10px;display:flex;flex-direction:column;gap:6px}.zm button{width:32px;height:32px;border-radius:50%;border:1px solid var(--ln);background:var(--card);color:var(--tx);font-size:16px;line-height:1;cursor:pointer;opacity:.85}
.row{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;margin-top:12px;color:var(--mu);font-size:13px}
.lg{display:flex;flex-wrap:wrap;gap:6px 16px}
.lg i,.pal i{display:inline-block;width:20px;height:20px;border-radius:50%;border:1px solid rgba(70,60,35,.5);text-align:center;font:600 10.5px/18px system-ui;color:#3a372d;margin-right:6px;vertical-align:middle}
.hint{margin:6px 0 0;font-size:12.5px;color:var(--mu)}
.box{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:22px}
.defer{border-style:dashed;background:transparent}
h2{font-size:18px;margin:0 0 8px;font-weight:600}
.defer ul{margin:12px 0;padding-left:20px;color:var(--mu)}
.pal{display:flex;gap:8px;opacity:.5;margin-top:16px}.pal i{width:28px;height:28px;line-height:26px;font-size:12px;margin:0}
.kh{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}.kh h2{margin:0 8px 0 0}.kh small{color:var(--mu);font-weight:400;font-size:13px;margin-left:6px}
input{font:inherit;font-size:13px;color:inherit;background:var(--card);border:1px solid var(--ln);border-radius:999px;padding:6px 14px;width:230px}
.chips{display:flex;gap:6px}
.chips button{font-size:13px;background:var(--card);border:1px solid var(--ln);border-radius:999px;padding:4px 14px;cursor:pointer}
.chips button[aria-pressed="true"]{border-color:var(--ac);background:var(--ac);color:var(--acx)}
button:focus-visible,input:focus-visible,a:focus-visible,.card:focus-visible{outline:2px solid #6d8fd6;outline-offset:2px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.info{margin-top:14px;padding:18px 22px}.info h2{font-size:17px;margin:0 0 12px;font-weight:600}.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:0 0 12px}.kv div{min-width:0}.kv dt{font-size:12px;color:var(--mu)}.kv dd{margin:0;font-size:14px}.facts{margin:0;padding-left:20px}.facts li{margin:6px 0}
#v-viewer{max-width:1180px}.vgrid{display:grid;gap:14px;align-items:start}.vmain{min-width:0}
@media(min-width:620px){.vgrid{grid-template-columns:minmax(0,1.3fr) minmax(250px,1fr)}.info{position:sticky;top:64px;margin-top:0;max-height:calc(100vh - 90px);overflow:auto}}
@media(max-width:619px){#v-viewer{padding-top:12px}#v-viewer>.sub{display:none}.vgrid{gap:0}.vmain{display:contents}.stage{order:1;border-radius:14px 14px 0 0;border-bottom:0}.info{order:2;margin-top:0;border-radius:0 0 14px 14px;padding:16px 18px}.row{order:3;margin-top:12px}.hint{order:4;margin:6px 0 0}#cv{aspect-ratio:16/11}#cap{display:none}}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.card .clamp{-webkit-line-clamp:3}
.sw{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mu);cursor:pointer}.sw input{width:auto;padding:0;margin:0}
.mini,.eye{font:inherit;font-size:12px;color:var(--mu);background:var(--card);border:1px solid var(--ln);border-radius:999px;padding:2px 10px;cursor:pointer}
.eye{position:absolute;top:12px;right:12px;opacity:.8;z-index:1}
.card{position:relative;background:var(--card);border:1.5px solid var(--ln);border-radius:12px;padding:8px 8px 12px;cursor:pointer;text-align:center}
.card:hover{border-color:var(--mu)}.card.on{border-color:var(--ac)}
.card canvas{border-radius:8px;cursor:pointer}
.card .t{font-size:14.5px;margin-top:8px}.card .f{padding:0 6px}
.nav{gap:4px 12px;padding:calc(7px + env(safe-area-inset-top,0px)) 14px 7px}.brand{font-size:14.5px}.nav a{padding:3px 10px;font-size:13.5px}.lang button{padding:2px 10px}.ic{width:28px;height:28px}
#v-library{max-width:1320px;padding:14px 14px 40px}#v-quality{max-width:980px}
.kh{gap:8px;margin-bottom:10px}.kh input[type=search]{width:200px;padding:5px 12px}.chips{flex-wrap:wrap;gap:5px}.chips button{font-size:12px;padding:3px 11px}
#grid.c{grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:8px}
#grid.c .card{padding:5px 5px 8px;border-radius:10px}#grid.c .card canvas{aspect-ratio:1/1;border-radius:7px}
#grid.c .card .t{font-size:12.5px;margin-top:5px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#grid.c .card .f{display:none}#grid.c .eye{top:8px;right:8px;font-size:10.5px;padding:0 7px;opacity:.7}
.card.ph{border-style:dashed}
.qgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:14px 0}.qc{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:12px 14px}.qt{font-size:12px;color:var(--mu)}.qv{font-size:24px;font-weight:600;line-height:1.3}.qs{font-size:12px;color:var(--mu);margin-bottom:8px}.bar{height:6px;background:var(--ln);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
#qroot h3{font-size:15px;margin:22px 0 8px;display:flex;align-items:center;gap:12px}.rg{margin:8px 0}.rq{display:inline-block;font-size:12px;padding:1px 9px;border-radius:999px;border:1px solid var(--ln);margin:2px 3px 2px 0}.rq.done{background:var(--card)}.rq.ph{border-style:dashed;color:var(--mu)}.rq.missing{color:#c0553d;border-color:#c0553d}.mu{color:var(--mu);font-size:12.5px}
.aud{width:100%;border-collapse:collapse;font-size:13px}.aud td{padding:6px 8px;border-top:1px solid var(--ln);vertical-align:top}.aud .an{max-width:240px}
.lv{display:inline-block;font-size:12px;padding:0 8px;border-radius:999px;border:1px solid currentColor;margin:1px 2px 1px 0}.lv-fail{color:#c0553d}.lv-warn{color:#b88a1d}.lv-info{color:var(--mu)}.lv-ok{color:#5a8f4a}.lv-na{color:var(--mu)}
.fb{display:grid;gap:8px;max-width:620px}.fb select,.fb textarea,#fbX{font:inherit;font-size:13px;color:inherit;background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:6px 10px}#fbX,.fb textarea{width:100%;box-sizing:border-box}.fbl{padding-left:18px;font-size:13px}.fbl li{margin:6px 0}
@media(max-width:560px){.brand{display:none}}
</style>
</head>

function parse(s){const A=[],B=[],st=[],ring={},nh=new Set();let prev=-1,ord=1;
 for(const tk of s.match(/\[[A-Z][a-z]?\]|[A-Z][a-z]?|[=#()]|\d/g)){
  const br=tk[0]=='[',ch=br?tk.slice(1,-1):tk;
  if(EL[ch]){A.push(ch);const k=A.length-1;if(br)nh.add(k);if(prev>=0)B.push([prev,k,ord]);prev=k;ord=1}
  else if(ch=='=')ord=2;else if(ch=='#')ord=3;
  else if(ch=='(')st.push(prev);else if(ch==')')prev=st.pop();
  else if(/\d/.test(ch)){if(ring[ch]!=null){B.push([ring[ch],prev,ord]);delete ring[ch];ord=1}else ring[ch]=prev}}
 const n=A.length;
 for(let k=0;k<n;k++){if(nh.has(k))continue;const u=B.filter(b=>b[0]==k||b[1]==k).reduce((s,b)=>s+b[2],0);for(let h=EL[A[k]].v-u;h>0;h--){A.push('H');B.push([k,A.length-1,1])}}
 return{A,B}}
function formula(E){const c={};E.forEach(e=>c[e]=(c[e]||0)+1);const ks=Object.keys(c).sort();
 const o=c.C?['C',...(c.H?['H']:[]),...ks.filter(k=>k!='C'&&k!='H')]:ks;
 return o.map(k=>k+(c[k]>1?'<sub>'+c[k]+'</sub>':'')).join('')}
function lay3({A,B}){
 const n=A.length,VE={H:1,C:4,N:5,O:6,P:5,S:6,K:1,Cl:7,F:7,Br:7,Se:6,Te:6,As:5,Sb:5,Bi:5},bs=A.map(()=>0),own=[];
 B.forEach(([a,b,o])=>{bs[a]+=o;bs[b]+=o});
 A.forEach((e,i)=>{if(e=='C'||e=='H'||e=='K')return;const l=Math.round((VE[e]-bs[i])/2);for(let k=0;k<Math.min(l,3);k++)own.push(i)});
 const P=Array.from({length:n+own.length},()=>({x:Math.random()-.5,y:Math.random()-.5,z:Math.random()-.5})),adj=new Set(B.flatMap(([a,b])=>[a+','+b,b+','+a])),flat=new Set();
 own.forEach((o,k)=>{adj.add(o+','+(n+k));adj.add((n+k)+','+o)});
 B.forEach(([a,b,o])=>{if(o>1)B.forEach(([c,d])=>{if([a,b].includes(c)||[a,b].includes(d)){flat.add(c);flat.add(d)}})});
 own.forEach((o,k)=>{if(flat.has(o))flat.add(n+k)});
 const sp=[...B.map(([a,b])=>[a,b,1]),...own.map((o,k)=>[o,n+k,.6])];
 for(let t=0,NT=P.length>110?240:500;t<NT;t++){const F=P.map(()=>({x:0,y:0,z:0}));
  for(let i=0;i<P.length;i++)for(let j=i+1;j<P.length;j++){if(adj.has(i+','+j))continue;const dx=P[j].x-P[i].x,dy=P[j].y-P[i].y,dz=P[j].z-P[i].z,d=Math.hypot(dx,dy,dz)||.1,f=d>3.5?0:(i>=n||j>=n?.26:.2)/(d*d*d);F[i].x-=dx*f;F[i].y-=dy*f;F[i].z-=dz*f;F[j].x+=dx*f;F[j].y+=dy*f;F[j].z+=dz*f}
  for(const [a,b,L] of sp){const dx=P[b].x-P[a].x,dy=P[b].y-P[a].y,dz=P[b].z-P[a].z,d=Math.hypot(dx,dy,dz)||.1,f=(d-L)*.5/d;F[a].x+=dx*f;F[a].y+=dy*f;F[a].z+=dz*f;F[b].x-=dx*f;F[b].y-=dy*f;F[b].z-=dz*f}
  P.forEach((p,i)=>{F[i].x-=p.x*.015;F[i].y-=p.y*.015;F[i].z-=p.z*.015;if(flat.has(i))F[i].z-=p.z*1.2;p.x+=F[i].x*.4;p.y+=F[i].y*.4;p.z+=F[i].z*.4})}
 const Q=P.slice(0,n),cx=Q.reduce((s,p)=>s+p.x,0)/n,cy=Q.reduce((s,p)=>s+p.y,0)/n,cz=Q.reduce((s,p)=>s+p.z,0)/n;
 Q.forEach(p=>{p.x-=cx;p.y-=cy;p.z-=cz});
 return{P:Q,ext:Math.max(1.6,...Q.map((p,i)=>Math.hypot(p.x,p.y,p.z)+EL[A[i]].r))}}

function audit(m){
 const L=(id,lv,zh,en)=>({id,lv,zh,en});
 if(m.ph)return[L('ph','warn','占位条目：结构尚未建模','Placeholder: structure not modelled yet')];
 const A=m.g.A,B=m.g.B,n=A.length,res=[],bs=A.map(()=>0);B.forEach(([a,b,o])=>{bs[a]+=o;bs[b]+=o});
 const seen=new Set([0]),q=[0];while(q.length){const x=q.pop();B.forEach(([a,b])=>{const y=a==x?b:b==x?a:-1;if(y>=0&&!seen.has(y)){seen.add(y);q.push(y)}})}
 res.push(seen.size==n?L('conn','ok','结构连通','Connected'):L('conn','fail','结构不连通','Disconnected structure'));
 const bad=n>1?A.filter((e,i)=>VAL[e]&&!VAL[e].includes(bs[i])):[];
 res.push(bad.length?L('val','fail','价键异常：'+bad.join(','),'Unusual valence: '+bad.join(',')):L('val','ok','价键合理','Valences look right'));
 if(A.some((e,i)=>(e=='N'&&bs[i]==5)||(e=='O'&&bs[i]==4)))res.push(L('sh','info','使用教科书的示意写法（不标电荷）','Uses textbook shorthand (no charges)'));
 const ref=REF[m.e],mass=A.reduce((s,e)=>s+MASS[e],0);
 res.push(ref?(Math.abs(mass-ref)<=Math.max(.08,ref*3e-4)?L('mass','ok','摩尔质量与参考值一致（'+mass.toFixed(2)+'）','Molar mass matches reference ('+mass.toFixed(2)+')'):L('mass','fail','摩尔质量与参考值不符：'+mass.toFixed(2)+' / '+ref,'Molar mass differs from reference: '+mass.toFixed(2)+' vs '+ref)):L('mass','na','没有参考值可对照','No reference value to compare'));
 res.push(m.zfs.length!=m.efs.length?L('facts','fail','中英文趣闻条数不一致','zh/en fact counts differ'):m.zfs.length>=2?L('facts','ok',m.zfs.length+' 条趣闻，中英文齐全',m.zfs.length+' facts, both languages'):L('facts','warn','只有 1 条趣闻','Only one fact'));
 if(n==1||SCHEM.has(m.s))res.push(L('sch','info',n==1?'单个原子示意':'示意结构，不是真实的单一分子',n==1?'Single-atom schematic':'Schematic structure, not a real single molecule'));

const dk=()=>{const t=document.documentElement.dataset.theme;return t?t=='dark':matchMedia('(prefers-color-scheme: dark)').matches};
const VIEWS=['viewer','library','builder','quality'];let style='glass';try{style=localStorage.getItem('mol-style')||'glass'}catch(e){}
let lang='zh',cur=6,flt='all',q='',ry=.6,rx=.35,drag=null,view='viewer';
try{lang=localStorage.getItem('mol-lang')||(/^zh/i.test(navigator.language)?'zh':'en');const th=localStorage.getItem('mol-theme');if(th)document.documentElement.dataset.theme=th}catch(e){}
const $=s=>document.querySelector(s),cv=$('#cv'),reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const nm=m=>lang=='zh'?m.z:m.e,ft=m=>lang=='zh'?m.zf:m.ef,plain=h=>h.replace(/<\/?sub>/g,'');

function size(c){const d=devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;if(c.width!=Math.round(w*d)||c.height!=Math.round(h*d)){c.width=Math.round(w*d);c.height=Math.round(h*d)}const x=c.getContext('2d');x.setTransform(d,0,0,d,0,0);return[x,w,h]}
const BOK=[[.1,.78,.09],[.9,.2,.07],[.8,.84,.12],[.16,.18,.05],[.52,.93,.04],[.62,.08,.045]];
function glassBg(x,W,H,dark,main){
 let g=x.createLinearGradient(0,0,W,H);
 if(dark){g.addColorStop(0,'#3f4348');g.addColorStop(1,'#1a1c1e')}else{g.addColorStop(0,'#eceeef');g.addColorStop(1,'#b2b8bd')}
 x.fillStyle=g;x.fillRect(0,0,W,H);
 g=x.createRadialGradient(W*.3,H*.2,0,W*.3,H*.2,W*.7);g.addColorStop(0,dark?'rgba(255,255,255,.10)':'rgba(255,255,255,.6)');g.addColorStop(1,'rgba(255,255,255,0)');
 x.fillStyle=g;x.fillRect(0,0,W,H);
 if(!main)return;const tm=Date.now()/1000;
 BOK.forEach(([fx,fy,fr],i)=>{const r=fr*W,px=fx*W+Math.sin(tm*.3+i*2)*W*.008,py=fy*H+Math.cos(tm*.25+i)*H*.012;
  const b=x.createRadialGradient(px-r*.3,py-r*.3,r*.1,px,py,r);
  b.addColorStop(0,dark?'rgba(255,255,255,.08)':'rgba(255,255,255,.35)');b.addColorStop(.8,dark?'rgba(255,255,255,.04)':'rgba(255,255,255,.1)');b.addColorStop(1,dark?'rgba(255,255,255,.2)':'rgba(255,255,255,.55)');
  x.beginPath();x.arc(px,py,r,0,7);x.fillStyle=b;x.fill()})}
const rgbOf=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)).join(',');
function glassItems(x,items,m,U,dark){
 for(const it of items){
  if(it.b){const[a,b,o]=it.b,p=m.Q[a],r=m.Q[b],dx=r.x-p.x,dy=r.y-p.y,l=Math.hypot(dx,dy)||1,ux=dx/l,uy=dy/l,nx=-uy,ny=ux,s=(p.s+r.s)/2,tw=Math.max(2,.17*U*s),sh=(nx*-.7+ny*-.7)>0?1:-1;
   for(const f of o==1?[0]:o==2?[-.17,.17]:[-.3,0,.3]){const ox=nx*f*U*s,oy=ny*f*U*s,x1=p.x+ux*p.r*.8+ox,y1=p.y+uy*p.r*.8+oy,x2=r.x-ux*r.r*.8+ox,y2=r.y-uy*r.r*.8+oy;
    x.lineCap='round';
    for(const [c,w,d] of [[dark?'rgba(255,255,255,.3)':'rgba(70,80,90,.32)',tw,0],[dark?'rgba(255,255,255,.16)':'rgba(255,255,255,.6)',tw*.72,0],['rgba(255,255,255,.92)',tw*.2,sh*tw*.2]]){
     x.strokeStyle=c;x.lineWidth=w;x.beginPath();x.moveTo(x1+nx*d,y1+ny*d);x.lineTo(x2+nx*d,y2+ny*d);x.stroke()}}}
  else{const a=it.a,r=a.r,c=rgbOf(EL[a.e].c),k=(.78+.22*Math.max(-1,Math.min(1,a.z/m.ext)))*(r<14?1.8:1);
   let g=x.createRadialGradient(a.x-r*.25,a.y-r*.3,r*.1,a.x,a.y,r);
   g.addColorStop(0,`rgba(255,255,255,${.12*k})`);g.addColorStop(.55,`rgba(${c},${.28*k})`);g.addColorStop(.9,`rgba(${c},${.62*k})`);g.addColorStop(1,`rgba(${c},${.9*k})`);
   x.beginPath();x.arc(a.x,a.y,r,0,7);x.fillStyle=g;x.fill();
   x.lineWidth=Math.max(1,r*.05);x.strokeStyle=dark?'rgba(255,255,255,.35)':'rgba(255,255,255,.8)';x.stroke();
   g=x.createRadialGradient(a.x+r*.35,a.y+r*.42,0,a.x+r*.35,a.y+r*.42,r*.6);g.addColorStop(0,'rgba(255,255,255,.5)');g.addColorStop(1,'rgba(255,255,255,0)');
   x.beginPath();x.arc(a.x,a.y,r*.96,0,7);x.fillStyle=g;x.fill();
   x.save();x.translate(a.x-r*.36,a.y-r*.43);x.rotate(-.7);x.beginPath();x.ellipse(0,0,r*.3,r*.14,0,0,7);x.fillStyle='rgba(255,255,255,.92)';x.fill();x.restore();
   x.fillStyle=dark?'rgba(255,255,255,.75)':'rgba(40,45,50,.55)';x.font=`600 ${r*.75}px system-ui,sans-serif`;x.textAlign='center';x.textBaseline='middle';x.fillText(a.e,a.x,a.y+r*.05)}}}
function draw(c,m,ry,rx,cyf,zm=1,pn=[0,0]){
 const[x,W,H]=size(c);if(!W)return;const P=PAL[dk()?'dark':'light'];
 x.clearRect(0,0,W,H);if(style=='glass')glassBg(x,W,H,dk(),c===cv);else{x.fillStyle=P.bg;x.fillRect(0,0,W,H)}
 if(m.ph){drawPh(x,W,H,dk());return}const bw=Math.max(1.6,W/320),ew=Math.max(1,W/520);
 
 const U=.85*Math.min(W/2,H*Math.min(cyf,1-cyf))/m.ext/1.3*zm*(style=='glass'?1.2:1),cy=H*cyf+pn[1],D=Math.max(6,m.ext*3.2),sy=Math.sin(ry),cyw=Math.cos(ry),sx=Math.sin(rx),cx=Math.cos(rx);
 const Q=m.P.map((p,i)=>{const x1=p.x*cyw+p.z*sy,z1=-p.x*sy+p.z*cyw,y2=p.y*cx-z1*sx,z2=p.y*sx+z1*cx,s=D/(D-z2);return{x:W/2+pn[0]+x1*s*U,y:cy+y2*s*U,z:z2,s,r:EL[m.g.A[i]].r*s*U*(style=='glass'?1.3:1),e:m.g.A[i]}});
 const items=[...Q.map(a=>({z:a.z,a})),...m.g.B.map(b=>({z:(Q[b[0]].z+Q[b[1]].z)/2,b}))].sort((u,v)=>u.z-v.z);
 x.lineCap='round';if(style=='glass'){m.Q=Q;glassItems(x,items,m,U,dk());return}
 for(const it of items){
  if(it.b){const[a,b,o]=it.b,p=Q[a],r=Q[b],dx=r.x-p.x,dy=r.y-p.y,l=Math.hypot(dx,dy)||1,ux=dx/l,uy=dy/l,off=o==1?[0]:o==2?[-.11,.11]:[-.19,0,.19];
   x.strokeStyle=P.bond;x.lineWidth=bw;
   for(const f of off){const ox=-uy*f*U,oy=ux*f*U;x.beginPath();x.moveTo(p.x+ux*p.r*.75+ox,p.y+uy*p.r*.75+oy);x.lineTo(r.x-ux*r.r*.75+ox,r.y-uy*r.r*.75+oy);x.stroke()}}
  else{const a=it.a;x.beginPath();x.arc(a.x,a.y,a.r,0,7);x.fillStyle=EL[a.e].c;x.fill();x.lineWidth=ew;x.strokeStyle=P.edge;x.stroke();
   x.beginPath();x.arc(a.x-a.r*.3,a.y-a.r*.32,a.r*.42,0,7);x.fillStyle=P.hi;x.fill();
   x.fillStyle='#3a372d';x.font=`600 ${a.r*.9}px system-ui,sans-serif`;x.textAlign='center';x.textBaseline='middle';x.fillText(a.e,a.x,a.y+a.r*.05)}}}
function legend(){$('#lg').innerHTML=[...new Set(LIB[cur].g.A)].map(e=>`<span><i style="background:${EL[e].c}">${e}</i>${lang=='zh'?EL[e].z:EL[e].e}</span>`).join('')}
function info(){const m=LIB[cur],T2=T[lang],A=m.g.A,B=m.g.B,bc=[1,2,3].map(o=>B.filter(b=>b[2]==o).length);
 $('#info').innerHTML=`<h2>${nm(m)}: ${m.f}</h2><dl class="kv"><div><dt>${T2.mm}</dt><dd>${(m.ph?m.mass:A.reduce((s,e)=>s+MASS[e],0)).toFixed(2)} g/mol</dd></div><div><dt>${T2.na}</dt><dd>${m.ph?'—':A.length}</dd></div><div><dt>${T2.bn}</dt><dd>${m.ph?'—':bc.join(' / ')}</dd></div></dl><ul class="facts">${(lang=='zh'?m.zfs:m.efs).map(x=>`<li>${x}</li>`).join('')}</ul>`}
function caption(){const m=LIB[cur];$('#cap').innerHTML=`<div class="t">${nm(m)}: ${m.f}</div><div class="f clamp">${ft(m)}</div>`;const V=visIdx(),r=V.indexOf(cur);$('#pos').textContent=r<0?T[lang].h:(r+1)+' / '+V.length;$('#hb').textContent=isH(LIB[cur])?T[lang].unhide:T[lang].hide;info();legend()}
function thumbs(){document.querySelectorAll('#grid canvas').forEach(c=>draw(c,LIB[+c.dataset.k],.55,.3,.5))}
function grid(){const s=q.trim().toLowerCase();
 const L=LIB.map((m,i)=>[m,i]).filter(([m])=>inFlt(m)&&(!s||(m.z+m.e+m.zfs.join()+m.efs.join()+plain(m.f)).toLowerCase().includes(s)));
 $('#grid').innerHTML=L.map(([m,i])=>`<article class="card${i==cur?' on':''}${m.ph?' ph':''}" data-k="${i}" tabindex="0"><button class="eye" data-e="${i}">${isH(m)?T[lang].unhide:T[lang].hide}</button><canvas data-k="${i}"></canvas><div class="t">${nm(m)}: ${m.f}</div><div class="f clamp">${ft(m)}</div></article>`).join('')||`<p class="sub">${T[lang].none}</p>`;
 $('#grid').className=compact?'c':'';$('#cnt').textContent=L.length+' / '+(flt=='h'?L.length:visIdx().length);thumbs()}
function applyLang(){const t=T[lang];document.documentElement.lang=lang;document.title=t.title;
 document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t[e.dataset.i]);$('#q').placeholder=t.q;
 $('#prev').setAttribute('aria-label',t.prev);$('#zi').setAttribute('aria-label',t.zin);$('#zo').setAttribute('aria-label',t.zout);$('#zr').setAttribute('aria-label',t.zrs);$('#zs').setAttribute('aria-label',t.zs);$('#zmv').setAttribute('aria-label',t.zmv);$('#next').setAttribute('aria-label',t.next);$('#th').setAttribute('aria-label',t.th);
 document.querySelectorAll('[data-f]').forEach(b=>{b.textContent=t[b.dataset.f];b.setAttribute('aria-pressed',b.dataset.f==flt)});
 document.querySelectorAll('[data-l]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l==lang));
 
 caption();grid();if(view=='quality')renderQ()}
function route(){let v=location.hash.slice(1);if(!VIEWS.includes(v))v='viewer';view=v;
 VIEWS.forEach(n=>$('#v-'+n).classList.toggle('on',n==v));
 document.querySelectorAll('[data-v]').forEach(a=>a.dataset.v==v?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current'));
 if(v=='library')thumbs();if(v=='quality')renderQ();scrollTo(0,0)}
function step(d){do{cur=(cur+d+LIB.length)%LIB.length}while(!vis(LIB[cur]));ry=.6;rx=.35;pan=[0,0];caption();document.querySelectorAll('.card').forEach(c=>c.classList.toggle('on',+c.dataset.k==cur))}
function toggleH(i){const s=LIB[i].s;hidSet.has(s)?hidSet.delete(s):hidSet.add(s);saveH();grid();caption()}
function pick(k){cur=k;ry=.6;rx=.35;pan=[0,0];caption();document.querySelectorAll('.card').forEach(c=>c.classList.toggle('on',+c.dataset.k==k));location.hash='viewer';route()}

const ptrs=new Map();let zm=1,pinch=null,mode='rot',pan=[0,0];const zc=v=>Math.max(.4,Math.min(4,v));
cv.addEventListener('pointerdown',e=>{ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});cv.setPointerCapture(e.pointerId);cv.style.cursor='grabbing';if(ptrs.size==2){const[a,b]=[...ptrs.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y)||1,z:zm,mx:(a.x+b.x)/2,my:(a.y+b.y)/2};drag=null}else drag={x:e.clientX,y:e.clientY,mv:mode=='move'||e.shiftKey||e.button>0}});
cv.addEventListener('contextmenu',e=>e.preventDefault());
$('.stage').addEventListener('wheel',e=>{e.preventDefault();const d=e.deltaY*(e.deltaMode==1?16:e.deltaMode==2?400:1)*(e.ctrlKey?3:1);zm=zc(zm*Math.exp(-d*.002))},{passive:false});
cv.addEventListener('dblclick',()=>{zm=1;pan=[0,0]});
cv.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});if(ptrs.size==2&&pinch){const[a,b]=[...ptrs.values()];zm=zc(pinch.z*Math.hypot(a.x-b.x,a.y-b.y)/pinch.d);const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;pan[0]+=mx-pinch.mx;pan[1]+=my-pinch.my;pinch.mx=mx;pinch.my=my;return}if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(drag.mv){pan[0]+=dx;pan[1]+=dy}else{ry+=dx*.01;rx=Math.max(-1.5,Math.min(1.5,rx+dy*.01))}drag={x:e.clientX,y:e.clientY,mv:drag.mv}});
const pup=e=>{ptrs.delete(e.pointerId);pinch=null;drag=null;cv.style.cursor='grab'};cv.addEventListener('pointerup',pup);cv.addEventListener('pointercancel',pup);
$('#zi').onclick=()=>{zm=zc(zm*1.25)};$('#zo').onclick=()=>{zm=zc(zm/1.25)};$('#zr').onclick=()=>{zm=1;rx=.35;pan=[0,0]};$('#zmv').onclick=()=>{mode=mode=='rot'?'move':'rot';$('#zmv').style.background=mode=='move'?'var(--ac)':'';$('#zmv').style.color=mode=='move'?'var(--acx)':''};$('#zs').onclick=()=>{style=style=='glass'?'flat':'glass';try{localStorage.setItem('mol-style',style)}catch(e){}thumbs()};
$('#prev').onclick=()=>step(-1);$('#next').onclick=()=>step(1);
addEventListener('keydown',e=>{if(view=='viewer'&&!/INPUT/.test(document.activeElement.tagName)){if(e.key=='ArrowLeft')step(-1);if(e.key=='ArrowRight')step(1)}});
document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{lang=b.dataset.l;try{localStorage.setItem('mol-lang',lang)}catch(e){}applyLang()});
document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{flt=b.dataset.f;document.querySelectorAll('[data-f]').forEach(x=>x.setAttribute('aria-pressed',x==b));grid()});
$('#th').onclick=()=>{const t=dk()?'light':'dark';document.documentElement.dataset.theme=t;try{localStorage.setItem('mol-theme',t)}catch(e){}thumbs()};
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',thumbs);
$('#q').oninput=e=>{q=e.target.value;grid()};
$('#grid').onclick=e=>{const y=e.target.closest('[data-e]');if(y)return toggleH(+y.dataset.e);const c=e.target.closest('[data-k]');if(c)pick(+c.dataset.k)};
$('#sh').onchange=e=>{showH=e.target.checked;saveH();grid();caption()};$('#cp').onchange=e=>{compact=e.target.checked;try{localStorage.setItem('mol-compact',compact?'1':'0')}catch(e){}grid()};$('#hb').onclick=()=>toggleH(cur);
$('#grid').onkeydown=e=>{if(e.key=='Enter'){const c=e.target.closest('[data-k]');if(c)pick(+c.dataset.k)}};
addEventListener('hashchange',route);
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(thumbs,150)});
(function loop(){if(view=='viewer'){if(!ptrs.size&&!reduce)ry+=.006;draw(cv,LIB[cur],ry,rx,.44,zm,pan)}requestAnimationFrame(loop)})();
$('#sh').checked=showH;$('#cp').checked=compact;applyLang();route();
</script>
</body>
