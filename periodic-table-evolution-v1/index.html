<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0}[hidden]{display:none!important}</style>
<title>周期表演化史</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout concept: one set of 118 cells that physically slides between historical layouts; controls on top, history cards underneath. */
:root{
  --bg:#eef2f5; --surface:#ffffff; --fg:#14202b; --muted:#566574; --faint:#9aa8b4; --line:#d3dce3; --accent:#0b62c4;
  --s:#e2552f; --p:#1f9a88; --d:#2f64d0; --f:#9a4fd0;
  --e0:#b7791f; --e1:#7f8f26; --e2:#2f9a5a; --e3:#1f93a6; --e4:#2f64d0; --e5:#8e4fd0;
  --sans:'IBM Plex Sans','PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e141a; --surface:#161e26; --fg:#e6edf3; --muted:#9fb0bf; --faint:#5f7080; --line:#2b3947; --accent:#6aa8ff;
    --s:#ff8a63; --p:#4fc9b6; --d:#7fa6ff; --f:#c58cf2;
    --e0:#e3a64b; --e1:#b3c34d; --e2:#55c57f; --e3:#4ec3d6; --e4:#7fa6ff; --e5:#c58cf2;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e141a; --surface:#161e26; --fg:#e6edf3; --muted:#9fb0bf; --faint:#5f7080; --line:#2b3947; --accent:#6aa8ff;
  --s:#ff8a63; --p:#4fc9b6; --d:#7fa6ff; --f:#c58cf2;
  --e0:#e3a64b; --e1:#b3c34d; --e2:#55c57f; --e3:#4ec3d6; --e4:#7fa6ff; --e5:#c58cf2;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--fg); font-family:var(--sans); font-size:15px; line-height:1.65;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:28px 64px;
}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
h1{font-size:clamp(26px,4.2vw,40px);line-height:1.15;margin:0;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
h2{font-size:18px;margin:0 0 10px;font-weight:600}
p{margin:0}
.lede{color:var(--muted);max-width:68ch;margin-top:10px}
a{color:var(--accent)}
.lang{
  position:fixed; z-index:20; top:calc(env(safe-area-inset-top,0px) + 10px); right:max(12px,env(safe-area-inset-right,0px));
  display:flex; gap:2px; padding:3px; border-radius:8px; background:color-mix(in srgb,var(--surface) 70%,transparent);
  border:1px solid var(--line); backdrop-filter:blur(6px); opacity:.9;
}
.lang button{border:0;background:transparent;color:var(--muted);font:500 13px var(--sans);padding:4px 10px;border-radius:5px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--surface)}
button{font-family:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.controls{display:flex;flex-wrap:wrap;gap:14px 28px;align-items:center}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-width:0}
.ctl > span{font:500 12px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.seg{display:flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;color:var(--fg);font-size:13px;padding:6px 12px;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--surface)}
.timebar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.timebar input[type=range]{flex:1 1 260px;min-width:0;accent-color:var(--accent)}
.yr{font:500 22px var(--mono);min-width:3.6ch;font-variant-numeric:tabular-nums}
.count{font:12px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.play{border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:6px 14px;border-radius:6px;font-size:13px;cursor:pointer}

.stage-scroll{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px}
.stage{position:relative;transition:width .5s,height .5s}
.cell{
  position:absolute;left:0;top:0;width:var(--cs);height:var(--cs);
  display:flex;align-items:center;justify-content:center;
  border:1px solid color-mix(in srgb,var(--blk) 60%,var(--surface));
  background:color-mix(in srgb,var(--blk) 24%,var(--surface));
  border-radius:3px;cursor:pointer;color:var(--fg);padding:0;
  transition:transform .8s cubic-bezier(.2,.7,.2,1),opacity .35s,background .35s,border-color .35s;
}
.cell i{position:absolute;top:2px;left:3px;font:normal 500 calc(var(--cs)*.21)/1 var(--mono);color:var(--muted)}
.cell b{font:600 calc(var(--cs)*.4)/1 var(--sans)}
.cell.off{background:transparent;border:1px dashed var(--line);color:var(--faint)}
.cell.off i,.cell.off b{color:var(--faint)}
.cell.ghost{background:transparent;border:1px dashed var(--accent);color:var(--accent)}
.cell.ghost i{color:var(--accent)}
.cell.pred{border:2px solid var(--accent)}
.cell.hl{box-shadow:0 0 0 2px var(--accent);z-index:2}
.cell.sel{outline:2px solid var(--fg);outline-offset:1px;z-index:3}
.cell.hide{opacity:0;pointer-events:none}
.lab{position:absolute;display:flex;align-items:center;justify-content:center;font:500 11px var(--mono);color:var(--muted);animation:fade .5s both;white-space:nowrap}
.lab.span{border-bottom:1px solid var(--line)}
@keyframes fade{from{opacity:0}to{opacity:1}}
.caption{color:var(--muted);font-size:13px;margin-top:10px;max-width:80ch}
.selinfo{font:13px var(--mono);margin-top:6px;min-height:1.6em}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:8px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend em{width:12px;height:12px;border-radius:2px;display:inline-block;font-style:normal;
  border:1px solid color-mix(in srgb,var(--blk) 60%,var(--surface));background:color-mix(in srgb,var(--blk) 30%,var(--surface))}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;padding:6px 12px;font-size:13px;cursor:pointer;text-align:left;line-height:1.3}
.chip small{display:block;font:11px var(--mono);color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:18px 20px;margin-top:10px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card .when{font:500 12px var(--mono);color:var(--accent);letter-spacing:.06em}
.card h3{margin:0;font-size:20px;font-weight:600}
.card .body{max-width:70ch}
.card .note{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px;max-width:70ch}

.order{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0}
.order span{font:12px var(--mono);padding:3px 8px;border-radius:3px;border:1px solid color-mix(in srgb,var(--blk) 60%,var(--surface));background:color-mix(in srgb,var(--blk) 22%,var(--surface))}
.foot{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:6px;max-width:80ch}
@media (prefers-reduced-motion:reduce){.cell,.stage,.lab{transition:none;animation:none}}
</style>
</head>
<body>

<div class="lang" role="group" aria-label="Language">
  <button id="bzh" type="button" aria-pressed="true">中文</button>

</div>

<div class="wrap">
  <header>
    <h1 data-i="title"></h1>
    <p class="lede" data-i="sub"></p>
  </header>

  <section>
    <div class="controls">
      <div class="ctl"><span data-i="layout"></span>
        <div class="seg" id="segLayout"></div></div>
      <div class="ctl"><span data-i="color"></span>
        <div class="seg" id="segMode"></div></div>
    </div>
    <div class="timebar" style="margin-top:14px">
      <button class="play" id="play" type="button"></button>
      <span class="yr" id="yr"></span>
      <input id="slider" type="range" min="1700" max="2016" step="1" value="2016" aria-label="Year">
      <span class="count" id="count"></span>
    </div>
    <div class="stage-scroll" id="scroll" style="margin-top:14px"><div class="stage" id="stage"></div></div>
    <div class="legend" id="legend"></div>
    <p class="caption" id="caption"></p>
    <p class="selinfo" id="selinfo"></p>
  </section>

  <section>
    <h2 data-i="timeline"></h2>
    <div class="chips" id="chips"></div>
    <article class="card" id="card"></article>
  </section>

  <section>
    <h2 data-i="whyH"></h2>
    <p data-i="whyP" style="max-width:70ch"></p>
    <div class="order" id="order"></div>
    <p class="caption" data-i="whyNote"></p>
  </section>

  <footer class="foot">
    <p data-i="foot1"></p>
    <p><a href="https://www.youtube.com/watch?v=ztpPty3WSiY" target="_blank" rel="noopener" data-i="foot2"></a></p>
  </footer>
</div>

/* Idealised Madelung filling order: every layout is a different folding of this one sequence. */
const SEQ=[[1,'s'],[2,'s'],[2,'p'],[3,'s'],[3,'p'],[4,'s'],[3,'d'],[4,'p'],[5,'s'],[4,'d'],[5,'p'],[6,'s'],[4,'f'],[5,'d'],[6,'p'],[7,'s'],[5,'f'],[6,'d'],[7,'p']];
const CAP={s:2,p:6,d:10,f:14}, LV={s:0,p:1,d:2,f:3};
(function(){let k=0;SEQ.forEach(([n,b])=>{for(let i=0;i<CAP[b];i++){const e=EL[k++];e.n=n;e.b=b;e.i=i;e.per=n+(b==='d'?1:b==='f'?2:0);e.row8=n+LV[b]-1;}});})();

const MEND={1:[0,0],3:[1,0],4:[1,1],5:[1,2],6:[1,3],7:[1,4],8:[1,5],9:[1,6],
 11:[2,0],12:[2,1],13:[2,2],14:[2,3],15:[2,4],16:[2,5],17:[2,6],
 19:[3,0],20:[3,1],21:[3,2],22:[3,3],23:[3,4],24:[3,5],25:[3,6],26:[3,7],27:[3,8],28:[3,9],
 29:[4,0],30:[4,1],31:[4,2],32:[4,3],33:[4,4],34:[4,5],35:[4,6],
 37:[5,0],38:[5,1],39:[5,2],40:[5,3],41:[5,4],42:[5,5],43:[5,6],44:[5,7],45:[5,8],46:[5,9],
 47:[6,0],48:[6,1],49:[6,2],50:[6,3],51:[6,4],52:[6,5],53:[6,6],
 55:[7,0],56:[7,1],57:[7,2],58:[7,3],
 68:[9,2],73:[9,4],74:[9,5],76:[9,7],77:[9,8],78:[9,9],
 79:[10,0],80:[10,1],81:[10,2],82:[10,3],83:[10,4],
 90:[11,3],92:[11,5]};
const GAP={21:['eka-boron','类硼'],31:['eka-aluminium','类铝'],32:['eka-silicon','类硅'],43:['eka-manganese','类锰']};
const DIM={mend:{cols:10,rows:12},long:{cols:18,rows:10},wide:{cols:32,rows:7},janet:{cols:32,rows:8}};
function POS(k,e){
  if(k==='mend') return MEND[e.z]||null;
  if(k==='long'){
    if(e.z===2) return [0,17];
    if(e.b==='s') return [e.per-1,e.i];
    if(e.b==='p') return [e.per-1,12+e.i];
    if(e.b==='d') return [e.per-1,2+e.i];
    return [e.per===6?8:9,3+e.i];

    if(e.b==='d') return [e.per-1,16+e.i];
    return [e.per-1,26+e.i];
  }

  return [e.row8,off+e.i];
}
function era(y){return y===0?0:y<1800?1:y<1869?2:y<1900?3:y<1945?4:5;}
/*PURE-END*/

const MS=[
 {y:1829,layout:null,hl:[3,11,19,20,38,56,17,35,53],
  t:{zh:['1829','德贝莱纳三元素组','德国化学家德贝莱纳发现，性质相近的元素常常三个一组，中间那个的原子量接近另外两个的平均值，例如锂–钠–钾、钙–锶–钡、氯–溴–碘。这是「元素有家族」的最早线索之一。','表格上：还没有表格，只有一组一组的「三胞胎」。'],
     en:['1829','Döbereiner\'s triads','Johann Döbereiner noticed that some chemically similar elements come in threes, with the middle atomic weight close to the average of the other two: Li–Na–K, Ca–Sr–Ba, Cl–Br–I. It was one of the first hints that elements form families.','On the table: no table yet, only separate triads.']}},
 {y:1862,layout:null,hl:[],
  t:{zh:['1862','地球螺旋','法国地质学家德尚库图瓦把元素按原子量绕在圆柱上，每圈 16 个单位，性质相似的元素落在同一条竖线上。论文发表时配图没有印出来，又用了很多地质术语，几乎无人注意。','表格上：不是格子，是螺旋线，但「竖线 = 家族」已经出现。'],
     en:['1862','The telluric screw','The French geologist Alexandre-Émile Béguyer de Chancourtois wrapped the elements around a cylinder by atomic weight, 16 units per turn, so that similar elements fell on the same vertical line. The diagram was left out of the printed paper and the text was full of geology jargon, so almost nobody noticed.','On the table: a helix, not a grid, but vertical lines already mark families.']}},
 {y:1865,layout:null,hl:[],
  t:{zh:['1864–65','纽兰兹八音律','英国的纽兰兹把元素按原子量排队，发现每隔八个就出现性质相似的元素，像音阶一样，称为「八音律」。1866 年他在化学会演讲时遭到嘲笑，有人问他是否试过按字母顺序排。','表格上：每行七个，惰性气体当时还没有被发现。'],
     en:['1864–65','Newlands\' law of octaves','John Newlands ordered the elements by atomic weight and saw similar ones recur every eighth place, like notes in a musical scale. When he presented it to the Chemical Society in 1866 he was mocked; one member asked whether he had tried listing them alphabetically.','On the table: rows of seven; the noble gases were not yet known.']}},
 {y:1870,layout:null,hl:[],

     en:['1864 / 1870','Meyer\'s table and curve','Lothar Meyer published a table of 28 elements arranged by atomic weight and valence in 1864. In 1870 he plotted atomic volume against atomic weight, turning periodicity into a visible wave.','On the table: the same pattern, drawn as a curve.']}},
 {y:1871,layout:'mend',hl:[21,31,32,43],
  t:{zh:['1869–71','门捷列夫','门捷列夫在 1869 年初完成初稿并在俄罗斯化学会上宣读。他按原子量排序，但更相信化学性质：必要时调换顺序（如碲与碘），并为尚未发现的元素留出空格，预言了「类硼、类铝、类硅」。镓（1875）、钪（1879）、锗（1886）陆续出现，与预言相符。1871 年的版本整理成 8 族、12 行。','表格上：虚线格是他留下的空位（Sc、Ga、Ge、Tc）。拖动年份，看它们何时被填上。'],
     en:['1869–71','Mendeleev','Dmitri Mendeleev drafted his table in early 1869 and it was read to the Russian Chemical Society. He sorted by atomic weight but trusted chemical behaviour more: he swapped some pairs (such as Te and I) and left gaps for undiscovered elements, predicting "eka-boron", "eka-aluminium" and "eka-silicon". Gallium (1875), scandium (1879) and germanium (1886) matched. The 1871 version has 8 groups and 12 rows.','On the table: dashed boxes are his gaps (Sc, Ga, Ge, Tc). Drag the slider to see when each was filled.']}},
 {y:1900,layout:'long',hl:[2,10,18,36,54,86],
  t:{zh:['1894–1900','惰性气体','拉姆齐与瑞利发现氩（1894），随后氦在地球上被找到（1895），氖、氪、氙（1898）与氡（1900）也陆续出现。它们几乎不与任何东西反应，没有一格是预留的。拉姆齐把它们放进新的「零族」，位于卤素与碱金属之间。','表格上：多出一整列。'],
     en:['1894–1900','The noble gases','Rayleigh and Ramsay found argon (1894); helium was isolated on Earth (1895); neon, krypton and xenon followed in 1898, then radon in 1900. They react with almost nothing, and no gap had been reserved for them. Ramsay gave them a new "group 0" between the halogens and the alkali metals.','On the table: a whole new column appears.']}},
 {y:1905,layout:'long',hl:[],
  t:{zh:['1905','维尔纳的长式','瑞士化学家维尔纳提出长式周期表：主族元素与过渡元素不再挤在同一族里，而是分开排成 18 列。这就是今天教科书里基本形状的由来。','表格上：从 8 族的短式变成 18 列。'],
     en:['1905','Werner\'s long form','Alfred Werner proposed a long-form table in which main-group and transition elements no longer share a group but sit in separate columns, 18 in all. It is the basic shape of today\'s textbook table.','On the table: from the 8-group short form to 18 columns.']}},
 {y:1913,layout:'long',hl:[18,19,27,28,52,53,43,61,72,75],
  t:{zh:['1913','莫塞莱与原子序数','莫塞莱用 X 射线测出各元素的原子序数 Z，证明真正的排序依据是 Z 而不是原子量。这解释了氩/钾、钴/镍、碲/碘「反序」的原因，也指出当时 43、61、72、75 号还有空位。','表格上：排序标准改变，空位数量变得可以精确数出来。'],
     en:['1913','Moseley and atomic number','Henry Moseley measured X-ray spectra and showed that the real ordering principle is atomic number Z, not atomic weight. That explains the "reversed" pairs Ar/K, Co/Ni and Te/I, and it showed that numbers 43, 61, 72 and 75 were still missing.','On the table: the sorting rule changes, and the gaps can be counted exactly.']}},
 {y:1923,layout:'long',hl:[72],
  t:{zh:['1922–23','玻尔与电子壳层','玻尔用电子壳层解释周期：每一周期的长度对应壳层能容纳的电子数。他据此指出 72 号元素应是锆的同族而不是稀土，1923 年科斯特与赫维西在哥本哈根果然在锆矿中找到铪。','表格上：2、8、8、18、18、32、32 这串行长度第一次有了理由。'],
     en:['1922–23','Bohr and electron shells','Niels Bohr explained periods through electron shells: the length of each period matches how many electrons the shells can hold. He argued that element 72 should resemble zirconium rather than the rare earths, and in 1923 Coster and Hevesy found hafnium in zirconium ores in Copenhagen.','On the table: the row lengths 2, 8, 8, 18, 18, 32, 32 finally have a reason.']}},
 {y:1928,layout:'janet',hl:[2,4],
  t:{zh:['1928','让内特的左阶式','法国工程师让内特按电子的填充顺序重排元素，得到「左阶式」：周期长度成对出现（2、2、8、8、18、18、32、32），s 区移到最右，氦自然落在铍的上方。它与量子力学的结论一致，但长期只有少数人使用。','表格上：没有被拆到底部的两行，也没有顶部那个「缺口」。拖动年份，会看到 1928 年时它还有哪些空位。'],
     en:['1928','Janet\'s left-step table','The French engineer Charles Janet rearranged the elements by electron filling order. In his left-step table the periods come in pairs (2, 2, 8, 8, 18, 18, 32, 32), the s-block moves to the far right, and helium lands above beryllium. It agrees with quantum mechanics, yet only a few people used it for decades.','On the table: no detached bottom rows and no notch at the top. Check the slider at 1928 to see which gaps it still had.']}},
 {y:1945,layout:'long',hl:[89,90,91,92,93,94,95,96,97,98,99,100,101,102],
  t:{zh:['1944–45','西博格与锕系','西博格提出「锕系概念」：锕之后的元素像镧系一样在填充 5f 轨道，应当放进一个独立的系列。于是表格底部出现了第二条分离的横行，成为今天标准的样子。他的团队在 1944 年还合成了镅与锔。','表格上：镧系与锕系各自拉成一行，放到主表下面。'],
     en:['1944–45','Seaborg and the actinides','Glenn Seaborg proposed the actinide concept: the elements after actinium fill the 5f orbitals just as the lanthanides fill 4f, so they belong in a series of their own. A second detached row appeared at the bottom, giving the standard table of today. His team also made americium and curium in 1944.','On the table: lanthanides and actinides each become a row below the main body.']}},
 {y:2016,layout:'long',hl:[113,115,117,118],
  t:{zh:['2016','第七周期排满','国际纯粹与应用化学联合会在 2016 年 11 月正式命名 113、115、117、118 号元素（Nh、Mc、Ts、Og），第七周期终于排满。第 3 族到底是 Sc–Y–Lu–Lr 还是 Sc–Y–La–Ac 仍在讨论，本页采用前者。','表格上：右下角补齐，七行全满。'],
     en:['2016','Period 7 completed','In November 2016 IUPAC formally named elements 113, 115, 117 and 118 (Nh, Mc, Ts, Og), completing the seventh row. Whether group 3 is Sc–Y–Lu–Lr or Sc–Y–La–Ac is still debated; this page uses the former.','On the table: the lower right is filled and all seven rows are complete.']}}
];

const I18N={
 zh:{title:'周期表演化史',
  sub:'同一批 118 个元素，在不同年代被折成不同的形状。点下方的历史节点，或拖动年份，看表格怎样长成今天的样子。',
  layout:'版式',color:'着色',timeline:'历史节点',
  lay:{mend:'门捷列夫短式',long:'18 列长式',wide:'32 列宽式',janet:'让内特左阶式'},
  mode:{block:'按轨道区块',era:'按发现年代'},
  cap:{mend:'门捷列夫 1871 年样式的简化重绘：8 族、12 行，只显示他当时排进表里的元素，虚线是他留的空位。',
       long:'18 列长式：今天最常见的样子。f 区被单独拉出来放在表下方。',
       wide:'32 列宽式：f 区放回原位，没有被拆出去的两行，只是太宽，不方便印在纸上。',
       janet:'让内特左阶式：每一行对应 n+l 相同的一组亚层，行长成对出现 2、2、8、8、18、18、32、32。'},
  play:'▶ 播放',pause:'❚❚ 暂停',known:'已发现',ant:'古代',
  blocks:{s:'s 区（2 列）',p:'p 区（6 列）',d:'d 区（10 列）',f:'f 区（14 列）'},
  eras:['古代','1799 前','1800–68','1869–99','1900–44','1945 起'],
  pick:'点击元素格查看详情',per:'第 {n} 周期',bl:'{b} 区',disc:'发现',
  whyH:'为什么是这个形状',
  whyP:'表格的宽度来自亚层能容纳的电子数：s 有 2 个、p 有 6 个、d 有 10 个、f 有 14 个。电子按下面这个顺序填充（Madelung 规则）。把这一条序列一行一行折起来，就是周期表；不同版本的区别，只是怎么折。',
  whyNote:'这里用的是理想化的填充顺序，铬、铜等少数元素实际有例外。第 3 族按 Sc–Y–Lu–Lr 处理。',
  foot1:'年份按常见教科书的说法整理，个别元素（如 102–105 号）存在争议；页面里的「已发现」数量按这张年份表统计，因此和历史上的说法（例如 1869 年的 63 种）不完全一致。内容依据视频主题与通行的科学史叙述整理，不是视频逐字稿。',
  foot2:'相关视频：Why Does the Periodic Table Have This Strange Shape?（The Chemistry Story）'},
 en:{title:'Periodic Table Evolution',
  sub:'The same 118 elements, folded into different shapes over time. Pick a milestone below or drag the year to watch the table grow into today\'s form.',
  layout:'Layout',color:'Colour',timeline:'Milestones',
  lay:{mend:'Mendeleev short form',long:'18-column long form',wide:'32-column wide form',janet:'Janet left-step'},
  mode:{block:'By block',era:'By discovery era'},
  cap:{mend:'A simplified redraw of Mendeleev\'s 1871 style: 8 groups, 12 rows, only the elements he placed. Dashed boxes are the gaps he left.',
       long:'The 18-column long form, the one in most textbooks. The f-block is pulled out and placed below.',
       wide:'The 32-column wide form: the f-block stays in place, with no detached rows. It is simply too wide for most pages.',
       janet:'Janet\'s left-step table: each row groups subshells with the same n+l, so row lengths come in pairs: 2, 2, 8, 8, 18, 18, 32, 32.'},
  play:'▶ Play',pause:'❚❚ Pause',known:'Discovered',ant:'Antiquity',
  blocks:{s:'s-block (2 columns)',p:'p-block (6)',d:'d-block (10)',f:'f-block (14)'},
  eras:['Antiquity','Before 1800','1800–68','1869–99','1900–44','1945 on'],
  pick:'Click a cell for details',per:'Period {n}',bl:'{b}-block',disc:'discovered',
  whyH:'Why this shape',
  whyP:'The widths come from how many electrons each subshell holds: 2 for s, 6 for p, 10 for d, 14 for f. Electrons fill in the order below (the Madelung rule). Fold that single sequence into rows and you get a periodic table; the versions differ only in where they fold.',
  whyNote:'This uses the idealised filling order; a few elements such as Cr and Cu are real exceptions. Group 3 is treated as Sc–Y–Lu–Lr.',
  foot1:'Years follow common textbook accounts and a few (around elements 102–105) are disputed. The "Discovered" count follows this page\'s year table, so it can differ from historical tallies such as the 63 elements known in 1869. Built from the video\'s topic and standard histories of the table, not from a transcript.',
  foot2:'Related video: Why Does the Periodic Table Have This Strange Shape? (The Chemistry Story)'}
};

const $=s=>document.querySelector(s);
const state={lang:(navigator.language||'').toLowerCase().startsWith('zh')?'zh':'en',layout:'long',mode:'block',year:2016,hl:new Set([113,115,117,118]),m:MS.length-1,sel:null};
const MINY=1700,MAXY=2016,LG=40,TG=26;
const stage=$('#stage'),scroll=$('#scroll'),slider=$('#slider');
let pitch=44,timer=null;

const cells=EL.map(e=>{
  const c=document.createElement('button');c.type='button';c.className='cell';
  c.innerHTML='<i>'+e.z+'</i><b>'+e.s+'</b>';
  c.addEventListener('click',()=>{state.sel=e.z;showSel();paint();});
  stage.appendChild(c);return c;
});
const last=new Array(EL.length).fill(null);

function T(){return I18N[state.lang];}
function yl(e){return e.y===0?T().ant:String(e.y);}

function build(){
  const t=T();
  document.documentElement.lang=state.lang==='zh'?'zh-CN':'en';
  document.querySelectorAll('[data-i]').forEach(n=>{n.textContent=t[n.dataset.i];});
  $('#bzh').setAttribute('aria-pressed',state.lang==='zh');$('#ben').setAttribute('aria-pressed',state.lang==='en');
  const sl=$('#segLayout');sl.innerHTML='';
  Object.keys(t.lay).forEach(k=>{const b=document.createElement('button');b.type='button';b.textContent=t.lay[k];b.setAttribute('aria-pressed',state.layout===k);b.onclick=()=>{state.layout=k;build();relayout();paint();};sl.appendChild(b);});
  const sm=$('#segMode');sm.innerHTML='';
  Object.keys(t.mode).forEach(k=>{const b=document.createElement('button');b.type='button';b.textContent=t.mode[k];b.setAttribute('aria-pressed',state.mode===k);b.onclick=()=>{state.mode=k;build();paint();};sm.appendChild(b);});
  $('#caption').textContent=t.cap[state.layout];
  $('#play').textContent=timer?t.pause:t.play;
  const lg=$('#legend');lg.innerHTML='';
  if(state.mode==='block'){['s','p','d','f'].forEach(b=>{lg.insertAdjacentHTML('beforeend','<span><em style="--blk:var(--'+b+')"></em>'+t.blocks[b]+'</span>');});}
  else{t.eras.forEach((n,i)=>{lg.insertAdjacentHTML('beforeend','<span><em style="--blk:var(--e'+i+')"></em>'+n+'</span>');});}
  const ch=$('#chips');ch.innerHTML='';
  MS.forEach((m,i)=>{const b=document.createElement('button');b.type='button';b.className='chip';const tt=m.t[state.lang];
    b.innerHTML='<small>'+tt[0]+'</small>'+tt[1];b.setAttribute('aria-pressed',state.m===i);b.onclick=()=>pickMilestone(i);ch.appendChild(b);});
  card();
  cells.forEach((c,i)=>{const e=EL[i];c.title=(state.lang==='zh'?e.zh+' ':'')+e.en+' · Z='+e.z+' · '+yl(e);});
  showSel();updYear();
}
function card(){
  const el=$('#card');if(state.m<0){el.innerHTML='';return;}
  const tt=MS[state.m].t[state.lang];
  el.innerHTML='<div class="when"></div><h3></h3><p class="body"></p><p class="note"></p>';
  el.children[0].textContent=tt[0];el.children[1].textContent=tt[1];el.children[2].textContent=tt[2];el.children[3].textContent=tt[3];
}
function showSel(){
  const t=T(),el=$('#selinfo');
  if(state.sel==null){el.textContent=t.pick;return;}
  const e=EL[state.sel-1];
  el.textContent=(state.lang==='zh'?e.zh+' ':'')+e.en+' ('+e.s+') · Z='+e.z+' · '+t.disc+' '+yl(e)+' · '+t.per.replace('{n}',e.per)+' · '+t.bl.replace('{b}',e.b);
}
function updYear(){
  $('#yr').textContent=state.year;slider.value=state.year;
  const n=EL.filter(e=>e.y<=state.year).length;
  $('#count').textContent=T().known+' '+n+' / 118';
}

function labelsFor(k){
  const L=[];
  if(k==='mend'){['I','II','III','IV','V','VI','VII'].forEach((t,c)=>L.push({k:'c',c,s:1,t}));L.push({k:'c',c:7,s:3,t:'VIII',sp:1});for(let r=0;r<12;r++)L.push({k:'r',r,t:String(r+1)});}
  else if(k==='long'){for(let c=0;c<18;c++)L.push({k:'c',c,s:1,t:String(c+1)});for(let r=0;r<7;r++)L.push({k:'r',r,t:String(r+1)});L.push({k:'r',r:8,t:'57–70'});L.push({k:'r',r:9,t:'89–102'});}
  else if(k==='wide'){L.push({k:'c',c:0,s:2,t:'s',sp:1},{k:'c',c:2,s:14,t:'f',sp:1},{k:'c',c:16,s:10,t:'d',sp:1},{k:'c',c:26,s:6,t:'p',sp:1});for(let r=0;r<7;r++)L.push({k:'r',r,t:String(r+1)});}
  else{L.push({k:'c',c:0,s:14,t:'f',sp:1},{k:'c',c:14,s:10,t:'d',sp:1},{k:'c',c:24,s:6,t:'p',sp:1},{k:'c',c:30,s:2,t:'s',sp:1});for(let r=0;r<8;r++)L.push({k:'r',r,t:String(r+1)});}
  return L;
}
function relayout(){
  const k=state.layout,d=DIM[k];
  const avail=scroll.clientWidth-20-LG;
  pitch=Math.max(30,Math.min(46,Math.floor(avail/d.cols)));
  stage.style.setProperty('--cs',(pitch-3)+'px');
  stage.style.width=(LG+d.cols*pitch)+'px';stage.style.height=(TG+d.rows*pitch)+'px';
  stage.querySelectorAll('.lab').forEach(n=>n.remove());
  labelsFor(k).forEach(l=>{
    const n=document.createElement('div');n.className='lab'+(l.sp?' span':'');n.textContent=l.t;
    if(l.k==='c'){n.style.cssText='left:'+(LG+l.c*pitch)+'px;top:0;width:'+(l.s*pitch-3)+'px;height:'+(TG-4)+'px';}
    else{n.style.cssText='left:0;top:'+(TG+l.r*pitch)+'px;width:'+(LG-6)+'px;height:'+(pitch-3)+'px';}
    stage.appendChild(n);
  });
  cells.forEach((c,i)=>{
    const p=POS(k,EL[i]);
    if(p){last[i]=[LG+p[1]*pitch,TG+p[0]*pitch];}
    const q=last[i]||[LG,TG];
    c.style.transform='translate('+q[0]+'px,'+q[1]+'px)';
  });
}
function paint(){
  const k=state.layout;
  cells.forEach((c,i)=>{
    const e=EL[i],p=POS(k,e),known=e.y<=state.year,gap=k==='mend'&&GAP[e.z];
    c.classList.toggle('hide',!p);
    c.classList.toggle('ghost',!!gap&&!known);
    c.classList.toggle('pred',!!gap&&known);
    c.classList.toggle('off',!!p&&!known&&!gap);
    c.classList.toggle('hl',state.hl.has(e.z));
    c.classList.toggle('sel',state.sel===e.z);
    c.querySelector('b').textContent=(gap&&!known)?'?':e.s;
    c.style.setProperty('--blk',state.mode==='block'?'var(--'+e.b+')':'var(--e'+era(e.y)+')');
  });
}
function stop(){if(timer){clearInterval(timer);timer=null;$('#play').textContent=T().play;}}
function pickMilestone(i){
  stop();const m=MS[i];state.m=i;if(m.layout)state.layout=m.layout;
  state.year=m.y;state.hl=new Set(m.hl);build();relayout();paint();
}
$('#play').onclick=()=>{
  if(timer){stop();return;}
  if(state.year>=MAXY)state.year=MINY;
  state.hl=new Set();state.m=-1;
  timer=setInterval(()=>{state.year=Math.min(MAXY,state.year+2);paint();updYear();if(state.year>=MAXY)stop();},70);
  build();paint();
};
slider.addEventListener('input',()=>{stop();state.year=+slider.value;paint();updYear();});
$('#bzh').onclick=()=>{state.lang='zh';build();};
$('#ben').onclick=()=>{state.lang='en';build();};
let rz;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{relayout();},120);});

build();relayout();paint();
</script>
