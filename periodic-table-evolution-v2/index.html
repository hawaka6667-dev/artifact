<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0}[hidden]{display:none!important}</style>
<title>周期表演化史</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout concept: one set of 118 cells that physically slides between historical layouts; controls on top, history cards underneath. */
:root{
  --bg:#eef2f5; --surface:#ffffff; --fg:#14202b; --muted:#566574; --faint:#9aa8b4; --line:#d3dce3; --accent:#0b62c4;
  --s:#e2552f; --p:#1f9a88; --d:#2f64d0; --f:#9a4fd0;
  --e0:#b7791f; --e1:#7f8f26; --e2:#2f9a5a; --e3:#1f93a6; --e4:#2f64d0; --e5:#8e4fd0;
  --sans:'IBM Plex Sans','PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e141a; --surface:#161e26; --fg:#e6edf3; --muted:#9fb0bf; --faint:#5f7080; --line:#2b3947; --accent:#6aa8ff;
    --s:#ff8a63; --p:#4fc9b6; --d:#7fa6ff; --f:#c58cf2;
    --e0:#e3a64b; --e1:#b3c34d; --e2:#55c57f; --e3:#4ec3d6; --e4:#7fa6ff; --e5:#c58cf2;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e141a; --surface:#161e26; --fg:#e6edf3; --muted:#9fb0bf; --faint:#5f7080; --line:#2b3947; --accent:#6aa8ff;
  --s:#ff8a63; --p:#4fc9b6; --d:#7fa6ff; --f:#c58cf2;
  --e0:#e3a64b; --e1:#b3c34d; --e2:#55c57f; --e3:#4ec3d6; --e4:#7fa6ff; --e5:#c58cf2;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--fg); font-family:var(--sans); font-size:15px; line-height:1.65;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:28px 64px;
}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
h1{font-size:clamp(26px,4.2vw,40px);line-height:1.15;margin:0;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
h2{font-size:18px;margin:0 0 10px;font-weight:600}
p{margin:0}
.lede{color:var(--muted);max-width:68ch;margin-top:10px}
a{color:var(--accent)}
.lang{
  position:fixed; z-index:20; top:calc(env(safe-area-inset-top,0px) + 10px); right:max(12px,env(safe-area-inset-right,0px));
  display:flex; gap:2px; padding:3px; border-radius:8px; background:color-mix(in srgb,var(--surface) 70%,transparent);
  border:1px solid var(--line); backdrop-filter:blur(6px); opacity:.9;
}
.lang button{border:0;background:transparent;color:var(--muted);font:500 13px var(--sans);padding:4px 10px;border-radius:5px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--surface)}
button{font-family:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.controls{display:flex;flex-wrap:wrap;gap:14px 28px;align-items:center}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-width:0}
.ctl > span{font:500 12px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.seg{display:flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;color:var(--fg);font-size:13px;padding:6px 12px;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--surface)}
.timebar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.timebar input[type=range]{flex:1 1 260px;min-width:0;accent-color:var(--accent)}
.yr{font:500 22px var(--mono);min-width:3.6ch;font-variant-numeric:tabular-nums}
.count{font:12px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.play{border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:6px 14px;border-radius:6px;font-size:13px;cursor:pointer}

.stage-scroll{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px}
.stage{position:relative;transition:width .5s,height .5s}
.cell{
  position:absolute;left:0;top:0;width:var(--cs);height:var(--cs);
  display:flex;align-items:center;justify-content:center;
  border:1px solid color-mix(in srgb,var(--blk) 60%,var(--surface));
  background:color-mix(in srgb,var(--blk) 24%,var(--surface));
  border-radius:3px;cursor:pointer;color:var(--fg);padding:0;
  transition:transform .8s cubic-bezier(.2,.7,.2,1),opacity .35s,background .35s,border-color .35s;
}
.cell i{position:absolute;top:2px;left:3px;font:normal 500 calc(var(--cs)*.21)/1 var(--mono);color:var(--muted)}
.cell b{font:600 calc(var(--cs)*.4)/1 var(--sans)}
.cell.off{background:transparent;border:1px dashed var(--line);color:var(--faint)}
.cell.off i,.cell.off b{color:var(--faint)}
.cell.ghost{background:transparent;border:1px dashed var(--accent);color:var(--accent)}
.cell.ghost i{color:var(--accent)}
.cell.pred{border:2px solid var(--accent)}
.cell.hl{box-shadow:0 0 0 2px var(--accent);z-index:2}
.cell.sel{outline:2px solid var(--fg);outline-offset:1px;z-index:3}
.cell.hide{opacity:0;pointer-events:none}
.lab{position:absolute;display:flex;align-items:center;justify-content:center;font:500 11px var(--mono);color:var(--muted);animation:fade .5s both;white-space:nowrap}
.lab.span{border-bottom:1px solid var(--line)}
@keyframes fade{from{opacity:0}to{opacity:1}}
.caption{color:var(--muted);font-size:13px;margin-top:10px;max-width:80ch}
.selinfo{font:13px var(--mono);margin-top:6px;min-height:1.6em}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:8px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend em{width:12px;height:12px;border-radius:2px;display:inline-block;font-style:normal;
  border:1px solid color-mix(in srgb,var(--blk) 60%,var(--surface));background:color-mix(in srgb,var(--blk) 30%,var(--surface))}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;padding:6px 12px;font-size:13px;cursor:pointer;text-align:left;line-height:1.3}
.chip small{display:block;font:11px var(--mono);color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:18px 20px;margin-top:10px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card .when{font:500 12px var(--mono);color:var(--accent);letter-spacing:.06em}
.card h3{margin:0;font-size:20px;font-weight:600}
.card .body{max-width:70ch}
.card .note{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px;max-width:70ch}

.order{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0}
.order span{font:12px var(--mono);padding:3px 8px;border-radius:3px;border:1px solid color-mix(in srgb,var(--blk) 60%,var(--surface));background:color-mix(in srgb,var(--blk) 22%,var(--surface))}
.foot{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:6px;max-width:80ch}
h3{font-size:15px;margin:18px 0 6px;font-weight:600}
.refs{list-style:none;padding:0;margin:14px 0 0;display:flex;flex-direction:column;gap:12px}
.refs li{max-width:82ch;padding:6px 10px;border-radius:4px;border-left:2px solid var(--line);transition:background .4s}
.refs li.flash{background:color-mix(in srgb,var(--accent) 14%,transparent);border-left-color:var(--accent)}
.refs .use{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.refnotes{max-width:82ch;margin:0;padding-left:1.2em;color:var(--muted);font-size:13px;display:flex;flex-direction:column;gap:6px}
.srcs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.srcs a{font:12px var(--mono);padding:1px 7px;border:1px solid var(--line);border-radius:3px;text-decoration:none;color:var(--accent)}
@media (prefers-reduced-motion:reduce){.cell,.stage,.lab{transition:none;animation:none}}
</style>
</head>

<div class="lang" role="group" aria-label="Language">

<div class="wrap">

  <section>

  <section id="references">

  <footer class="foot">

    <p><a href="https://www.youtube.com/watch?v=ztpPty3WSiY" target="_blank" rel="noopener" data-i="foot2"></a></p>
  </footer>
</div>

     en:['1863–66','Newlands\' law of octaves','John Newlands published his "law of octaves" in 1863–66: ordered by atomic weight, similar elements recur every eighth place, like notes in a musical scale. When he presented it to the Chemical Society in London on 1 March 1866 he was mocked, and one listener asked whether he had tried arranging the elements alphabetically. The Society also declined to publish the paper.','On the table: rows of seven; the noble gases were not yet known.']}},
 {y:1870,layout:null,hl:[],r:[3,6],
  t:{zh:['1864–70','迈尔的表与折线图','德国的迈尔在 1864 年的教科书里已经有一张按化合价分族的元素表。1868 年前后他又做出一张与门捷列夫极为相似的表，因出版延误到 1870 年才发表，并配有原子体积随原子量变化的折线图，把「周期性」直接画成了波浪。两人为此发生过优先权之争。','表格上：同一批规律，换成曲线来看。'],
     en:['1864–70','Meyer\'s table and chart','Lothar Meyer\'s 1864 textbook already contained a table of elements grouped into families by valence. Around 1868 he produced a table strikingly similar to Mendeleev\'s; publication was delayed until 1870, and it came with a line chart of atomic volume against atomic weight that drew the periodicity as a wave. The two men fell into a priority dispute.','On the table: the same pattern, seen as a curve.']}},
 {y:1871,layout:'mend',hl:[21,31,32,43],r:[2,3,6,7],
  t:{zh:['1869–71','门捷列夫','门捷列夫在 1869 年 2 月 17 日发现了周期律；他当时生病，3 月 6 日由同事门舒特金在俄罗斯化学会上代为宣读。当时已知 63 种元素。他按原子量排序，但更相信化学性质：必要时调换相邻元素的顺序，并为尚未发现的元素留出空格，预言了类硼、类铝、类硅。镓（1875，类铝）、钪（1879，类硼）、锗（1886，类硅）陆续被发现，与预言相符；类锰要到 1937 年才以锝的形式出现。1871 年的版本有 12 行（Reihen）。','表格上：虚线格是他留下的空位（Sc、Ga、Ge、Tc）。拖动年份，看它们何时被填上。'],
     en:['1869–71','Mendeleev','Dmitri Mendeleev discovered the periodic system on 17 February 1869. He was ill, so his colleague Nikolai Menshutkin presented it to the Russian Chemical Society on 6 March. Sixty-three elements were known. He sorted by atomic weight but trusted chemical behaviour more: he sometimes swapped neighbouring elements and left gaps for undiscovered ones, predicting eka-boron, eka-aluminium and eka-silicon. Gallium (1875, eka-aluminium), scandium (1879, eka-boron) and germanium (1886, eka-silicon) matched; eka-manganese only appeared in 1937, as technetium. The 1871 version has 12 rows (Reihen).','On the table: dashed boxes are his gaps (Sc, Ga, Ge, Tc). Drag the slider to see when each was filled.']}},
 {y:1902,layout:'long',hl:[2,10,18,36,54,86],r:[3,6],
  t:{zh:['1894–1902','惰性气体','瑞利与拉姆齐在 1894 年分离出氩，它不符合当时的周期律；1898 年拉姆齐小组又找到氖、氪、氙，氡在 1900 年出现。它们没有一个是被预言的，化学家们用了约六年才把它们作为新的一列放进表里，位于卤素与碱金属之间。1900 年前后出现了设立「零族」的提议，1902 年门捷列夫正式把它们加进自己的表。','表格上：多出一整列。'],
     en:['1894–1902','The noble gases','Rayleigh and Ramsay isolated argon in 1894, and it did not fit the periodic law; Ramsay\'s group found neon, krypton and xenon in 1898, and radon followed in 1900. None had been predicted, and it took about six years to fit them in as a new column between the halogens and the alkali metals. Around 1900 a "group 0" was proposed, and in 1902 Mendeleev added the noble gases to his own table.','On the table: a whole new column appears.']}},
 {y:1905,layout:'wide',hl:[],r:[6],
  t:{zh:['1905','维尔纳与 32 列形式','瑞士化学家维尔纳在 1905 年把镧系（稀土元素）放进了门捷列夫表里的空档，由此出现了最早的 32 列形式。','表格上：镧系回到主表中间，表格变宽了。今天最常见的 18 列版本，是后来把 f 区拆出去之后的样子。'],
     en:['1905','Werner and the 32-column form','In 1905 the Swiss chemist Alfred Werner placed the lanthanides (rare earths) in the gap in Mendeleev\'s table, which gave the first appearance of the 32-column form.','On the table: the lanthanides sit inside the main body and the table gets wider. The familiar 18-column version came later, when the f-block was pulled out.']}},
 {y:1913,layout:'long',hl:[18,19,52,53,43,61,75,72],r:[3,6,10],
  t:{zh:['1913','莫塞莱与原子序数','莫塞莱在 1913 年发现元素 X 射线谱线的频率与一个整数有关，这个整数就是原子序数。排序的依据由此从原子量换成原子序数：氩排在钾前面，碲/碘的顺序问题也随之解决。他还指出 43、61、75 号三处空位；72 号同样空着，但他漏看了，因为当时有人错误地宣称已经发现了它。','表格上：排序标准改变，空位变得可以精确数出来。'],
     en:['1913','Moseley and atomic number','In 1913 Henry Moseley found that the frequencies of lines in an element\'s X-ray spectrum depend on a whole number, the atomic number. Atomic number replaced atomic weight as the ordering principle: argon goes before potassium, and the tellurium–iodine problem is resolved. He pointed out gaps at 43, 61 and 75; number 72 was empty too, but he missed it because its discovery had been wrongly claimed.','On the table: the sorting rule changes, and the gaps can be counted exactly.']}},
 {y:1923,layout:'long',hl:[72],r:[8,9],
  t:{zh:['1922–23','玻尔与铪','玻尔的原子理论预言 72 号元素应与锆相近，而不是稀土；当时英法有人声称它是稀土元素。赫维西与科斯特在玻尔的哥本哈根研究所检验，约在 1922 年底得出结论，1923 年公布，元素以哥本哈根的拉丁名命名为铪（Hafnium）。','表格上：电子壳层第一次为 2、8、8、18、18、32、32 这串行长度提供了理由。'],
     en:['1922–23','Bohr and hafnium','Bohr\'s atomic theory predicted that element 72 should resemble zirconium rather than the rare earths, while claims from England and France said it was a rare earth. Hevesy and Coster tested the question at Bohr\'s institute in Copenhagen, reaching their conclusion around the end of 1922 and publishing in 1923. The element was named hafnium, after the Latin name of Copenhagen.','On the table: electron shells give the row lengths 2, 8, 8, 18, 18, 32, 32 a reason for the first time.']}},
 {y:1928,layout:'janet',hl:[2,4],r:[12],
  t:{zh:['1928','让内特的左阶式','法国工程师让内特在 1928 年前后提出了左阶式：每一行对应同一个 n+ℓ 值（与 Madelung 规则一致），亚层从左到右按 f、d、p、s 排列，s 区在最右，氢和氦位于锂和铍的上方。它在法国基本被忽视，约 40 年后才被美国化学家重新提起（Mazurs，1974），近年又因 Scerri 的推广而受到关注。','表格上：没有被拆到底部的两行。拖动年份，看 1928 年时它还有哪些空位。'],
     en:['1928','Janet\'s left-step table','Around 1928 the French engineer Charles Janet proposed the left-step table: each row corresponds to one value of n+ℓ (consistent with the Madelung rule), subshells run left to right as f, d, p, s so the s-block is on the far right, and hydrogen and helium sit above lithium and beryllium. It was largely ignored in France and resurfaced about 40 years later among American chemists (Mazurs, 1974), and Eric Scerri has recently brought it renewed attention.','On the table: no detached bottom rows. Check the slider at 1928 to see which gaps it still had.']}},
 {y:1945,layout:'long',hl:[89,90,91,92,93,94,95,96,97,98,99,100,101,102],r:[6,11],
  t:{zh:['1944–45','西博格与锕系','1944 年 7 月，西博格在一份保密报告里提出把钍、镤、铀移出主表，作为一条独立横行（锕系）的开头：钍（90）到 103 号这 14 个元素与镧系相似。他的团队据此类比，在 1944–45 年间合成并鉴定了 95 号（镅）和 96 号（锔）。这个想法 1945 年提出后被广泛接受，今天标准表底部的两条分离横行由此而来。','表格上：镧系与锕系各自拉成一行，放到主表下面。'],
     en:['1944–45','Seaborg and the actinides','In July 1944 Glenn Seaborg proposed in a secret report that thorium, protactinium and uranium be moved out of the main body and placed at the start of a separate row, the actinides: the 14 elements from thorium (90) to 103 are analogous to the lanthanides. Using that analogy his team synthesised and identified element 95 (americium) and element 96 (curium) in 1944–45. The idea, put forward in 1945, gained wide acceptance and gave the two detached bottom rows of the standard table.','On the table: lanthanides and actinides each become a row below the main body.']}},
 {y:2016,layout:'long',hl:[113,115,117,118],r:[13,14],
  t:{zh:['2016','第七周期排满','国际纯粹与应用化学联合会（IUPAC）理事会于 2016 年 11 月 28 日批准了 113、115、117、118 号元素的名称（Nh、Mc、Ts、Og），第七周期因此排满。第 3 族到底是 Sc–Y–Lu–Lr 还是 Sc–Y–La–Ac，目前仍无定论：2021 年的一份临时报告认为没有客观的办法裁决，只是略偏向 Lu/Lr；本页采用 Lu/Lr。','表格上：右下角补齐，七行全满。'],
     en:['2016','Period 7 completed','On 28 November 2016 the IUPAC Bureau approved the names of elements 113, 115, 117 and 118 (Nh, Mc, Ts, Og), completing the seventh row. Whether group 3 is Sc–Y–Lu–Lr or Sc–Y–La–Ac remains open: a 2021 provisional report said there is no objective way to decide, while leaning slightly towards Lu/Lr. This page uses Lu/Lr.','On the table: the lower right is filled and all seven rows are complete.']}}

  srcLabel:'Sources',
  refDiscH:'Where sources disagree',
  refDisc:['Date of Newlands\' presentation: the RSC gives 1 March 1866, while the OUP blog places it in the year after his 1864 articles, which would be 1865. This page uses 1866.','Number of elements in Meyer\'s 1864 table: sources say 28 and 44, so the page gives no number.','Hafnium: LANL records the discovery in 1923, while the NBI page says the check was made around the end of 1922. The page says "confirmed around the end of 1922, published 1923" and the year table uses 1923.','Curium: the LANL article places element 96 in 1945, while the usual account often says 1944. The year table uses 1944, at most a year off.'],
  refLimH:'Limits of this page',
  refLim:'The discovery-year table for all 118 elements was not checked entry by entry against a single source; it follows common textbook accounts, and a few entries (around elements 102–105) are disputed. The "Discovered" count next to the slider is computed from that table, so it can differ from historical tallies such as the 63 elements known in 1869. The Mendeleev 1871 layout is a simplified redraw, and the other layouts are computed from the idealised Madelung filling order; none of them is a historical original. Entries marked Wikipedia are secondary overviews, fine for a first check, but important claims should be traced back to the original literature.',
  further:'Further reading (not used for specific claims): Eric Scerri, The Periodic Table: Its Story and Its Significance, 2nd ed., Oxford University Press, 2020.',
  foot2:'Related video: Why Does the Periodic Table Have This Strange Shape? (The Chemistry Story)'}
};

const $=s=>document.querySelector(s);
const state={lang:(navigator.language||'').toLowerCase().startsWith('zh')?'zh':'en',layout:'long',mode:'block',year:2016,hl:new Set([113,115,117,118]),m:MS.length-1,sel:null};
const MINY=1700,MAXY=2016,LG=40,TG=26;
const stage=$('#stage'),scroll=$('#scroll'),slider=$('#slider');
let pitch=44,timer=null;

const cells=EL.map(e=>{
  const c=document.createElement('button');c.type='button';c.className='cell';
  c.innerHTML='<i>'+e.z+'</i><b>'+e.s+'</b>';
  c.addEventListener('click',()=>{state.sel=e.z;showSel();paint();});
  stage.appendChild(c);return c;
});
const last=new Array(EL.length).fill(null);

function T(){return I18N[state.lang];}
function yl(e){return e.y===0?T().ant:String(e.y);}

function build(){
  const t=T();
  document.documentElement.lang=state.lang==='zh'?'zh-CN':'en';
  document.querySelectorAll('[data-i]').forEach(n=>{n.textContent=t[n.dataset.i];});
  $('#bzh').setAttribute('aria-pressed',state.lang==='zh');$('#ben').setAttribute('aria-pressed',state.lang==='en');
  const sl=$('#segLayout');sl.innerHTML='';
  Object.keys(t.lay).forEach(k=>{const b=document.createElement('button');b.type='button';b.textContent=t.lay[k];b.setAttribute('aria-pressed',state.layout===k);b.onclick=()=>{state.layout=k;build();relayout();paint();};sl.appendChild(b);});
  const sm=$('#segMode');sm.innerHTML='';
  Object.keys(t.mode).forEach(k=>{const b=document.createElement('button');b.type='button';b.textContent=t.mode[k];b.setAttribute('aria-pressed',state.mode===k);b.onclick=()=>{state.mode=k;build();paint();};sm.appendChild(b);});
  $('#caption').textContent=t.cap[state.layout];
  $('#play').textContent=timer?t.pause:t.play;
  const lg=$('#legend');lg.innerHTML='';
  if(state.mode==='block'){['s','p','d','f'].forEach(b=>{lg.insertAdjacentHTML('beforeend','<span><em style="--blk:var(--'+b+')"></em>'+t.blocks[b]+'</span>');});}
  else{t.eras.forEach((n,i)=>{lg.insertAdjacentHTML('beforeend','<span><em style="--blk:var(--e'+i+')"></em>'+n+'</span>');});}
  const ch=$('#chips');ch.innerHTML='';
  MS.forEach((m,i)=>{const b=document.createElement('button');b.type='button';b.className='chip';const tt=m.t[state.lang];
    b.innerHTML='<small>'+tt[0]+'</small>'+tt[1];b.setAttribute('aria-pressed',state.m===i);b.onclick=()=>pickMilestone(i);ch.appendChild(b);});
  card();renderRefs();
  cells.forEach((c,i)=>{const e=EL[i];c.title=(state.lang==='zh'?e.zh+' ':'')+e.en+' · Z='+e.z+' · '+yl(e);});
  showSel();updYear();
}
function card(){
  const el=$('#card');if(state.m<0){el.innerHTML='';return;}
  const m=MS[state.m],tt=m.t[state.lang];
  el.innerHTML='<div class="when"></div><h3></h3><p class="body"></p><p class="note"></p><p class="srcs"></p>';
  el.children[0].textContent=tt[0];el.children[1].textContent=tt[1];el.children[2].textContent=tt[2];el.children[3].textContent=tt[3];
  const sr=el.children[4];sr.append(T().srcLabel+' ');
  m.r.forEach(n=>{const a=document.createElement('a');a.href='#ref-'+n;a.dataset.ref=n;a.textContent='['+n+']';sr.appendChild(a);});
}
function renderRefs(){
  const t=T(),ul=$('#refList');ul.innerHTML='';
  REFS.forEach(r=>{
    const li=document.createElement('li');li.id='ref-'+r.n;
    const a=document.createElement('a');a.href=r.url;a.target='_blank';a.rel='noopener';a.textContent=r.title;
    li.append('['+r.n+'] ',a,' — '+r.by);
    const u=document.createElement('span');u.className='use';u.textContent=r.use[state.lang];li.appendChild(u);
    ul.appendChild(li);
  });
  const d=$('#refDisc');d.innerHTML='';
  t.refDisc.forEach(x=>{const li=document.createElement('li');li.textContent=x;d.appendChild(li);});
}
$('#card').addEventListener('click',ev=>{
  const a=ev.target.closest('a[data-ref]');if(!a)return;
  ev.preventDefault();
  const li=document.getElementById('ref-'+a.dataset.ref);if(!li)return;
  li.scrollIntoView({block:'center'});li.classList.add('flash');setTimeout(()=>li.classList.remove('flash'),1800);
});
function showSel(){
  const t=T(),el=$('#selinfo');
  if(state.sel==null){el.textContent=t.pick;return;}
  const e=EL[state.sel-1];
  el.textContent=(state.lang==='zh'?e.zh+' ':'')+e.en+' ('+e.s+') · Z='+e.z+' · '+t.disc+' '+yl(e)+' · '+t.per.replace('{n}',e.per)+' · '+t.bl.replace('{b}',e.b);
}
function updYear(){
  $('#yr').textContent=state.year;slider.value=state.year;
  const n=EL.filter(e=>e.y<=state.year).length;
  $('#count').textContent=T().known+' '+n+' / 118';
}

function labelsFor(k){
  const L=[];
  if(k==='mend'){['I','II','III','IV','V','VI','VII'].forEach((t,c)=>L.push({k:'c',c,s:1,t}));L.push({k:'c',c:7,s:3,t:'VIII',sp:1});for(let r=0;r<12;r++)L.push({k:'r',r,t:String(r+1)});}
  else if(k==='long'){for(let c=0;c<18;c++)L.push({k:'c',c,s:1,t:String(c+1)});for(let r=0;r<7;r++)L.push({k:'r',r,t:String(r+1)});L.push({k:'r',r:8,t:'57–70'});L.push({k:'r',r:9,t:'89–102'});}
  else if(k==='wide'){L.push({k:'c',c:0,s:2,t:'s',sp:1},{k:'c',c:2,s:14,t:'f',sp:1},{k:'c',c:16,s:10,t:'d',sp:1},{k:'c',c:26,s:6,t:'p',sp:1});for(let r=0;r<7;r++)L.push({k:'r',r,t:String(r+1)});}
  else{L.push({k:'c',c:0,s:14,t:'f',sp:1},{k:'c',c:14,s:10,t:'d',sp:1},{k:'c',c:24,s:6,t:'p',sp:1},{k:'c',c:30,s:2,t:'s',sp:1});for(let r=0;r<8;r++)L.push({k:'r',r,t:String(r+1)});}
  return L;
}
function relayout(){
  const k=state.layout,d=DIM[k];
  const avail=scroll.clientWidth-20-LG;
  pitch=Math.max(30,Math.min(46,Math.floor(avail/d.cols)));
  stage.style.setProperty('--cs',(pitch-3)+'px');
  stage.style.width=(LG+d.cols*pitch)+'px';stage.style.height=(TG+d.rows*pitch)+'px';
  stage.querySelectorAll('.lab').forEach(n=>n.remove());
  labelsFor(k).forEach(l=>{
    const n=document.createElement('div');n.className='lab'+(l.sp?' span':'');n.textContent=l.t;
    if(l.k==='c'){n.style.cssText='left:'+(LG+l.c*pitch)+'px;top:0;width:'+(l.s*pitch-3)+'px;height:'+(TG-4)+'px';}
    else{n.style.cssText='left:0;top:'+(TG+l.r*pitch)+'px;width:'+(LG-6)+'px;height:'+(pitch-3)+'px';}
    stage.appendChild(n);
  });
  cells.forEach((c,i)=>{
    const p=POS(k,EL[i]);
    if(p){last[i]=[LG+p[1]*pitch,TG+p[0]*pitch];}
    const q=last[i]||[LG,TG];
    c.style.transform='translate('+q[0]+'px,'+q[1]+'px)';
  });
}
function paint(){
  const k=state.layout;
  cells.forEach((c,i)=>{
    const e=EL[i],p=POS(k,e),known=e.y<=state.year,gap=k==='mend'&&GAP[e.z];
    c.classList.toggle('hide',!p);
    c.classList.toggle('ghost',!!gap&&!known);
    c.classList.toggle('pred',!!gap&&known);
    c.classList.toggle('off',!!p&&!known&&!gap);
    c.classList.toggle('hl',state.hl.has(e.z));
    c.classList.toggle('sel',state.sel===e.z);
    c.querySelector('b').textContent=(gap&&!known)?'?':e.s;
    c.style.setProperty('--blk',state.mode==='block'?'var(--'+e.b+')':'var(--e'+era(e.y)+')');
  });
}
function stop(){if(timer){clearInterval(timer);timer=null;$('#play').textContent=T().play;}}
function pickMilestone(i){
  stop();const m=MS[i];state.m=i;if(m.layout)state.layout=m.layout;
  state.year=m.y;state.hl=new Set(m.hl);build();relayout();paint();
}
$('#play').onclick=()=>{
  if(timer){stop();return;}
  if(state.year>=MAXY)state.year=MINY;
  state.hl=new Set();state.m=-1;
  timer=setInterval(()=>{state.year=Math.min(MAXY,state.year+2);paint();updYear();if(state.year>=MAXY)stop();},70);
  build();paint();
};
slider.addEventListener('input',()=>{stop();state.year=+slider.value;paint();updYear();});
$('#bzh').onclick=()=>{state.lang='zh';build();};
$('#ben').onclick=()=>{state.lang='en';build();};
let rz;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{relayout();},120);});

build();relayout();paint();
</script>

</body>
</html>
