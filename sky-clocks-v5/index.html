<meta charset="utf-8">
<title>三重天文钟</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,500;1,6..72,400&display=swap">
<style>
/* Layout: parameter strip on top, then three instrument cards in a wrapping grid; each card = dial + readout. Look: cyanotype star chart (blueprint paper, indigo ink, one copper/gold sun). */
:root{
  --bg:#e8eef3; --panel:#f5f8fa; --ink:#13283b; --ink2:#506478; --line:#b4c3cf; --faint:#d5dfe7;
  --sun:#c26a14; --lit:#fbf6e2; --dark:#3a556f; --sign:#0d7773; --earth:#2f6f9a; --autumn:#a4452c; --saturn:#6a4c9c;
  --tint-a:rgba(19,40,59,.10); --tint-b:rgba(19,40,59,.035); --day:rgba(194,106,20,.30);
  --display:'Newsreader',Georgia,'Songti SC','Noto Serif SC',serif;
  --sans:'IBM Plex Sans','PingFang SC','Noto Sans SC','Microsoft YaHei',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#09131d; --panel:#0e1c2a; --ink:#dce8f1; --ink2:#8ea6b9; --line:#2a4054; --faint:#182a3b;
    --sun:#f2b650; --lit:#eef3f7; --dark:#1b2f43; --sign:#52d3c7; --earth:#5aa6d8; --autumn:#e08a63; --saturn:#b8a0f2;
    --tint-a:rgba(220,232,241,.09); --tint-b:rgba(220,232,241,.03); --day:rgba(242,182,80,.24);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#09131d; --panel:#0e1c2a; --ink:#dce8f1; --ink2:#8ea6b9; --line:#2a4054; --faint:#182a3b;
  --sun:#f2b650; --lit:#eef3f7; --dark:#1b2f43; --sign:#52d3c7; --earth:#5aa6d8; --autumn:#e08a63; --saturn:#b8a0f2;
  --tint-a:rgba(220,232,241,.09); --tint-b:rgba(220,232,241,.03); --day:rgba(242,182,80,.24);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink); font:14px/1.55 var(--sans);
  padding-block:28px 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.wrap{max-width:1360px;margin:0 auto;display:grid;gap:22px}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px 24px;padding-top:26px}
.eyebrow{margin:0 0 4px;font:500 11px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ink2)}
h1{margin:0;font:italic 400 clamp(32px,5.5vw,52px)/1.02 var(--display);letter-spacing:-.01em;text-wrap:balance}
.now{text-align:right;min-width:0}
.now .big{font:500 clamp(22px,3.2vw,32px)/1.1 var(--mono);font-variant-numeric:tabular-nums}
.now .sub{font:400 12px var(--mono);color:var(--ink2);font-variant-numeric:tabular-nums}
.side{min-width:0}
.lang{
  position:fixed;z-index:50;
  top:calc(env(safe-area-inset-top,0px) + 10px);
  right:max(16px,env(safe-area-inset-right,0px));
  display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;
  background:color-mix(in srgb,var(--panel) 55%,transparent);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  opacity:.72;transition:opacity .15s;
}
.lang:hover,.lang:focus-within{opacity:1}
.lang button{border:0;border-radius:0;background:transparent;padding:6px 14px;font:500 12px var(--mono);letter-spacing:.06em;color:var(--ink)}
.lang button[aria-pressed=true]{background:color-mix(in srgb,var(--ink) 82%,transparent);color:var(--bg)}
.controls{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:14px 16px;
  background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;
}
label{display:grid;gap:5px;min-width:0;font-size:12px;color:var(--ink2);letter-spacing:.03em}
input,select,button{
  font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);
  border-radius:6px;padding:7px 9px;min-width:0;width:100%;
}
input[type=number],input[type=date],input[type=time]{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums}
input[type=range]{padding:0;accent-color:var(--sun);border:0;background:transparent}
button{cursor:pointer;width:auto;font-size:13px}
button:hover{border-color:var(--ink2)}
:is(input,select,button):focus-visible{outline:2px solid var(--sign);outline-offset:1px}
.btns{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px}
.clocks{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:20px;align-items:start}
.clock{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;display:grid;gap:12px;min-width:0}
.clock .head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
h2{margin:0;font:500 22px/1.2 var(--display)}
.en{font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink2)}
.cap{margin:0;color:var(--ink2);font-size:13px;text-wrap:pretty}
svg{width:100%;height:auto;display:block;max-width:100%}
.slider{grid-template-columns:auto 1fr auto;align-items:center;gap:10px}
.slider output{font:500 12px var(--mono);color:var(--ink)}
dl.rd{display:grid;grid-template-columns:auto 1fr;gap:3px 16px;margin:0;font-size:13px}
dl.rd dt{color:var(--ink2)}
dl.rd dd{margin:0;text-align:right;font:500 13px var(--mono);font-variant-numeric:tabular-nums;min-width:0;overflow-wrap:anywhere}
.moonrow{display:flex;align-items:center;gap:14px}
.moonrow svg{width:64px;flex:none}
footer{color:var(--ink2);font-size:12px;display:grid;gap:4px;max-width:90ch}
footer p{margin:0}
/* dial styling */
.rg{fill:none;stroke:var(--line);stroke-width:1}
.tk{stroke:var(--ink2);stroke-width:1;fill:none}
.tk2{stroke:var(--ink);stroke-width:1.6;fill:none}
.num{font:500 11px var(--mono);fill:var(--ink2);text-anchor:middle;dominant-baseline:central}
.num.hi{fill:var(--ink);font-weight:500}
.glyph{font:400 17px var(--sans);font-family:'Segoe UI Symbol','Apple Symbols','Noto Sans Symbols 2','Noto Sans Symbols',var(--sans);fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.zn{font:500 9px var(--sans);fill:var(--ink2);text-anchor:middle;dominant-baseline:central}
.lab{font:500 9px var(--mono);fill:var(--ink2);text-anchor:middle;letter-spacing:.08em}
.sname{font:500 16px var(--display);fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.sdate{font:400 9px var(--mono);fill:var(--ink2);text-anchor:middle;dominant-baseline:central}
</style>

<div class="lang" role="group" aria-label="语言 / Language">
  <button type="button" data-lang="zh" aria-pressed="true" aria-keyshortcuts="L">中文</button>
  <button type="button" data-lang="en" aria-pressed="false" aria-keyshortcuts="L">EN</button>
</div>

<div class="wrap">
  <header>
    <div>
      <p class="eyebrow" data-i18n="eyebrow"></p>
      <h1 data-i18n="h1"></h1>
    </div>
    <div class="side">
      <div class="now" aria-live="off">
        <div class="big" id="nowLocal">--</div>
        <div class="sub" id="nowUtc">--</div>
      </div>
    </div>
  </header>

  <section class="controls" data-i18n-aria="paramAria">
    <label for="city"><span data-i18n="city"></span><select id="city"></select></label>
    <label for="lat"><span data-i18n="lat"></span><input id="lat" type="number" step="0.0001" min="-90" max="90"></label>
    <label for="lon"><span data-i18n="lon"></span><input id="lon" type="number" step="0.0001" min="-180" max="180"></label>
    <label for="date"><span data-i18n="date"></span><input id="date" type="date"></label>
    <label for="time"><span data-i18n="time"></span><input id="time" type="time" step="1"></label>
    <label for="off"><span data-i18n="off"></span><input id="off" type="number" step="0.5" min="-12" max="14"></label>
    <label for="speed"><span data-i18n="speed"></span>
      <select id="speed">
        <option value="1" selected data-i18n="sp1"></option>
        <option value="0" data-i18n="sp0"></option>
        <option value="60" data-i18n="sp60"></option>
        <option value="3600" data-i18n="sp3600"></option>
        <option value="86400" data-i18n="sp86400"></option>
        <option value="2629800" data-i18n="sp2629800"></option>
      </select>
    </label>
    <div class="btns">
      <button id="bNow" type="button" data-i18n="bNow"></button>
      <button id="bH-" type="button" data-i18n="bHm"></button>
      <button id="bH+" type="button" data-i18n="bHp"></button>
      <button id="bD-" type="button" data-i18n="bDm"></button>
      <button id="bD+" type="button" data-i18n="bDp"></button>
      <button id="bM-" type="button" data-i18n="bMm"></button>
      <button id="bM+" type="button" data-i18n="bMp"></button>
    </div>
  </section>

  <main class="clocks">
    <article class="clock">
      <div class="head"><h2 data-i18n="h2_1"></h2></div>
      <p class="cap" data-i18n="cap1"></p>
      <svg viewBox="-262 -262 524 524" role="img" data-i18n-aria="aria1">
        <g id="ecStatic"></g>
        <g id="ecHand"><line x1="0" y1="0" x2="0" y2="-236" stroke="var(--sun)" stroke-width="2"/><path d="M0,-242L-5,-231L5,-231Z" fill="var(--sun)"/></g>
        <circle id="ecSun" r="8" fill="var(--sun)" stroke="var(--panel)" stroke-width="2"/>
        <circle r="5" fill="var(--earth)" stroke="var(--panel)" stroke-width="1.5"/>
        <text class="lab" x="12" y="-8">E</text>
        <text class="lab" id="ecCLab">C</text>
      </svg>
      <label class="slider" for="exag"><span data-i18n="exag"></span><input id="exag" type="range" min="1" max="4" step="0.5" value="3"><output id="exagv" for="exag">×3</output></label>
      <dl class="rd" id="rd1"></dl>
    </article>

    <article class="clock">
      <div class="head"><h2 data-i18n="h2_2"></h2></div>
      <p class="cap" data-i18n="cap2"></p>
      <svg viewBox="-262 -262 524 524" role="img" data-i18n-aria="aria2">
        <g id="mnStatic"></g>
        <g id="mnHand"><line x1="0" y1="-14" x2="0" y2="-188" stroke="var(--ink)" stroke-width="2.4"/><circle cy="-190" r="3.5" fill="var(--ink)"/></g>
        <g id="mnBead">
          <circle r="13" fill="var(--dark)" stroke="var(--ink2)" stroke-width="1"/>
          <path id="mnBeadLit" fill="var(--lit)"/>
          <circle r="13" fill="none" stroke="var(--ink2)" stroke-width="1"/>
        </g>
      </svg>
      <div class="moonrow">
        <svg viewBox="-30 -30 60 60" aria-hidden="true"><circle r="26" fill="var(--dark)" stroke="var(--ink2)"/><path id="mnBig" fill="var(--lit)"/><circle r="26" fill="none" stroke="var(--ink2)"/></svg>
        <dl class="rd" id="rd2" style="flex:1"></dl>
      </div>
    </article>

    <article class="clock">
      <div class="head"><h2 data-i18n="h2_3"></h2></div>
      <p class="cap" data-i18n="cap3"></p>
      <svg viewBox="-262 -262 524 524" role="img" data-i18n-aria="aria3">
        <path id="skDay" fill="var(--day)"/>
        <g id="skStatic"></g>
        <g id="skZ"></g>
        <g id="skGl"></g>
        <path d="M0,-242L-5,-252L5,-252Z" fill="var(--ink)"/>
        <text class="lab" x="0" y="-256">MC</text>
        <g id="hSat"><line x1="0" y1="-26" x2="0" y2="-243" stroke="var(--saturn)" stroke-width="1.2" stroke-dasharray="2 3" stroke-opacity=".75"/></g>
        <g id="satIcon">
          <circle r="3.8" fill="var(--saturn)"/>
          <ellipse rx="8.4" ry="2.6" transform="rotate(-18)" fill="none" stroke="var(--saturn)" stroke-width="1.4"/>
        </g>
        <g id="hAsc"><line x1="0" y1="0" x2="0" y2="-146" stroke="var(--sign)" stroke-width="5" stroke-linecap="round"/><path d="M0,-191L-6,-201L6,-201Z" fill="var(--sign)"/></g>
        <g id="hMoon"><line x1="0" y1="0" x2="0" y2="-196" stroke="var(--ink)" stroke-width="2.6"/><circle cy="-205" r="7.5" fill="var(--panel)" stroke="var(--ink)" stroke-width="2"/></g>
        <g id="hSun"><line x1="0" y1="0" x2="0" y2="-226" stroke="var(--sun)" stroke-width="1.6"/><circle cy="-226" r="8.5" fill="var(--sun)" stroke="var(--panel)" stroke-width="2"/></g>
        <circle r="7" fill="var(--ink)" stroke="var(--panel)" stroke-width="2"/>
      </svg>
      <dl class="rd" id="rd3"></dl>
    </article>
  </main>

  <footer>
    <p data-i18n="foot1"></p>
    <p data-i18n="foot2"></p>
  </footer>
</div>

<script>
/*MATH-START*/
const D2R=Math.PI/180,R2D=180/Math.PI;
const norm=a=>((a%360)+360)%360;
const sin=a=>Math.sin(a*D2R),cos=a=>Math.cos(a*D2R);
const jdOf=ms=>ms/86400000+2440587.5;
const SYN=29.530589;
function sunLon(JD){
  const n=JD-2451545,L=280.460+0.9856474*n,g=norm(357.528+0.9856003*n);
  return{lon:norm(L+1.915*sin(g)+0.020*sin(2*g)),L:norm(L),g,dist:1.00014-0.01671*cos(g)-0.00014*cos(2*g)};
}
function moonPos(JD){
  const T=(JD-2451545)/36525;
  const lon=norm(218.32+481267.881*T+6.29*sin(135.0+477198.87*T)-1.27*sin(259.3-413335.36*T)+0.66*sin(235.7+890534.22*T)+0.21*sin(269.9+954397.74*T)-0.19*sin(357.5+35999.05*T)-0.11*sin(186.5+966404.03*T));
  const lat=5.13*sin(93.3+483202.02*T)+0.28*sin(228.2+960400.89*T)-0.28*sin(318.3+6003.15*T)-0.17*sin(217.6-407332.21*T);
  return{lon,lat};
}
function eclToEq(lon,lat,eps){
  const x=cos(lat)*cos(lon),y=cos(lat)*sin(lon)*cos(eps)-sin(lat)*sin(eps),z=cos(lat)*sin(lon)*sin(eps)+sin(lat)*cos(eps);
  return{ra:norm(Math.atan2(y,x)*R2D),dec:Math.asin(z)*R2D};
}
function angles(LST,lat,eps){
  const t=Math.tan(lat*D2R);
  return{
    asc:norm(Math.atan2(cos(LST),-(sin(LST)*cos(eps)+t*sin(eps)))*R2D),
    mc:norm(Math.atan2(sin(LST),cos(LST)*cos(eps))*R2D)
  };
}
function altOf(dec,H,lat){return Math.asin(sin(dec)*sin(lat)+cos(dec)*cos(lat)*cos(H))*R2D;}
function elong(JD){return norm(moonPos(JD).lon-sunLon(JD).lon);}
function nextPhase(JD,target){
  const f=t=>((elong(t)-target+540)%360)-180;
  let a=JD,fa=f(a);
  for(let i=0;i<140;i++){
    const b=a+0.25,fb=f(b);
    if(fa<0&&fb>=0&&fb-fa<90){let lo=a,hi=b;for(let j=0;j<30;j++){const m=(lo+hi)/2;if(f(m)<0)lo=m;else hi=m;}return(lo+hi)/2;}
    a=b;fa=fb;
  }
  return null;
}
function findSunLon(JD0,target){
  let JD=JD0+norm(target-sunLon(JD0).lon)/0.9856;
  for(let i=0;i<8;i++){const d=((target-sunLon(JD).lon+540)%360)-180;JD+=d/0.9856;}
  return JD;
}
/* Saturn: JPL "Keplerian elements for approximate positions of the major planets", valid 1800-2050 (Saturn within ~0.2 deg) */
const EL_EMB={a:[1.00000261,0.00000562],e:[0.01671123,-0.00004392],I:[-0.00001531,-0.01294668],L:[100.46457166,35999.37244981],w:[102.93768193,0.32327364],O:[0,0]};
const EL_SAT={a:[9.53667594,-0.00125060],e:[0.05386179,-0.00050991],I:[2.48599187,0.00193609],L:[49.95424423,1222.49362201],w:[92.59887831,-0.41897216],O:[113.66242448,-0.28867794]};
function helioXYZ(el,T){
  const v=k=>el[k][0]+el[k][1]*T;
  const a=v('a'),e=v('e'),I=v('I'),L=v('L'),wb=v('w'),Om=v('O');
  const w=wb-Om,M=(((L-wb)%360+540)%360-180)*D2R;
  let E=M+e*Math.sin(M);
  for(let i=0;i<12;i++){const dE=(M-(E-e*Math.sin(E)))/(1-e*Math.cos(E));E+=dE;if(Math.abs(dE)<1e-12)break;}
  const xp=a*(Math.cos(E)-e),yp=a*Math.sqrt(1-e*e)*Math.sin(E);
  const cw=cos(w),sw=sin(w),cO=cos(Om),sO=sin(Om),cI=cos(I),sI=sin(I);
  return[
    (cw*cO-sw*sO*cI)*xp+(-sw*cO-cw*sO*cI)*yp,
    (cw*sO+sw*cO*cI)*xp+(-sw*sO+cw*cO*cI)*yp,
    (sw*sI)*xp+(cw*sI)*yp
  ];
}
function saturnPos(JD){
  const T=(JD-2451545)/36525,s=helioXYZ(EL_SAT,T),e=helioXYZ(EL_EMB,T);
  const x=s[0]-e[0],y=s[1]-e[1],z=s[2]-e[2];
  const lon=norm(Math.atan2(y,x)*R2D+1.396971*T+0.0003086*T*T);
  return{lon,lat:Math.atan2(z,Math.hypot(x,y))*R2D,dist:Math.sqrt(x*x+y*y+z*z)};
}
/*MATH-END*/

/* ---------- localization ---------- */
let lang='zh';
try{const s=localStorage.getItem('skyclocks-lang');if(s==='zh'||s==='en')lang=s;}catch(e){}
const MON_EN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const I18N={
  zh:{
    title:'三重天文钟',eyebrow:'天文钟',h1:'三重天文钟',paramAria:'时间与地点参数',
    city:'城市',lat:'纬度（°N）',lon:'经度（°E）',date:'日期',time:'时间',off:'UTC 偏移（小时）',speed:'走时速度',
    sp1:'实时 ×1',sp0:'暂停',sp60:'1 分钟/秒',sp3600:'1 小时/秒',sp86400:'1 天/秒',sp2629800:'1 个月/秒',
    bNow:'回到现在',bHm:'−1 小时',bHp:'+1 小时',bDm:'−1 天',bDp:'+1 天',bMm:'−1 个月',bMp:'+1 个月',
    h2_1:'偏心钟',
    cap1:'地球在 E（针的轴心），日历圈的圆心 C 偏向远日点一侧。针从 E 穿过圈上的太阳，指向外环的十二宫；日历圈刻有 12 个月与每一天。中间四个扇区是四季，以春分、夏至、秋分、冬至为界，长度并不相等。',
    aria1:'偏心钟：针指向外环十二宫，内圈为 12 个月 365 天刻度',
    exag:'偏心放大',
    rd1_date:'公历日期',rd1_doy:'年内天数',rd1_lon:'太阳黄经 λ',rd1_sign:'所在宫位',rd1_dist:'日地距离',rd1_dev:'放大造成的指针偏差',
    rd1_season:'当前季节',rd1_next:'下一个节点',
    seasons:['春','夏','秋','冬'],terms:['春分','夏至','秋分','冬至'],
    daysFmt:x=>`${x} 天`,
    seasonFmt:(s,n)=>`${s} · ${n?'北半球':'南半球'}`,
    nextFmt:(term,n)=>`${term}，还有 ${n} 天`,
    doyFmt:(d,n)=>`第 ${d} 天 / ${n}`,
    monLabel:m=>`${m+1}月`,
    signFmt:(name,d,m)=>`${name}宫 ${d}°${m}′`,
    h2_2:'月相轨道钟',
    cap2:'从北极上方俯视：地球在中心，太阳在正上方。针指向月亮，小月亮画的是从圆心的地球看到的样子，外环是八个月相。一圈是一个朔望月，29.53 天。',
    aria2:'月相轨道钟：针指向外环月相，一圈 29.53 天',
    rd2_age:'月龄',rd2_illum:'受照比例',rd2_phase:'月相',rd2_elong:'月日黄经差',
    rd2_nNew:'下次新月',rd2_nFirst:'下次上弦',rd2_nFull:'下次满月',rd2_nLast:'下次下弦',
    ageFmt:(a,p)=>`${a} / ${p} 天`,
    h2_3:'24 小时天空钟',

function wallToUtc(W){

  setA($('mnHand'),'transform',`rotate(${f2(D)})`);
  const bp=pt(95,D);setA($('mnBead'),'transform',`translate(${f2(bp[0])},${f2(bp[1])})`);setA($('mnBeadLit'),'d',moonPath(13,phs));
  const idx=Math.floor(((D+22.5)%360)/45);
  for(let i=0;i<8;i++)setA($('mph'+i),'opacity',i===idx?'1':'0');
  setA($('mnBig'),'d',moonPath(26,phs));
  const illum=(1-cos(mo.lat)*cos(D))/2;
  setT(rd2.age,t('ageFmt',(phs*SYN).toFixed(1),SYN.toFixed(2)));
  setT(rd2.illum,(illum*100).toFixed(0)+'%');
  setT(rd2.phase,phName(idx));
  setT(rd2.elong,D.toFixed(1)+'°');
  if(now-nextCache.t>400){
    nextCache={t:now,res:[0,90,180,270].map(t=>nextPhase(JD,t))};
  }
  const nx=nextCache.res,keys=['nNew','nFirst','nFull','nLast'];
  keys.forEach((k,i)=>setT(rd2[k],nx[i]==null?'—':wallStr(jdToUtc(nx[i]),false)));

  /* clock 3 */
  setA($('hSun'),'transform',`rotate(${f2(Hs)})`);
  setA($('hMoon'),'transform',`rotate(${f2(Hm)})`);
  setA($('hAsc'),'transform',`rotate(${f2(Ha)})`);
  setA($('skZ'),'transform',`rotate(${f2(LST)})`);
  for(let i=0;i<12;i++){
    const a=LST-(alpha[i]+alpha[i+1])/2,g=pt(229,a),nn=pt(212,a);
    setA(glyphEls[i],'x',f2(g[0]));setA(glyphEls[i],'y',f2(g[1]));
    setA(nameEls[i],'x',f2(nn[0]));setA(nameEls[i],'y',f2(nn[1]));
  }
  const cH0=-Math.tan(st.lat*D2R)*Math.tan(sEq.dec*D2R);
  let H0=0,rs;
  if(cH0>=1){H0=0;rs=t('polarNight');}else if(cH0<=-1){H0=179.9;rs=t('polarDay');}
  else{H0=Math.acos(cH0)*R2D;rs=`${hm(12-H0/15)} / ${hm(12+H0/15)}`;}
  setA($('skDay'),'d',H0<0.05?'':ring(172,188,-H0,H0));
  setT(rd3.solar,hms(Hs/15+12));
  setT(rd3.lunar,hms(Hm/15+12));
  setT(rd3.asc,signStr(A.asc));
  setT(rd3.mc,signStr(A.mc));
  setT(rd3.lst,hms(LST/15));
  setT(rd3.salt,altOf(sEq.dec,Hs,st.lat).toFixed(1)+'°');
  setT(rd3.malt,altOf(mEq.dec,Hm,st.lat).toFixed(1)+'°');
  setT(rd3.rs,rs);
  const sat=saturnPos(JD),satEq=eclToEq(sat.lon,sat.lat,eps),Hsat=norm(LST-satEq.ra);
  const dSat=((saturnPos(JD+0.5).lon-saturnPos(JD-0.5).lon+540)%360)-180;
  setA($('hSat'),'transform',`rotate(${f2(Hsat)})`);
  const sp=pt(250,Hsat);setA($('satIcon'),'transform',`translate(${f2(sp[0])},${f2(sp[1])})`);
  setT(rd3.sat,hms(Hsat/15+12));
  setT(rd3.satpos,t('satFmt',signStr(sat.lon),dSat<0));
  setT(rd3.satalt,altOf(satEq.dec,Hsat,st.lat).toFixed(1)+'°');
  setT(rd3.satd,sat.dist.toFixed(2)+' AU');

  syncInputs(off);
}

/* ---------- controls ---------- */
const el={city:$('city'),lat:$('lat'),lon:$('lon'),date:$('date'),time:$('time'),off:$('off'),speed:$('speed')};
function fillCities(){el.city.innerHTML=CITIES.map((c,i)=>`<option value="${i}">${lang==='en'?CITY_EN[i]:c[0]}</option>`).join('');el.city.value=st.city;}
function applyLang(){
  const D=I18N[lang];
  document.documentElement.lang=lang==='en'?'en':'zh-CN';
  document.title=D.title;
  document.querySelectorAll('[data-i18n]').forEach(n=>{const v=D[n.dataset.i18n];if(typeof v==='string')n.textContent=v;});
  document.querySelectorAll('[data-i18n-aria]').forEach(n=>{const v=D[n.dataset.i18nAria];if(typeof v==='string')n.setAttribute('aria-label',v);});
  fillCities();
  for(let i=0;i<12;i++){if(nameEls[i])nameEls[i].textContent=sName(i);}
  ecKey='';
  document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===lang)));
}
function setLang(l){
  lang=l;
  try{localStorage.setItem('skyclocks-lang',lang);}catch(e){}
  applyLang();
}
document.querySelectorAll('.lang button').forEach(b=>b.addEventListener('click',()=>setLang(b.dataset.lang)));
document.addEventListener('keydown',e=>{
  if((e.key!=='l'&&e.key!=='L')||e.ctrlKey||e.metaKey||e.altKey)return;
  const tg=e.target&&e.target.tagName;
  if(tg==='INPUT'||tg==='SELECT'||tg==='TEXTAREA')return;
  setLang(lang==='zh'?'en':'zh');
});
function putLatLon(){el.lat.value=st.lat;el.lon.value=st.lon;el.city.value=st.city;}
function syncInputs(off){
  const d=new Date(st.utc+off*60000);
  const ds=`${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`;
  const ts=`${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}:${pad(d.getUTCSeconds())}`;
  if(document.activeElement!==el.date&&el.date.value!==ds)el.date.value=ds;
  if(document.activeElement!==el.time&&el.time.value!==ts)el.time.value=ts;
  const ov=String(off/60);
  if(document.activeElement!==el.off&&el.off.value!==ov)el.off.value=ov;
}
el.city.addEventListener('change',()=>{
  const i=+el.city.value;st.city=i;
  if(i===CUSTOM){st.custOff=offMin()/60;st.tz=null;}
  else{st.lat=CITIES[i][1];st.lon=CITIES[i][2];st.tz=CITIES[i][3];}
  putLatLon();
});
function latLonInput(){
  const la=parseFloat(el.lat.value),lo=parseFloat(el.lon.value);
  if(isFinite(la))st.lat=Math.max(-89.9,Math.min(89.9,la));
  if(isFinite(lo))st.lon=Math.max(-180,Math.min(180,lo));
  st.city=CUSTOM;el.city.value=CUSTOM;
}
el.lat.addEventListener('input',latLonInput);
el.lon.addEventListener('input',latLonInput);
function dtInput(){
  const d=el.date.value.split('-').map(Number),t=el.time.value.split(':').map(Number);
  if(d.length<3||!isFinite(d[0])||t.length<2||!isFinite(t[0]))return;
  st.utc=wallToUtc(Date.UTC(d[0],d[1]-1,d[2],t[0],t[1],t[2]||0));
}
el.date.addEventListener('input',dtInput);
el.time.addEventListener('input',dtInput);
el.off.addEventListener('input',()=>{
  const v=parseFloat(el.off.value);
  if(!isFinite(v))return;
  st.tz=null;st.custOff=v; /* the instant stays; only the wall clock changes */
});
el.speed.addEventListener('change',()=>{st.speed=+el.speed.value;});
function bump(ms){st.utc+=ms;}
function bumpMonth(dir){
  const off=offMin(),d=new Date(st.utc+off*60000);
  const W=Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+dir,d.getUTCDate(),d.getUTCHours(),d.getUTCMinutes(),d.getUTCSeconds());
  st.utc=wallToUtc(W);
}
$('bNow').addEventListener('click',()=>{st.utc=Date.now();});
$('bH-').addEventListener('click',()=>bump(-3600000));
$('bH+').addEventListener('click',()=>bump(3600000));
$('bD-').addEventListener('click',()=>bump(-86400000));
$('bD+').addEventListener('click',()=>bump(86400000));
$('bM-').addEventListener('click',()=>bumpMonth(-1));
$('bM+').addEventListener('click',()=>bumpMonth(1));
$('exag').addEventListener('input',()=>{st.exag=+$('exag').value;$('exagv').textContent='×'+st.exag;});

/* ---------- start ---------- */
buildMoon();buildSky();putLatLon();applyLang();
let last=performance.now();
function frame(now){
  const dt=now-last;last=now;
  if(st.speed)st.utc+=dt*st.speed;
  render(now);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
