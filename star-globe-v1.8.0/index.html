const DET={Sirius:["希腊语 Seirios，意为灼热者。","古埃及人以它的偕日升预告尼罗河泛滥。1844年贝塞尔从其运动的周期摆动推断有看不见的伴星；1862年克拉克用新望远镜首次直接看到它，即天狼星B，是最早被发现的白矮星之一。","From Greek Seirios, scorching.","Its heliacal rising signalled the Nile flood in ancient Egypt. In 1844 Bessel inferred an unseen companion from its wobble; in 1862 Alvan Graham Clark first saw it, Sirius B, one of the first white dwarfs found."],
Polaris:["拉丁语 stella polaris，意为极星。","岁差使极星不断更替：约公元前2700年是天龙座右枢，公元14000年前后将是织女星。1852年起就有人怀疑它会变光，1911年赫茨普龙证实它是造父变星；1779年威廉·赫歇尔发现了它的伴星。","Latin stella polaris, pole star.","Precession changes the pole star: Thuban around 2700 BC, Vega near AD 14000. Variability was suspected from 1852 and Hertzsprung confirmed it as a Cepheid in 1911; William Herschel found its companion in 1779."],
Vega:["阿拉伯语 al-nasr al-waqi，意为俯冲的鹰。","1850年邦德和惠普尔在哈佛天文台拍下它，是太阳之外首颗被拍摄的恒星；1872年德雷珀拍到了它的光谱。1983年红外卫星IRAS发现它周围有尘埃盘，是首颗被发现有尘埃盘的恒星。","Arabic al-nasr al-waqi, the swooping eagle.","In 1850 Bond and Whipple photographed it at Harvard, the first star besides the Sun to be photographed; Draper photographed its spectrum in 1872. In 1983 IRAS found a dust disk around it, the first star found to have one."],
Betelgeuse:["阿拉伯语 yad al-jawza（猎户之手）或 ibt al-jawza（猎户的腕下），经中世纪欧洲抄写讹误成今名。","1836年约翰·赫歇尔发现其亮度变化。1920年迈克耳孙和皮斯用干涉仪测出它的角直径，是太阳之外首颗被测出大小的恒星。2019至2020年出现罕见的大暗化。","Arabic yad al-jawza, hand of Orion, or ibt al-jawza, armpit of Orion; the name was garbled in medieval European copying.","John Herschel noted its variability in 1836. In 1920 Michelson and Pease measured its angular diameter, the first star besides the Sun to be sized. It dimmed dramatically in 2019-2020."],
Rigel:["阿拉伯语 rijl，意为脚，指猎户之左足。","1831年前后斯特鲁维发现其近旁的伴星。它是蓝超巨星，光度约为太阳的十万倍。","Arabic rijl, foot: the left foot of Orion.","Struve discovered its companion around 1831. It is a blue supergiant roughly 100,000 times as luminous as the Sun."],
Antares:["希腊语 Anti-Ares，意为火星的对手，因颜色似火星。","位于黄道旁，常被月掩。1819年毕尔格在一次月掩中报告看到它的伴星，起初被疑为大气效应，1846年才得到确认。中国称心宿二，又名大火，古代用来定季节。","Greek Anti-Ares, rival of Mars, for its red colour.","Close to the ecliptic, it is often occulted by the Moon; Burg reported its companion during an occultation in 1819; doubted at first as an atmospheric effect, it was confirmed in 1846. In China it is Da Huo, used to mark the seasons."],
Algol:["阿拉伯语 ra's al-ghul，意为魔鬼之头（美杜莎之首）。","1667年蒙塔纳里记录其变光；1782至1783年古德里克测得周期，并提出是暗伴星周期性遮挡所致；1889年福格尔以光谱证实，它是首颗确认的食变星。","Arabic ra's al-ghul, the demon's head (Medusa).","Montanari recorded its variation in 1667; Goodricke measured its period in 1782-83 and proposed that a dark companion eclipses it; Vogel confirmed this by spectroscopy in 1889, making it the first known eclipsing binary."],
Aldebaran:["阿拉伯语 al-dabaran，意为追随者，因其追随昴星团升起。","1864年哈金斯与米勒发表恒星光谱研究，辨认出它光谱中铁、钠、钙、镁等元素的谱线。1993年起发现其视向速度有长周期变化，曾被推测有行星，2015年报告支持，2019年新数据又使其受到质疑。中国称毕宿五，属二十八宿的毕宿。","Arabic al-dabaran, the follower, as it follows the Pleiades.","In 1864 Huggins and Miller identified lines of elements such as iron, sodium, calcium and magnesium in its spectrum. Long-period velocity changes seen since 1993 suggested a planet, supported in 2015 but doubted again by 2019 data. In China it belongs to the lunar mansion Bi."],
Regulus:["拉丁语，意为小国王；约1514年哥白尼采用此名。","位于黄道旁，月和行星常从其近旁经过，自古用来定位和占候。中国称轩辕十四。","Latin, little king; the name was used by Copernicus around 1514.","Lying almost on the ecliptic, it is often passed by the Moon and planets, and served as a reference point since antiquity."],
Spica:["拉丁语 spica，意为麦穗，对应室女座手中的麦穗。","据信喜帕恰斯借助它的位置数据发现了岁差（约前127年前后）。埃及底比斯一座约公元前3200年建造的神庙正对着它，岁差使它的位置逐渐偏离。","Latin spica, ear of grain, held by Virgo.","Hipparchus is believed to have used its position to discover precession around 127 BC. A temple at Thebes built about 3200 BC was aligned to it, an alignment later eroded by precession."],
Arcturus:["希腊语 Arktouros，意为守熊者，因紧随大熊座。","1718年哈雷对比古人记录，发现它、天狼星和南河三的位置已变，这是恒星自行的首次发现。","Greek Arktouros, bear guardian, as it follows Ursa Major.","In 1718 Halley compared ancient records and found that it, Sirius and Procyon had moved: the discovery of proper motion."],
Fomalhaut:["阿拉伯语 fam al-hut，意为鱼之口。","1983年IRAS发现其红外过量，说明周围有尘埃盘。哈勃在2004和2006年拍到盘内侧的天体 Fomalhaut b，2008年报告为行星候选，后续研究倾向它是尘埃云而非行星。","Arabic fam al-hut, mouth of the fish.","IRAS found an infrared excess in 1983, revealing a dust disk. Hubble images from 2004 and 2006 showed Fomalhaut b near the disk, reported in 2008 as a planet candidate; later work favours a dust cloud over a planet."]};
Object.assign(DET,{Canopus:["可能源自希腊神话中墨涅拉俄斯的舵手卡诺珀斯。","中国称老人星，被视为寿星，在南半球才看得清。航天器常以它为姿态基准，1964年水手4号就锁定它来定向。","Probably named for Canopus, helmsman of Menelaus in Greek myth.","Known in China as the Old Man star, a symbol of longevity. Spacecraft use it as a navigation reference; Mariner 4 locked onto it in 1964."],Capella:["拉丁语 capella，小母山羊，御夫座怀抱的山羊。","1899年坎贝尔与纽沃尔各自独立发现它是分光双星；1914年弗鲁耶尔姆发现远处的暗伴星，1936年确认这颗伴星本身也是双星，所以它是四合星系。","Latin capella, little she-goat, carried by Auriga.","In 1899 Campbell and Newall independently found it to be a spectroscopic binary; Furuhjelm found a distant faint companion in 1914, and in 1936 that companion was shown to be a binary too, making Capella a quadruple system."],Procyon:["希腊语 Prokyon，犬之先，因比天狼星先升起。","1844年贝塞尔推断它有伴星；1896年沙贝勒发现了这颗白矮星伴星。","Greek Prokyon, before the dog, as it rises before Sirius.","Bessel inferred a companion in 1844; Schaeberle found the white dwarf Procyon B in 1896."],Achernar:["阿拉伯语 akhir al-nahr，河流的尽头，指波江座的末端。","自转极快，形状明显扁平。2003年甚大望远镜干涉仪测得其赤道半径远大于极半径。","Arabic akhir al-nahr, the end of the river (Eridanus).","It spins so fast that it is markedly flattened; in 2003 the VLT interferometer measured an equatorial radius much larger than the polar one."],"Rigil Kent":["阿拉伯语 rijl qanturis，半人马之足。","1689年传教士里歇在印度观测彗星时发现它是双星。亨德森在1832至1833年观测，1839年发表视差，是最早测出距离的恒星之一，仅次于贝塞尔对天鹅座61的测量。1915年英尼斯发现更近的比邻星。","Arabic rijl qanturis, foot of the Centaur.","Richaud noticed it was double in 1689 while observing a comet in India. Henderson observed it in 1832-33 and published its parallax in 1839, second only to Bessel’s 61 Cygni. Innes found the still closer Proxima in 1915."],Altair:["阿拉伯语 al-nasr al-ta'ir，飞翔的鹰。","中国称河鼓二，即牛郎星，与织女星隔银河相望，对应七夕传说。自转很快，2007年干涉成像直接显示出它扁平的外形。","Arabic al-nasr al-ta'ir, the flying eagle.","In China it is the Cowherd star, facing Vega across the Milky Way in the Qixi legend. It spins rapidly; interferometric imaging in 2007 showed its flattened shape."],Deneb:["阿拉伯语 dhanab al-dajajah，母鸡的尾巴。","中国称天津四，天津是银河上的渡口。它与织女星、河鼓二构成夏季大三角。视差极小，距离长期不确定，约两千多光年。","Arabic dhanab al-dajajah, tail of the hen.","It forms the Summer Triangle with Vega and Altair. Its parallax is tiny and its distance has long been uncertain, around two thousand light-years."],Castor:["希腊神话中双子之一卡斯托尔。","1678年卡西尼分辨出它是双星；1803年威廉·赫歇尔证明两星互相绕转，是最早确认的物理双星之一。后来发现整个系统由六颗星组成。","Castor of the Gemini twins in Greek myth.","Cassini resolved it as a double in 1678; in 1803 William Herschel showed the two orbit each other, among the first physical binaries confirmed. The system is now known to have six stars."],Pollux:["希腊神话中双子的另一位，波吕克斯。","2006年有研究报告发现它周围有一颗巨行星 Pollux b，2013年和2021年的后续研究对其存在提出质疑，目前仍属待确认的候选行星。","Pollux, the other of the Gemini twins.","In 2006 a giant planet, Pollux b, was reported around it; studies in 2013 and 2021 questioned it, so it remains a candidate."],Mizar:["阿拉伯语 mi'zar，腰带或披风。","1650年里乔利发现它是第一对望远镜下才看出的双星；1857年邦德拍下它，是首批被拍摄的双星；1889年皮克林发现 Mizar A 本身是第一颗分光双星，整个系统后来被确认是四合星。中国称开阳，北斗第六星。","Arabic mi'zar, girdle or cloak.","Riccioli found it to be the first telescopic double star in 1650; Bond photographed it in 1857, among the first double stars photographed; in 1889 Pickering found Mizar A itself to be the first spectroscopic binary, and the system proved to be a quadruple. In China it is Kaiyang, sixth star of the Dipper."],Dubhe:["阿拉伯语 thahr al-dubb al-akbar，大熊之背。","中国称天枢，北斗第一星。从天璇经过天枢连线，延长约五倍的距离就是北极星，所以这两颗星被称为指极星。","Arabic thahr al-dubb al-akbar, back of the Great Bear.","Called Tianshu in China, first star of the Dipper. The line from Merak through Dubhe, extended about five times, leads to Polaris, hence the Pointers."],Alphard:["阿拉伯语 al-fard，孤独者，因周围缺少亮星。","中国称星宿一，属二十八宿的星宿。它位于长蛇座，是这条南天巨蛇的心脏。","Arabic al-fard, the solitary one, for the lack of bright stars nearby.","In China it is Xingsu 1, in the lunar mansion Xing. It marks the heart of Hydra, the long southern serpent."],Alcyone:["希腊神话中普勒阿得斯七姐妹之一阿尔库俄涅。","1767年米歇尔用统计方法论证昴星团不是偶然排列，而是真实成团的星。中国称昴宿六，日本称昴为すばる。","Alcyone, one of the seven Pleiades sisters in Greek myth.","In 1767 Michell argued statistically that the Pleiades are a true cluster, not a chance alignment. In China it is Maosu 6."]});Object.assign(DET,{Alioth:["阿拉伯语 alyat al-hamal，意为羊的肥尾；另有说法认为由 al-jaun（黑马）讹变而来。","大熊座最亮的星，被列入传统天文导航用的58颗星。它是化学特殊星。北斗七星中除天枢和摇光外的五颗星运动方向一致，属于同一个移动星群，这一点由天文学家普洛克特注意到。中国称玉衡，北斗第五星。","Arabic alyat al-hamal, the sheep's fat tail; some suggest a corruption of al-jaun, the black horse.","Brightest star of Ursa Major and one of the 58 traditional navigation stars; a chemically peculiar star. All Dipper stars except Alkaid and Dubhe drift the same way, as the astronomer Proctor noticed. In China it is Yuheng, fifth star of the Dipper."],Alkaid:["阿拉伯语 qa'id banat na'sh，意为棺架之女的领队，别名 Benetnash。","北斗斗柄末端的星，是肉眼可见最热的恒星之一，也是传统导航用的58颗星之一。它和天枢不属于其余五星的移动星群，所以数万年后北斗的形状会改变。中国称摇光，北斗第七星。","Arabic qa'id banat na'sh, the leader of the daughters of the bier; also called Benetnash.","Tip of the Dipper's handle, one of the hottest naked-eye stars and one of the 58 navigation stars. With Dubhe it is outside the moving group of the other five Dipper stars, so the Dipper's shape will change within tens of thousands of years. In China it is Yaoguang, seventh star of the Dipper."],Megrez:["阿拉伯语 al-maghriz，意为基部，指大熊尾巴的根部。","北斗七星中最暗的一颗，A型主序星，距离约80光年。从天权经过天玑的连线延长，可以找到狮子座的轩辕十四。中国称天权，北斗第四星。","Arabic al-maghriz, the base, where the Bear's tail meets its body.","The faintest Dipper star, a white main-sequence A star about 80 light-years away. A line from Megrez through Phecda leads to Regulus in Leo. In China it is Tianquan, fourth star of the Dipper."],Merak:["阿拉伯语 al-maraqq，意为腰、胁部。","它和天枢是指极星：从天璇经过天枢连线，延长约五倍的距离就是北极星。猫头鹰星云M97和星系M108在它与天玑的连线上，更靠近天璇。中国称天璇，北斗第二星。","Arabic al-maraqq, the loins or flank.","With Dubhe it forms the Pointers: extend the line through Dubhe about five times to reach Polaris. The Owl Nebula M97 and galaxy M108 lie on the line from Merak to Phecda, closer to Merak. In China it is Tianxuan, second star of the Dipper."],Phecda:["阿拉伯语 fakhd ad-dubb，意为熊的大腿。","北斗斗身最南端的星，A型星，有一颗通过天体测量发现的橙矮星伴星。中国称天玑，北斗第三星。","Arabic fakhd ad-dubb, the thigh of the bear.","Southernmost star of the Dipper's bowl, a white A star with an orange dwarf companion detected astrometrically. In China it is Tianji, third star of the Dipper."],Bellatrix:["拉丁语，意为女战士，俗称亚马逊之星；阿拉伯传统称它为猎户的左肩。","1603年拜耳将它定名为猎户座γ。它的亮度来自高温而不是巨大的体积，是肉眼可见最热的星之一。1963年它被选作定义UBV星等系统的标准星之一，1971年又成为B2 III型光谱的标准星。中国称参宿五。","Latin for female warrior, nicknamed the Amazon Star; Arabic tradition called it Orion's left shoulder.","Johann Bayer labelled it Gamma Orionis in 1603. Its brightness comes from high temperature rather than great size. In 1963 it was among the standards defining the UBV magnitude system, and in 1971 it became the B2 III spectral standard. In China it is Shen 5."],Alnilam:["阿拉伯语，意为成串的珍珠。","猎户腰带中央最亮的一颗，距离约1340光年，是猎户座主要亮星里最远的，B型蓝超巨星，质量流失很快。中国称腰带三星为参宿，它是参宿二。","Arabic, a string of pearls.","The central and brightest belt star, about 1,340 light-years away, the farthest of Orion's major stars; a blue supergiant losing mass quickly. In China the three belt stars form the mansion Shen; Alnilam is Shen 2."],Alnitak:["阿拉伯语，意为腰带。","猎户腰带最东端的一颗，是三合星系，主星是夜空中最亮的O型蓝超巨星。中国称参宿一；参宿的字面意思是三，因腰带三星得名。","Arabic, the girdle.","Easternmost belt star, a triple system whose primary is the brightest O-type star in the night sky. In China it is Shen 1; the mansion Shen means three, after the belt's three stars."],Saiph:["阿拉伯语 saif al-jabbar，意为巨人之剑。","位于猎户的右膝（脚），距离和大小与参宿七相近，看上去却暗得多。中国称参宿六。","Arabic saif al-jabbar, sword of the giant.","Orion's right knee or foot, at a distance and size similar to Rigel's yet much fainter. In China it is Shen 6."],Meissa:["阿拉伯语，意为闪亮者；旧星图也称 Heka，意为发旋。","标出猎户的头部，与参宿四、参宿五构成近似等边三角形。它是多星系统，主星是O8型热蓝巨星，距离一千多光年。中国称觜宿一。","Arabic, the shining one; older atlases also call it Heka, the hair whorl.","It marks Orion's head and forms a near-equilateral triangle with Betelgeuse and Bellatrix. A multiple system led by a hot O8 blue giant over a thousand light-years away. In China it is Zi 1."],Mintaka:["古阿拉伯历书称它为成串珍珠中的第一颗。","猎户腰带最西端的一颗，几乎正好位于天赤道上，所以大致从正东升起、正西落下。中国称参宿三。","Old Arabic calendar: the first in the string of pearls.","Westernmost belt star, lying almost exactly on the celestial equator, so it rises roughly due east and sets due west. In China it is Shen 3."],Acrux:["由 Alpha 和 Crux 拼合而成，1833年由伯里特在他的星图中创造。","南十字座最亮的星，也是最靠南的1等星。它其实是两颗几乎相同的B型星组成的双星，小望远镜就能分开。从南门二经过马腹一的连线延长，会指向南十字。中国称十字架二。","Coined from Alpha plus Crux by Elijah Burritt in his 1833 star atlas.","Brightest star of the Southern Cross and the southernmost first-magnitude star. It is really two nearly identical B stars, split by a small telescope. Extending the line from Alpha through Beta Centauri points toward the Cross."],Mimosa:["名称来历不明，可能取自同名的含羞草植物；别名 Becrux，由 Beta 和 Crux 拼合而成。","南十字座第二亮星，蓝白色，距离约280光年，可见光亮度超过太阳三千倍。它和天津四一样亮，都是1.25等。澳大利亚和新西兰的国旗上都有它。中国称十字架三。","Origin uncertain, possibly from the flowering mimosa plants; also called Becrux, from Beta plus Crux.","Second-brightest star of Crux, blue-white, about 280 light-years away and over 3,000 times the Sun's visible luminosity. As bright as Deneb at magnitude 1.25. It appears on the flags of Australia and New Zealand."],Gacrux:["由 Gamma 和 Crux 拼合而成，是20世纪中叶航海历书编者创造的名字。","南十字的顶端，红橙色，已耗尽大部分核燃料，膨胀并冷却到约3500开，距离只有88光年。它和其余蓝白色亮星形成鲜明的颜色对比。中国称十字架一。","Coined from Gamma plus Crux by a nautical almanac editor in the mid-20th century.","Top of the Southern Cross, a red-orange giant that has burned most of its fuel and cooled to about 3,500 K, only 88 light-years away. Its colour contrasts with the blue-white stars of Crux."],Hadar:["阿拉伯语词根意为在地面上或定居之地，可能指它在低纬度看来贴近地平线；别名 Agena，源自拉丁语 genua，膝盖。","半人马座第二亮星，由三颗星组成，其中至少一颗是仙王β型脉动变星。它与南门二合称南方指极星，指向南十字。中国称马腹一，意为马腹的第一颗星。","Arabic root meaning on the ground or settled area, perhaps for its low position seen from low latitudes; also Agena, from Latin genua, knees.","Second-brightest star of Centaurus, a triple system with at least one Beta Cephei pulsator. With Alpha Centauri it forms the Southern Pointers toward the Southern Cross. In China it is Mafu 1, the first star of the horse's belly."],Menkent:["阿拉伯语，意为半人马的肩膀。","橙色的K型巨星，距离约61光年，是半人马座用于导航的三颗星之一，另两颗是南门二和马腹一。中国称库楼三。","Arabic, the shoulder of the Centaur.","An orange K giant about 61 light-years away, one of three Centaurus stars used for navigation with Rigil Kentaurus and Hadar."]});Object.assign(DET,{Shaula:["阿拉伯语 al-shaulah，意为举起的（尾巴），即蝎子的毒刺。","蝎尾弯钩末端的星，天蝎座第二亮，全天第24亮，距离约571光年。它与尾宿九合称猫眼。巴西国旗上有它。中国称尾宿八，属尾宿。","Arabic al-shaulah, the raised (tail): the scorpion's sting.","Tip of the curved tail, second-brightest in Scorpius and 24th-brightest in the sky, about 571 light-years away. With Lesath it forms the Cat's Eyes. It appears on the flag of Brazil."],Lesath:["名称来历曲折，据《现代星名词典》，最初可能源自希腊语中意为雾状团块的词；后来也与蝎针同义。","与尾宿八在天上看起来紧挨着，实际并不近：尾宿八约571光年，它约576光年，两者相距约5光年。两星合称猫眼，是蝎子的毒刺。中国称尾宿九。","The name has a long convoluted history, perhaps from a Greek word for a foggy cluster; it also came to mean the sting.","It looks close to Shaula but the two are about 5 light-years apart in space, at about 571 and 576 light-years from us. Together they are the Cat's Eyes, the scorpion's stinger."],Sargas:["苏美尔语起源，含义不明；旧星表中称 Girtab，来自苏美尔语 GIR.TAB，意为蝎子。","位于蝎尾弯曲处，天蝎座第三亮，1.84等，是双星。巴西国旗上有它。中国称尾宿五。","Of Sumerian origin, meaning unknown. Older atlases call it Girtab, from Sumerian GIR.TAB, the scorpion.","Sits where the tail curves, third-brightest in Scorpius at magnitude 1.84; a binary. It appears on the flag of Brazil. In China it is Wei 5."],Graffias:["Acrab 源自阿拉伯语 al-'aqrab，意为蝎子；Graffias 源自希腊语，意为蟹螯（爪），与天蝎座ξ共用此名。","多星系统，主星是两颗蓝白色主序星，与房宿三等一起构成蝎子的王冠。中国称房宿四。","Acrab is from Arabic al-'aqrab, the scorpion; Graffias is from a Greek word for the claws, shared with Xi Scorpii.","A multiple system whose main pair are blue-white stars; it forms the Crown of the Scorpion with Dschubba and Fang. In China it is Fang 4."],Dschubba:["阿拉伯语 al-jabhah，意为额头，指蝎子的前额；旧星表称 Iclarkrau，意为蝎子的王冠。","蝎子王冠中间的一颗，是多星系统，亮度在约1.6到2.3等之间变化。2016年国际天文联合会正式批准此名。中国称房宿三。","From Arabic al-jabhah, the forehead of the scorpion; older atlases used Iclarkrau, the crown of the scorpion.","Middle star of the Crown of the Scorpion, a multiple system whose brightness varies between about 1.6 and 2.3. The IAU approved the name in 2016. In China it is Fang 3."],Larawag:["名字来自澳大利亚北部的瓦尔达曼人：Larawag 是成年礼仪式中的信号观察者，负责发出安全信号。","橙色的K1型巨星，2.31等，也在巴西国旗上。中国称尾宿二。","From the Wardaman people of northern Australia: Larawag is the signal watcher who gives the all-clear in an initiation ceremony.","An orange K1 giant at magnitude 2.31, also on the flag of Brazil. In China it is Wei 2."],Schedar:["阿拉伯语 sadr，意为胸，指它标出王后的心口。","橙色的K0型巨星，距离约228光年，2.24等。它被怀疑是变星，但19世纪以来没有观测到明显变光。中国称王良四，属王良星官，王良是传说中的驾车名手。","Arabic sadr, breast: it marks the queen's heart.","An orange K0 giant about 228 light-years away at magnitude 2.24. Suspected variable, though no variation has been seen since the 19th century. In China it is Wangliang 4, part of the charioteer asterism."],Caph:["阿拉伯语 al-kaff，意为手掌。","黄白色的F2型巨星，距离仅约55光年，是W形五颗星中最近也最暗的一颗。中国称王良一。","Arabic al-kaff, the palm or hand.","A yellow-white F2 giant only about 55 light-years away, the nearest and faintest of the five stars of the W. In China it is Wangliang 1."],Navi:["没有传统名称。Navi 是阿波罗1号指令长格里森中间名 Ivan 倒着拼；中文名策，意为马鞭。","1960年代格里森在任务星图上开玩笑地把它标作 Navi，后来的阿波罗宇航员沿用以纪念他。它是Be型星，也是仙后座γ型爆发变星的原型，亮度在约1.6到3.0等之间不规则变化，有时比王良四更亮。距离约550光年。","No traditional name. The nickname is Ivan spelled backwards, from Apollo 1 commander Gus Grissom's middle name; the Chinese name means whip.","In the 1960s Grissom jokingly named it Navi on his mission charts, and later Apollo astronauts kept using it as a memorial. It is a Be star, the prototype of a class of eruptive variables, ranging from about 1.6 to 3.0 and sometimes outshining Schedar. About 550 light-years away."],Ruchbah:["阿拉伯语 rukbah，意为膝。","大陵型食变星，周期约两年，变光约0.1等。从策星经过阁道三连线延长，能找到英仙座和天船三。中国称阁道三。","Arabic rukbah, the knee.","An Algol-type eclipsing binary with a period of about two years, varying by about 0.1 magnitude. A line from Gamma Cassiopeiae through Ruchbah leads to Perseus and Mirfak. In China it is Gedao 3."],Alpheratz:["源自阿拉伯语短语，意为马的肚脐，现在常译作马的肩膀。","仙女座的头部，也是飞马座大四边形的东北角；古代曾被算作飞马座的一部分，阿拉图斯说它同时是马的肚脐和仙女的头。它是紧密的双星，也是传统导航星之一。它与壁宿一构成中国的壁宿，即墙壁。中国称壁宿二。","From an Arabic phrase for the horse's navel, now often rendered the horse's shoulder.","Head of Andromeda and the northeast corner of the Great Square; in old lore Aratus said it was shared by the horse's navel and Andromeda's head. A tight binary and a navigation star. With Algenib it forms the Chinese mansion Bi, the Wall."],Mirach:["可能是阿拉伯语中意为腰的词 mizar 经多次抄写拼错而成。","冷红巨星，距离约200光年。它可用来寻找仙女座星系：从奎宿九经过仙女座μ，再延长同样的距离就是M31。中国称奎宿九。","Probably a misspelling, through repeated copying, of the Arabic mizar, loin.","A cool red giant about 200 light-years away. Use it to find the Andromeda Galaxy: go from Mirach to Mu Andromedae, then the same distance again."],Markab:["阿拉伯语，意为可乘骑之物，如鞍或船。","飞马座大四边形的一角，白色，传统上位于马的肩或翼。中国称室宿一。","Arabic for something ridden on, such as a saddle or ship.","A white star marking a corner of the Great Square of Pegasus, traditionally the horse's shoulder or wing. In China it is Shi 1."],Scheat:["名称来源不确定。","位于飞马的左腿，是橙红色的变星，亮度变化明显。阿拉伯人把大四边形看作水桶，称它为上方的出水口。中国称室宿二。","Origin uncertain.","A deep yellow-red variable giant on the horse's leg, whose brightness varies considerably. Arabs saw the Great Square as a water bucket and called Scheat its upper spout. In China it is Shi 2."],Algenib:["阿拉伯语 al-janb，意为侧面或胁部；曾同时用于飞马座γ和英仙座α。","B2型蓝白色亚巨星，距离约390光年，是大四边形四颗星中最暗的一颗。2016年国际天文联合会把 Algenib 定给飞马座γ，英仙座α定名 Mirfak。壁宿由它和壁宿二构成，是北方玄武七宿之一。中国称壁宿一。","Arabic al-janb, the side or flank; once shared with Alpha Persei.","A blue-white B2 subgiant about 390 light-years away, the faintest corner of the Great Square. In 2016 the IAU assigned the name to Gamma Pegasi and Mirfak to Alpha Persei. In China it is Bi 1; the Wall mansion is formed by Algenib and Alpheratz."],Enif:["阿拉伯语，意为天马的鼻子或口鼻部。","飞马座最亮的星，橙色超巨星，2.39等。中国称危宿三。","Arabic for the nose or muzzle of the winged horse.","Brightest star of Pegasus, an orange supergiant of magnitude 2.39. In China it is Wei 3."],Mirfak:["源自阿拉伯语 al-mirfaq al-thurayya，意为昴星团的肘。","黄色超巨星，旧时也叫 Algenib。从策星经过阁道三连线延长，线上最亮的星就是它。中国称天船三。","From Arabic al-mirfaq al-thurayya, the elbow of the Pleiades.","A yellow supergiant, once also called Algenib. Find it by extending the line from Gamma Cassiopeiae through Ruchbah. In China it is Tianchuan 3."]});Object.assign(DET,{Adhara:['阿拉伯语 adhara，意为处女们。','17世纪星表称它为第一贞女，它与弧矢一和 Aludra 等合称贞女们。双星系统，距离约430光年，1.50等，是大犬座第二亮星。中国称弧矢七。','Arabic adhara, the virgins.','A 17th-century catalogue called it the First Virgin; it is one of the Virgins with Wezen and Aludra. A binary about 430 light-years away at magnitude 1.50, second-brightest in Canis Major. In China it is Hushi 7.'],Wezen:['阿拉伯语 al-wazn，意为重量。','旧称第三贞女。黄白色F型超巨星，半径约为太阳的237倍，距离约1800光年，1.83等，位于大犬的后腿。属中国的弧矢星官，称弧矢一。','Arabic al-wazn, weight.','Once called the Third Virgin. A yellow-white F supergiant about 237 solar radii across, roughly 1,800 light-years away at magnitude 1.83, at the Great Dog’s hind quarters. In China it is Hushi 1, of the Bow and Arrow asterism.'],Mirzam:['阿拉伯语 al-mirzam，意为报信者，因为它比天狼星先升起。','蓝白色亮巨星，是仙王β型变星，亮度在1.95到2.00等之间微变，距离约500光年。中国称军市一。','Arabic al-mirzam, the herald, because it rises before Sirius.','A blue-white bright giant and Beta Cephei variable, varying slightly between magnitude 1.95 and 2.00, about 500 light-years away. In China it is Junshi 1.'],Elnath:['阿拉伯语 an-nath，意为顶撞，指公牛的角。','位于金牛座与御夫座交界，曾兼有御夫座γ的编号；这个名字旧时也用于娄宿三。蓝白色巨星，距离约131光年，1.65等，是金牛的北角。中国称五车五。','Arabic an-nath, the butting, of the bull’s horns.','On the border with Auriga, it once also carried the designation Gamma Aurigae; the name was once used for Hamal too. A blue-white giant about 131 light-years away at magnitude 1.65, the bull’s northern horn. In China it is Wuche 5.'],Tianguan:['中国星官名，天关，意为天上的关口。','日蚀双星，每133天绕转一周，距离约440光年。蟹状星云M1在它西北约1度，是1054年超新星的遗迹，中国天文学家有记录。国际天文联合会2017年批准使用此名。','Chinese name Tianguan, the Celestial Gate.','An eclipsing binary with a 133-day orbit, about 440 light-years away. The Crab Nebula M1 lies about one degree northwest, the remnant of the supernova of 1054 recorded by Chinese astronomers. The IAU approved the name in 2017.'],Hamal:['阿拉伯语 al-ra’s al-hamal，意为羊头；原指整个白羊座。','黄色巨星，距离约66光年，2.0等，是白羊座最亮的星。旧时也叫 El Nath，这个名字后来专属金牛座的五车五。中国称娄宿三。','Arabic al-ra’s al-hamal, the head of the sheep; at first it named the whole constellation Aries.','A yellow giant about 66 light-years away at magnitude 2.0, the brightest star in Aries. It was once also called El Nath, a name that later went to Beta Tauri. In China it is Lou 3.'],Sheratan:['阿拉伯语 sharatayn，意为两个标记。','白羊座第二亮星，与娄宿三和 Mesarthim 构成一个扁平的三角形，是认白羊座的标志。从奎宿九经过娄宿三与娄宿一之间连线延长，指向鲸鱼座的头部。中国称娄宿一。','Arabic sharatayn, the two signs.','Second-brightest in Aries; with Hamal and Mesarthim it forms a flat triangle that identifies the constellation. A line from Mirach passing between Hamal and Sheratan points toward the head of Cetus. In China it is Lou 1.'],Menkar:['阿拉伯语 manhar，意为鼻孔。','尽管名字是鼻孔，它标出的是鲸鱼座的颌部。红巨星，距离约249光年，2.53等。它与土司空同属58颗导航星。中国称天囷一。','Arabic manhar, nostril.','Despite the name it marks the jaws of Cetus. A red giant about 249 light-years away at magnitude 2.53, one of the 58 navigation stars along with Diphda. In China it is Tianjun 1.'],Diphda:['阿拉伯语 al-difdi，意为青蛙；别名 Deneb Kaitos，意为鲸鱼的尾巴。','鲸鱼座最亮的星，2.04等，位于鲸鱼的尾部，也是58颗导航星之一。中国称土司空。','Arabic al-difdi, the frog; also Deneb Kaitos, the tail of Cetus.','Brightest star of Cetus at magnitude 2.04, in the whale’s tail, and one of the 58 navigation stars. In China it is Tusikong.'],Alrescha:['阿拉伯语 ar-risha，意为绳子，指系住两条鱼的绳结。','望远镜下是一对双星，距离约150光年。位于鲸鱼座土司空与金牛座昴星团之间的大约中点。中国称外屏七，外屏是屏风的意思。','Arabic ar-risha, the cord: the knot that ties the two fish together.','A telescopic binary about 150 light-years away, roughly midway between Diphda and the Pleiades. In China it is Waiping 7, of the Outer Fence asterism.'],Alpherg:['阿拉伯语 al-farigh，意为倾出、流水。','双鱼座最亮的星，3.6等，是黄色巨星，距离约350光年。1878年业余天文学家伯纳姆发现它是双星，轨道周期约850年。中国称右更二，右更是掌管牧场的官员。','Arabic al-farigh, the flow or pouring of water.','Brightest star in Pisces at magnitude 3.6, a yellow giant about 350 light-years away. In 1878 the amateur astronomer S. W. Burnham found it to be a binary with a period of about 850 years. In China it is Yougeng 2, the Official in Charge of the Pasturing.'],Miaplacidus:['名字来历不确定，可能是阿拉伯语 miyah（水）和拉丁语 placidus（平静）的合成，意为平静的水；这一说法由希金斯于1882年提出。','这个名字最早出现在伯里特1856年的星图中。它是船底座第二亮星，蓝白色巨星，1.68等。中国称南船五，属南船星官。','Uncertain; possibly Arabic miyah, waters, plus Latin placidus, placid, proposed by Higgins in 1882.','The name first appears in Burritt’s 1856 star atlas. Second-brightest in Carina, a blue-white giant at magnitude 1.68. In China it is Nanchuan 5, of the Southern Boat asterism.'],Alnair:['阿拉伯语 an-nayyir，意为明亮的。','天鹤座最亮的星，1.74等，是南天的58颗导航星之一。中国称鹤一。','Arabic an-nayyir, the bright one.','Brightest star of Grus at magnitude 1.74 and one of the southern navigation stars. In China it is He 1.'],Atria:['由希腊字母α与拉丁语 triangulum（三角）缩合而成，意为南三角座α。','橙色巨星，距离约415光年，1.92等，是南三角座最亮的星，也是58颗导航星之一。它离南天极不远，有时被称作南极星，但远不及北极星离北天极那样近。中国称三角形三。','A coined contraction of alpha and triangulum: Alpha Trianguli Australis.','An orange giant about 415 light-years away at magnitude 1.92, brightest in Triangulum Australe and a navigation star. It is sometimes called a south pole star, though nowhere near as close to the pole as Polaris. In China it is Sanjiaoxing 3.'],Peacock:['没有传统名称；名字取自它所在的孔雀座。','英国航海历书局在1930年代为航空历书补取名字的两颗星之一，另一颗是船底座的 Avior。它也是58颗导航星之一。中国称孔雀十一。','No traditional name; named for its constellation Pavo, the Peacock.','One of two stars given names by the Nautical Almanac Office in the 1930s for the Air Almanac, the other being Avior in Carina. A navigation star. In China it is Kongque 11.'],'Kaus Australis':['阿拉伯语 qaws（弓）加拉丁语 australis（南方的），意为南边的弓。','人马座最亮的星，1.85等，标出射手弓的南端，是茶壶的一部分，也是58颗导航星之一。古阿卡德人把它与 Kaus Media、Alnasl合称燕子。中国称箕宿三。','Arabic qaws, bow, plus Latin australis, southern: the southern bow.','Brightest star in Sagittarius at magnitude 1.85, marking the southern tip of the Archer’s bow, part of the Teapot, and a navigation star. Ancient Akkadians grouped it with Kaus Media and Alnasl as the Swallow. In China it is Ji 3.'],'Kaus Media':['阿拉伯语 qaws（弓）加拉丁语 media（中间的），意为弓的中段。','标出射手弓的中点，是茶壶的一部分。阿拉伯天文学把它与 Kaus Australis 等几颗星看作下水的鸵鸟。中国称箕宿二。','Arabic qaws, bow, plus Latin media, middle: the middle of the bow.','Marks the midpoint of the Archer’s bow, part of the Teapot. Arab astronomy saw it with Kaus Australis and others as an ostrich going down to the water. In China it is Ji 2.'],'Kaus Borealis':['阿拉伯语 qaws（弓）加拉丁语 borealis（北方的），意为北边的弓。','标出射手弓的北端，2.82等，距离约78光年，是茶壶的一部分。中国称斗宿二。','Arabic qaws, bow, plus Latin borealis, northern: the northern bow.','Marks the northern tip of the Archer’s bow at magnitude 2.82, about 78 light-years away, part of the Teapot. In China it is Dou 2.'],Nunki:['名称源自古代巴比伦，具体含义有分歧。','茶壶斗柄一侧的亮星，是蓝白色B型星，也是58颗导航星之一。阿拉伯天文学把它与周围几颗星看作另一群鸵鸟。中国称斗宿四。','Of ancient Babylonian origin; the exact meaning is disputed.','A bright star of the Teapot, a blue-white B star and one of the 58 navigation stars. Arab astronomy saw it and its neighbours as another group of ostriches. In China it is Dou 4.'],Dabih:['阿拉伯语 sa’d al-dhabih，意为屠夫的幸运星。','摩羯座β，肉眼可以分开成一对的双星。它属于阿拉伯月宿里以 Sa’d（幸运）命名的一组星。中国称牛宿二。','Arabic sa’d al-dhabih, the lucky star of the slaughterer.','Beta Capricorni, a double star that can be split by the naked eye. It belongs to the Arabic group of stars named Sa’d, luck. In China it is Niu 2.'],'Deneb Algedi':['阿拉伯语 dhanab al-jady，意为山羊的尾巴。','摩羯座最亮的星，2.87等，位于海山羊的尾部。中国称垒壁阵四。','Arabic dhanab al-jady, the tail of the goat.','Brightest star in Capricornus at magnitude 2.87, in the sea-goat’s tail. In China it is Leibizhen 4.'],Sadalsuud:['阿拉伯语 sa’d al-su’ud，意为吉中之吉。','水瓶座最亮的星，是一颗黄色超巨星。它属于以 Sa’d（幸运）命名的一组星。中国称虚宿一。','Arabic sa’d al-su’ud, luck of lucks.','Brightest star in Aquarius, a yellow supergiant. It belongs to the Arabic Sa’d, luck, group of stars. In China it is Xu 1.'],Sadalmelik:['阿拉伯语 sa’d al-malik，意为国王的幸运星。','水瓶座α，黄色超巨星，同属以 Sa’d（幸运）命名的一组星。中国称危宿一。','Arabic sa’d al-malik, the lucky star of the king.','Alpha Aquarii, a yellow supergiant, one of the Arabic Sa’d, luck, group. In China it is Wei 1.'],Menkalinan:['阿拉伯语 mankib dhi al-’inan，意为持缰绳者的肩膀，指御夫的肩。','A型星，距离约82光年，是一个食双星系统，每约4天绕转一周。从五车五到五车三，都是御夫座的亮星。中国称五车三。','Arabic mankib dhi al-’inan, the shoulder of the rein-holder.','A white A star about 82 light-years away, an eclipsing binary that orbits about every 4 days. It marks the charioteer’s shoulder. In China it is Wuche 3.'],Alhena:['阿拉伯语 al-han’ah，意为骆驼颈上的烙印；也叫 Almeisan，意为闪亮者。','白色亚巨星，距离约105光年，1.93等，位于双子座的南足。中国称井宿三。','Arabic al-han’ah, the brand on a camel’s neck; also Almeisan, the shining one.','A white subgiant about 105 light-years away at magnitude 1.93, in the foot of one of the Twins. In China it is Jing 3.'],Algieba:['阿拉伯语 al-jabhah，意为前额，指狮子的前额。','望远镜下是一对金黄色的双星，1782年威廉·赫歇尔首次观测到，距离约126光年。它位于狮子座镰刀状星群中。中国称轩辕十二。','Arabic al-jabhah, the forehead of the lion.','A fine golden telescopic double first observed by William Herschel in 1782, about 126 light-years away, in the Sickle of Leo. In China it is Xuanyuan 12.'],Denebola:['阿拉伯语 dhanab al-asad，意为狮子的尾巴；古希腊称 Alkaia，意同。','它与大角星、角宿一构成春季大三角，距离只有约36光年，2.14等。中国称五帝座一。','Arabic dhanab al-asad, the tail of the lion; the ancient Greek name Alkaia meant the same.','With Arcturus and Spica it forms the Spring Triangle; only about 36 light-years away, magnitude 2.14. In China it is Wudizuo 1.'],Vindemiatrix:['拉丁语，意为采摘葡萄的女子；希腊诗人阿拉图斯称它为 Protrygater。','位于室女座一只手的末端，室女座第三亮星，距离约110光年，质量约为太阳的2.6倍。它在黎明前升起，曾被用来预告葡萄收获的季节。中国称东次将。','Latin, the grape-harvestress; Aratus called it Protrygater.','At the end of one of Virgo’s hands, the third-brightest star in Virgo, about 110 light-years away and about 2.6 solar masses. Its dawn rising was used to herald the grape harvest. In China it is Dongcijiang.'],Porrima:['古罗马预言女神的名字。','双星系统，两颗星近乎等亮。2016年国际天文联合会决定只给单颗星命名，才把此名正式给了其中一颗。中国称东上相。','Named for the Roman goddess of prophecy.','A binary of two nearly equal stars. In 2016 the IAU decided to name individual stars, and the name was assigned to one of them. In China it is Dongshangxiang.'],Altarf:['阿拉伯语 al-tarf，意为眼睛或目光。','巨蟹座最亮的星，亮度约为太阳的660倍。巨蟹座很暗，古人曾称它为暗黑之宫。中国称柳宿增十。','Arabic al-tarf, the eye or glance.','Brightest star in Cancer, about 660 times as luminous as the Sun. Cancer is so faint that it was called the Dark Sign. In China it is Liu Zeng 10.'],Acubens:['阿拉伯语 al-zubana，意为螯、钳。','巨蟹座α，是巨蟹座第四亮星，白色A型星。中国称柳宿增三。','Arabic al-zubana, the claw.','Alpha Cancri, fourth-brightest in Cancer, a white A star. In China it is Liu Zeng 3.'],'Asellus Australis':['拉丁语，意为南方的小驴。','巨蟹座δ，橙色巨星，与 Asellus Borealis 分别位于蜂巢星团M44的南北两侧。中国称鬼宿四。','Latin, the southern ass colt.','Delta Cancri, an orange giant, one of the two donkeys flanking the Beehive Cluster M44 with Asellus Borealis. In China it is Gui 4.'],'Asellus Borealis':['拉丁语，意为北方的驴。','巨蟹座γ，白色亚巨星，距离约158光年，位于蜂巢星团M44北侧。中国称鬼宿三。','Latin, the northern ass.','Gamma Cancri, a white subgiant about 158 light-years away, on the north side of the Beehive Cluster M44. In China it is Gui 3.'],Kochab:['名称在文艺复兴时期才出现，含义不确定，一说是阿拉伯语中北极星一词的缩略。','小熊座第二亮星，橙色巨星，距离约131光年。因岁差，公元前约1100年它距北天极只有约7度，是当时的极星之一。2014年报告发现了一颗围绕它的气体巨行星。中国称北极二，代表帝，即皇帝。','The name appeared in the Renaissance and its meaning is uncertain; possibly a shortened Arabic phrase for the north star.','Second-brightest in Ursa Minor, an orange giant about 131 light-years away. Because of precession it lay about 7 degrees from the north celestial pole around 1100 BC. A gas giant planet was announced around it in 2014. In China it is Beiji 2, representing the emperor.'],Rasalhague:['阿拉伯语 ra’s al-hawwa，意为蛇夫的头。','蛇夫座最亮的星，是双星，2.1等，位于夏季大三角附近。中国称候。','Arabic ra’s al-hawwa, the head of the serpent bearer.','Brightest star in Ophiuchus, a binary at magnitude 2.1, near the Summer Triangle. In China it is Hou.'],Almach:['阿拉伯语 al-’anaq al-ard，指沙漠中的猞猁；另一说是大地上的小母山羊。','仙女座α、β、γ三星连成一线，指向英仙座，它是末端的一颗。在望远镜里是金黄色与蓝色相伴的双星。中国称天大将军一。','Arabic al-’anaq al-ard, the desert lynx or caracal; another reading is the she-kid of the land.','The third of the chain Alpheratz, Mirach and Almach leading toward Perseus. In a telescope it is a golden and blue double. In China it is Tiandajiangjun 1.'],Eltanin:['阿拉伯语 at-tinnin，意为大蛇。','天龙座最亮的星。1725年布拉德利为测量恒星视差而观测它，1728年却意外发现了光行差，这证实了地球在绕太阳公转。1873年艾里称它为现代天文学的诞生之星。它靠近伦敦的天顶，因而叫天顶星。中国称天棓四。','Arabic at-tinnin, the great serpent.','Brightest star in Draco. In 1725 Bradley began observing it to measure parallax, and in 1728 he instead discovered the aberration of light, evidence that Earth moves around the Sun. In 1873 Airy called it the birth-star of modern astronomy. It passes near the zenith of London. In China it is Tianbang 4.'],Sadr:['阿拉伯语 sadr，意为胸；17世纪的星表称它为母鸡的胸。','天鹅座的中心，北十字的交点，黄白色F型超巨星，周围有发射星云IC 1318。中国称天津一，天津是银河上的渡口。','Arabic sadr, chest; a 17th-century catalogue called it the hen’s chest.','Centre of Cygnus and the junction of the Northern Cross, a yellow-white F supergiant surrounded by the emission nebula IC 1318. In China it is Tianjin 1, the Celestial Ford.'],Albireo:['这个名字是误解和误译的结果；原本的阿拉伯语是 al-minhar al-dajajah，意为母鸡的喙。','它在天鹅的头部，小望远镜里是金黄色与蓝色的著名双星。19世纪后期哈佛用德雷珀望远镜拍摄时，发现主星光谱是复合的。2021年的研究认为两颗星很可能同源，但未必成束缚。中国称辇道增七。','The name results from a misunderstanding and mistranslation of Arabic al-minhar al-dajajah, the hen’s beak.','At the swan’s head, a famous golden and blue double in a small telescope. In the late 19th century, photography with the Draper telescope at Harvard showed the primary’s spectrum to be composite. A 2021 study found the stars likely share an origin, though probably unbound. In China it is Liandao Zeng 7.'],Gienah:['阿拉伯语 janah，意为翼。','天鹅座ε，橙色K0型巨星，距离约73光年，是北十字横臂的一端。它与乌鸦座γ共用这个名字。中国称天津九。','Arabic janah, the wing.','Epsilon Cygni, an orange K0 giant about 73 light-years away, one end of the Northern Cross’s crossbeam. It shares the name with Gamma Corvi. In China it is Tianjin 9.'],Tarazed:['可能来自波斯语 shahin tarazu，意为天平的横梁。','橙色巨星，年龄约2.7亿年。它与河鼓二、河鼓一构成中国的河鼓星官；在牛郎织女的传说里，河鼓一和河鼓三是牛郎与织女的孩子。中国称河鼓三。','Possibly from Persian shahin tarazu, the beam of the scale.','An orange giant about 270 million years old. With Altair and Beta Aquilae it forms the Chinese River Drum asterism; in the Cowherd and Weaver Girl tale, Beta and Gamma Aquilae are their children. In China it is Hegu 3.'],Alphecca:['阿拉伯语 al-fakkah，意为分开、不完整，指北冕座这个缺口的圆环。','别名 Gemma，拉丁语意为宝石。它是食双星，距离约75光年，也是大熊座移动星群的成员。中国称贯索四。','Arabic al-fakkah, broken apart: the incomplete circle of Corona Borealis.','Also called Gemma, Latin for jewel. An eclipsing binary about 75 light-years away and a member of the Ursa Major moving group. In China it is Guansuo 4.'],Zubenelgenubi:['阿拉伯语 al-zubana al-janubiyy，意为南边的爪，指蝎子的南钳。','古代它属于天蝎座，被看作蝎子的钳子；后来天秤座单独成座，名字却保留了下来。双筒望远镜就能把它分成一对双星。中国称氐宿一。','Arabic al-zubana al-janubiyy, the southern claw of the scorpion.','In ancient times it belonged to Scorpius as a claw; when Libra became its own constellation the name stayed. Binoculars split it into a double. In China it is Di 1.'],Zubeneschamali:['阿拉伯语 al-zubana al-shamaliyy，意为北边的爪，指蝎子的北钳。','天秤座最亮的星，2.6等。许多观察者说它带绿色，它可能是肉眼唯一能看出绿色的星，但它是蓝白色的热星，原因至今有争议。中国称氐宿四。','Arabic al-zubana al-shamaliyy, the northern claw of the scorpion.','Brightest star in Libra at magnitude 2.6. Many observers report a greenish tint, perhaps the only naked-eye star that looks green, though it is a hot blue-white star and the reason is debated. In China it is Di 4.']});const L={zh:{sp:"光谱型",et:"词源",hi:"历史与发现",wk:"维基百科（英文）",cl:{O:"蓝色",B:"蓝白色",A:"白色",F:"黄白色",G:"黄色",K:"橙色",M:"红色"}},en:{sp:"Spectral class",et:"Etymology",hi:"History & discovery",wk:"Wikipedia (EN)",cl:{O:"blue",B:"blue-white",A:"white",F:"yellow-white",G:"yellow",K:"orange",M:"red"}}};
